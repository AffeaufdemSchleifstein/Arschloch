      '<div class="p10hand">'+H.filter(c=>!staged.has(c)).map(c=>p10Card(c,(p10Sel.has(c)?'sel':'')+(G.last===c&&my?' new':''),'data-a="p10-sel" data-v="'+c+'" data-key="h'+c+'"')).join('')+'</div>'+
      (p10Stage.length?'<div class="p10stage">'+p10Stage.map((gc,i)=>'<div><small>Gruppe '+(i+1)+'</small><div class="p10gc">'+gc.map(c=>p10Card(c,'mini')).join('')+'</div></div>').join('')+'<button class="small ghost" data-a="p10-unstage">Zurücknehmen</button></div>':'');
    if(my&&!G.drew)panel='<div class="panel act"><b>Du bist dran – zieh eine Karte</b><div class="row"><button data-a="p10-draw" data-v="deck">🂠 Vom Stapel</button><button class="ghost" data-a="p10-draw" data-v="disc" '+(top1!=null&&!p10S(top1)?'':'disabled')+'>Ablage nehmen</button></div></div>';
    else if(my){
      const def=P10_PH[G.ph[me_]],layBtns=G.laid[me_]?'':
        (def.length>1&&p10Stage.length<def.length-1?'<button class="ghost" data-a="p10-stage" '+(p10Sel.size?'':'disabled')+'>Gruppe '+(p10Stage.length+1)+' merken</button>':'<button data-a="p10-lay" '+(p10Sel.size?'':'disabled')+'>✅ Phase auslegen</button>')+'<button class="ghost" data-a="p10-hint">💡 Vorschlag</button>';
      panel='<div class="panel act"><b>'+(G.laid[me_]?'Leg passende Karten an die ausgelegten Gruppen an – oder wirf ab':'Wähl Karten für deine Phase – oder wirf eine Karte ab')+'</b>'+
        '<div class="row wrap">'+layBtns+'<button class="'+(G.laid[me_]?'':'ghost')+'" data-a="p10-disc" '+(p10Sel.size===1?'':'disabled')+'>Abwerfen</button></div>'+(G.laid[me_]&&p10Sel.size===1?'<span class="note">Tipp auf eine leuchtende Gruppe zum Anlegen.</span>':'')+'</div>';
    }else panel='<p class="note" style="text-align:center">'+(G.turn>=0?esc(nm(G,G.turn))+' ist dran …':'')+(G.skip[me_]?' · Du musst einmal aussetzen ⏭':'')+'</p>';
    panel+='<button class="ghost" data-a="p10-block">📒 Punkte</button>';
  }else mine='<p class="note" style="text-align:center">Du schaust zu.</p>';
  const pz=G.paused?'<div class="pausebox">⏸ Pausiert von '+esc(G.paused.by)+(mySeat()>=0&&(!G.paused.uid||G.paused.uid===myId)?'<button data-a="unpause">Weiterspielen</button>':'')+'</div>':'';
  setHTML(app,top+'<div class="opps'+(n>3?' many':'')+'">'+opps+'</div>'+table+pz+laid+mine+panel);
}
const P10_RULES_TXT='<details><summary>Regeln Phase 10</summary>Wer zuerst alle 10 Phasen der Reihe nach schafft, gewinnt. Jeder bekommt 10 Karten.<br><br>'+
  '<b>Die Phasen:</b> '+P10_TXT.map((t,i)=>(i+1)+'. '+t).join(' · ')+'.<br>Drilling/Vierling = gleiche Zahlen, Folge = aufeinanderfolgende Zahlen (Farbe egal), Farbe = gleiche Farbe.<br><br>'+
  '<b>Dein Zug:</b> Zieh vom Stapel oder nimm die oberste Karte der Ablage. Wenn du kannst, leg deine Phase komplett aus. Danach darfst du Karten an alle ausliegenden Gruppen anlegen. Zum Schluss wirfst du eine Karte ab.<br><br>'+
  '<b>Joker</b> ersetzen jede Zahl und Farbe (jede Gruppe braucht aber mindestens eine echte Karte). <b>Aussetzen</b> wirfst du ab und bestimmst, wer einmal aussetzen muss.<br><br>'+
  '<b>Rundenende:</b> Wer keine Karten mehr hat, beendet die Runde. Wer seine Phase geschafft hat, macht nächste Runde mit der nächsten weiter, die anderen wiederholen. Strafpunkte für Handkarten: 1–9 = 5, 10–12 = 10, Aussetzen = 15, Joker = 25. Schaffen mehrere Phase 10 gleichzeitig, gewinnt wer die wenigsten Punkte hat.</details>';

// ===================== Qwixx =====================
const QX_CLS=['qr','qy','qg','qb'];
function qxDie(v,cls){return v==null?'':'<span class="qd '+cls+'">'+dieHtml(v,'','')+'</span>'}
function qxAct(a,v){
  const s=mySeat(),g=clone(G);if(s<0)return true;
  switch(a){
    case 'qx-roll':if(qxRoll(g,s)){sfx('deal');commit(g)}return true;
    case 'qx-w':if(qxWhite(g,s,+v)){sfx(+v>=0?'deal':'pop');commit(g)}return true;
    case 'qx-c':{if(v==='-1'){if(G.wc[s]===-1){openModal('<h2>❌ Fehlwurf?</h2><p class="note">Du hast in diesem Zug noch nichts angekreuzt. Wenn du jetzt passt, bekommst du einen Fehlwurf (−5 Punkte).</p><div class="row"><button data-a="qx-c-ok">Ja, passen</button><button class="ghost" data-a="modal-x">Zurück</button></div>');return true}
      if(qxColor(g,s,-1))commit(g);return true}
      const [wi,r]=String(v).split(':').map(Number);if(qxColor(g,s,wi,r)){sfx('deal');commit(g)}return true}
    case 'qx-c-ok':closeModal();if(qxColor(g,s,-1)){sfx('lose');commit(g)}return true;
  }
  return false;
}
function qxSheet(sh,s,opts){
  // opts: Map "r:v" -> {a,v} anklickbar
  return '<div class="qsheet">'+[0,1,2,3].map(r=>{const row=sh.r[r],lockedBy=G.locked[r];
    return '<div class="qrow '+QX_CLS[r]+(lockedBy>=0?' locked':'')+'">'+[...Array(11)].map((_,i)=>{const num=qxNum(r,i),x=row.includes(i),past=!x&&row.length&&i<row[row.length-1],o=opts&&opts.get(r+':'+num);
      return '<span class="qc'+(x?' x':'')+(past?' past':'')+(o?' can':'')+(i===10?' last':'')+'" '+(o?'data-a="'+o.a+'" data-v="'+o.v+'"':'')+'>'+num+'</span>'}).join('')+
      '<span class="qc lk'+(sh.lk[r]?' x':'')+'">🔒</span><span class="qn">'+(row.length+(sh.lk[r]?1:0))+'</span></div>'}).join('')+
    '<div class="qfoot"><span>Fehlwürfe '+[0,1,2,3].map(i=>'<i class="'+(i<sh.pen?'on':'')+'">✕</i>').join('')+'</span><b>'+qxScore(sh)+' Punkte</b></div></div>';
}
function drawQwixx(app,top){
  const n=G.players.length,me_=mySeat();
  if(G.phase==='over'){
    const st=qxStandings(G),pl=qxPlaces(G),medal=['🥇','🥈','🥉'];
    setHTML(app,top+'<h1 style="margin-top:6px">Endstand</h1><p class="note" style="text-align:center">'+esc(G.msg||'')+'</p><div class="panel"><ul class="plist">'+st.map(x=>{const sh=G.sheets[x.s];
      return '<li><span>'+(medal[pl[x.s]]||'')+' '+esc(nm(G,x.s))+'</span><span class="p10st"><b>'+x.t+' Punkte</b><small>'+[0,1,2,3].map(r=>'<i class="qdot '+QX_CLS[r]+'"></i>'+qxTri(sh.r[r].length+(sh.lk[r]?1:0))).join(' ')+(sh.pen?' · −'+sh.pen*5:'')+'</small></span></li>'}).join('')+'</ul></div>'+
      (me_>=0?'<h3>Dein Block</h3>'+qxSheet(G.sheets[me_],me_,null):'')+
      (me_>=0?'<button data-a="newmatch">Neue Partie</button>':'')+'<button class="ghost" data-a="leave" style="margin-top:10px">Verlassen</button>');
    return;
  }
  const d=G.dice,ws=d?d.w[0]+d.w[1]:0,rolling=diceAnim>Date.now();
  let opps='';
  for(let k=1;k<=n;k++){const s=((me_<0?0:me_)+k)%n;if(s===me_)continue;const p=G.players[s],sh=G.sheets[s];
    opps+='<div class="opp qxo'+(G.active===s?' turn':'')+'" data-s="'+s+'" data-a="pinfo" data-v="'+s+'"><div class="n">'+avOf(p.id,p.name,p.bot)+'<b>'+esc(p.name)+'</b>'+(G.active===s?'<span class="tag">🎲</span>':'')+'</div>'+
      '<div class="qbars">'+[0,1,2,3].map(r=>'<span class="'+QX_CLS[r]+'"><i style="width:'+Math.round((sh.r[r].length+(sh.lk[r]?1:0))/12*100)+'%"></i></span>').join('')+'</div>'+
      '<div class="c">'+qxScore(sh)+' P'+(sh.pen?' · ✕'+sh.pen:'')+(G.phase==='white'?(G.wc[s]==null?' · wählt …':' · ✓'):'')+'</div></div>'}
  const dice=d?'<div class="qdice'+(rolling?' rolling':'')+'">'+qxDie(d.w[0],'qw')+qxDie(d.w[1],'qw')+d.c.map((x,r)=>G.locked[r]>=0?'':qxDie(x,QX_CLS[r])).join('')+'</div>':'';
  const table='<div class="table qxt">'+(d&&G.phase!=='roll'?dice+'<div class="qsum">Weiß: <b>'+ws+'</b></div>':G.phase==='roll'?(d?dice:'')+'<div class="qsum">'+esc(nm(G,G.active))+' würfelt …</div>':'')+'<div class="msg">'+esc(G.msg||'')+'</div></div>';
  let mine='',panel='';
  if(me_>=0){
    const sh=G.sheets[me_],opts=new Map(),act=G.active===me_;
    if(G.phase==='white'&&G.wc[me_]==null&&!rolling)[0,1,2,3].forEach(r=>{if(qxCan(G,me_,r,ws))opts.set(r+':'+ws,{a:'qx-w',v:r})});
    if(G.phase==='color'&&act&&!rolling)[0,1].forEach(wi=>[0,1,2,3].forEach(r=>{if(d.c[r]==null)return;const v=d.w[wi]+d.c[r];if(qxCan(G,me_,r,v)&&!opts.has(r+':'+v))opts.set(r+':'+v,{a:'qx-c',v:wi+':'+r})}));
    mine='<div class="mebar" data-a="pinfo" data-v="me"><span>'+esc(nm(G,me_))+'</span><span>'+qxScore(sh)+' Punkte</span></div>'+qxSheet(sh,me_,opts);
    if(G.phase==='roll'&&act)panel='<button data-a="qx-roll" class="bigroll">🎲 Würfeln</button>';
    else if(G.phase==='white'&&G.wc[me_]==null)panel='<div class="panel act"><b>Weiße Summe '+ws+': in einer Reihe ankreuzen?</b><span class="note">Tippe die leuchtende Zahl an'+(act?' – danach darfst du noch Weiß + Farbe nutzen.':'.')+'</span><button class="ghost" data-a="qx-w" data-v="-1">Nicht ankreuzen</button></div>';
    else if(G.phase==='color'&&act)panel='<div class="panel act"><b>Weiß + Farbe: noch eine Zahl ankreuzen?</b><span class="note">Kombiniere einen weißen mit einem farbigen Würfel – die passenden Zahlen leuchten.</span><button class="ghost" data-a="qx-c" data-v="-1">Nichts mehr ankreuzen</button></div>';
    else panel='<p class="note" style="text-align:center">'+(G.phase==='white'?'Warte auf die anderen …':G.phase==='color'?esc(nm(G,G.active))+' wählt Weiß + Farbe …':esc(nm(G,G.active))+' ist dran …')+'</p>';
  }else mine='<p class="note" style="text-align:center">Du schaust zu.</p>';
  const pz=G.paused?'<div class="pausebox">⏸ Pausiert von '+esc(G.paused.by)+(mySeat()>=0&&(!G.paused.uid||G.paused.uid===myId)?'<button data-a="unpause">Weiterspielen</button>':'')+'</div>':'';
  setHTML(app,top+'<div class="opps'+(n>3?' many':'')+'">'+opps+'</div>'+table+pz+mine+panel);
}
const QX_RULES_TXT='<details><summary>Regeln Qwixx</summary>Kreuze in den vier Farbreihen möglichst viele Zahlen an – immer von links nach rechts. Übersprungene Zahlen sind verloren.<br><br>'+
  '<b>Ein Zug:</b> Der aktive Spieler würfelt mit 6 Würfeln. 1. Alle dürfen die Summe der beiden weißen Würfel in einer beliebigen Reihe ankreuzen. 2. Nur der aktive Spieler darf zusätzlich einen weißen mit einem farbigen Würfel kombinieren und die Summe in der Reihe dieser Farbe ankreuzen. Kreuzt der aktive Spieler gar nichts an, bekommt er einen Fehlwurf (−5).<br><br>'+
  '<b>Abschließen:</b> Die Zahl ganz rechts darfst du erst mit mindestens 5 Kreuzen in der Reihe ankreuzen – dann bekommst du das Schloss als Extrakreuz, und die Reihe ist für alle zu. Der Würfel dieser Farbe fällt weg.<br><br>'+
  '<b>Ende:</b> sobald zwei Reihen abgeschlossen sind oder jemand 4 Fehlwürfe hat. Punkte je Reihe: 1 Kreuz = 1, 2 = 3, 3 = 6, 4 = 10 … 12 = 78. Die meisten Punkte gewinnen.</details>';
</script>
