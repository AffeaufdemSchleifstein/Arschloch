<style>
  :root{
    --ink:#f6efe2; --mute:#cbb89b; --card:#fbf8ee;
    --gold:#f2c14e; --onGold:#2b2100; --red:#c0392b; --black:#1c1c1c; --line:rgba(255,220,170,.17);
    --f1:#2c8a55; --f2:#17603a; --f3:#0c3d22; --ttext:#d5ead9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Kein Markieren bei langem Druecken (sonst oeffnet Android die Google-Suche) */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#1d110a;
    min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  /* Hintergrund als feste Ebene: wird nicht bei jedem Scrollen neu gezeichnet */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(95% 55% at 50% -8%,rgba(255,186,105,.30),transparent 70%),
      radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.55),transparent 60%),
      repeating-linear-gradient(91deg,rgba(0,0,0,.16) 0 2px,transparent 2px 11px,rgba(255,255,255,.025) 11px 12px,transparent 12px 27px),
      linear-gradient(180deg,#402716,#1d110a)}
  body[data-bg=night]{background:#0b1022}
  body[data-bg=night]::before{background:radial-gradient(90% 50% at 50% -5%,rgba(120,150,255,.28),transparent 70%),radial-gradient(60% 40% at 85% 100%,rgba(80,40,160,.25),transparent 70%),linear-gradient(180deg,#1a2550,#0b1022)}
  body[data-bg=living]{background:#2b211a}
  body[data-bg=living]::before{background:radial-gradient(70% 45% at 20% 0%,rgba(255,214,150,.35),transparent 70%),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 34px),linear-gradient(180deg,#6b5442,#2b211a)}
  body[data-bg=neon]{background:#0d0b26}
  body[data-bg=neon]::before{background:radial-gradient(70% 45% at 15% 5%,rgba(255,60,180,.35),transparent 70%),radial-gradient(70% 45% at 90% 95%,rgba(0,220,255,.25),transparent 70%),linear-gradient(160deg,#2a0b3d,#0d0b26)}
  body[data-bg=concrete]{background:#2a2c2f}
  body[data-bg=concrete]::before{background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.12),transparent 70%),linear-gradient(180deg,#4a4d52,#22252a)}

  #app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  #app>*{flex-shrink:0}
  .conn{font-size:12px;color:#ff8f7a;text-align:center;margin:-4px 0 6px}
  h1{font-size:38px;margin:22px 0 4px;letter-spacing:.5px;font-family:Georgia,'Times New Roman',serif;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5)}
  h2{font-size:24px;margin:8px 0 12px;font-family:Georgia,'Times New Roman',serif;color:var(--gold)}
  h3{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
  .suits{letter-spacing:10px;font-size:20px;margin:0 0 6px;color:var(--mute)}
  .suits i{font-style:normal;color:#d9534f}
  .sub{color:var(--mute);margin:0 0 18px;line-height:1.4}
  .panel{background:rgba(12,6,2,.45);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
  input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font-size:18px;padding:0 14px;outline:none}
  input:focus{border-color:var(--gold)}
  input+input,input+label{margin-top:10px}
  button{font:inherit;font-weight:650;font-size:17px;height:52px;border-radius:14px;border:0;padding:0 18px;cursor:pointer;background:var(--gold);color:var(--onGold);width:100%;touch-action:manipulation}
  button.ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  button.small{height:38px;font-size:14.5px;width:auto;padding:0 12px;border-radius:11px}
  button.danger{background:#b5402f;color:#fff}
  button:disabled{opacity:.4;cursor:default}
  button:active:not(:disabled){transform:translateY(1px)}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  .stack>*+*{margin-top:10px}
  .note{font-size:13.5px;color:var(--mute);line-height:1.45}
  .err{color:#ff8f7a;font-size:14px;min-height:18px;margin-top:8px}
  .code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 2px}
  ul.plist{list-style:none;margin:0;padding:0}
  ul.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:17px}
  ul.plist li:last-child{border-bottom:0}
  ul.plist li>span:first-child{display:flex;gap:10px;align-items:center;min-width:0}
  .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
  .tag.gold{color:var(--gold);border-color:var(--gold)}
  .dot{width:10px;height:10px;border-radius:50%;background:#6b6258;flex:none}
  .dot.on{background:#3ddc6f;box-shadow:0 0 0 3px rgba(61,220,111,.2)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:99px;background:#e2463a;color:#fff;font-size:12px;font-weight:800;padding:0 6px;margin-left:6px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .acct{height:38px;width:auto;font-size:14.5px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .nav button{height:64px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:14px}
  .nav button b{font-size:22px;line-height:1;position:relative}
  .nav .badge{position:absolute;top:-8px;right:-16px;margin:0}
  .back{background:none;border:0;color:var(--mute);height:auto;width:auto;padding:4px 0;font-size:15px;font-weight:600;margin:2px 0 6px;align-self:flex-start}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--mute)}
  table.rk{width:100%;border-collapse:collapse;font-size:15px}
  table.rk th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:4px 4px 8px}
  table.rk th:nth-child(2){text-align:left}
  table.rk td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  table.rk td:nth-child(2){text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.rk tr.me td{color:var(--gold)}
  .award{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .award:first-of-type{border-top:0}
  .award .e{font-size:28px;width:36px;text-align:center}
  .award b{display:block}
  .award span{font-size:13.5px;color:var(--mute)}
  .pcard{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .pcard:first-of-type{border-top:0}
  .pcard .pts{margin-left:auto;font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .pcard .det{font-size:12.5px;color:var(--mute);margin-top:2px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{width:auto;height:auto;padding:8px 10px;font-size:13.5px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--ink);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px}
  .opt.on{border-color:var(--gold)}
  .sw{width:44px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.25)}
  .swc{width:30px;height:30px;border-radius:50%}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:10px;gap:8px}
  .top b{color:var(--ink);letter-spacing:2px}
  .top .tb{display:flex;gap:6px;align-items:center}
  .linkbtn{background:none;border:0;color:var(--mute);font-size:13px;height:auto;width:auto;padding:4px;text-decoration:underline;font-weight:400}
  .iconbtn{width:34px;height:34px;padding:0;border-radius:10px;font-size:15px;background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  .opps{display:flex;gap:8px;flex-wrap:wrap}
  .opp{flex:1 1 30%;min-width:0;background:rgba(12,6,2,.45);border:1px solid var(--line);border-radius:14px;padding:9px 10px;position:relative}
  .opp.turn{border-color:var(--gold)}
  /* Leuchten ueber Deckkraft statt Schatten-Animation: guenstig fuer die Grafikkarte */
  .opp.turn::after{content:"";position:absolute;inset:-3px;border-radius:16px;box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold);opacity:.25;animation:glow 1.3s ease-in-out infinite alternate;pointer-events:none;will-change:opacity}
  .opp .n{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .r{font-size:11.5px;color:var(--mute);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .c{font-size:13px;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
  .opp .c span:last-child{color:var(--gold)}

  /* ---------- Tisch ---------- */
  .table{flex:1;min-height:215px;max-height:340px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 14px;margin:16px 0 8px;
    border-radius:120px;border:10px solid #5d3619;color:var(--ttext);
    background:radial-gradient(ellipse at 50% 30%,var(--f1) 0%,var(--f2) 55%,var(--f3) 100%);
    box-shadow:0 0 0 2px #24130a,inset 0 0 0 2px rgba(0,0,0,.4),inset 0 0 46px rgba(0,0,0,.6),0 16px 30px rgba(0,0,0,.55)}
  .table::before{content:"";position:absolute;inset:9px;border-radius:inherit;border:1px dashed rgba(255,255,255,.16);pointer-events:none}
  .table>*{position:relative;z-index:1}
  body[data-surface=desk] .table{border-radius:14px;border:8px solid #2e1b0e;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18)),repeating-linear-gradient(90deg,#6b4423 0 3px,#744a27 3px 10px,#5f3c1f 10px 12px,#6e4625 12px 24px)}
  body[data-surface=desk] .table::before{inset:14px 22px;border-radius:8px;border:2px dashed rgba(255,255,255,.22);background:radial-gradient(ellipse at 50% 40%,var(--f1),var(--f3));box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:0}
  body[data-surface=wood] .table{border-radius:10px;border:6px solid #7a4e26;--ttext:#3a2410;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.08)),repeating-linear-gradient(90deg,#c58e57 0 2px,#cf9862 2px 14px,#b98251 14px 16px,#d29d68 16px 52px,#5a3518 52px 54px)}
  body[data-surface=wood] .table::before{display:none}
  body[data-surface=grass] .table{border-radius:26px;border:9px solid #2a5a22;
    background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.28) 100%),repeating-linear-gradient(90deg,#3f8f3a 0 34px,#4ba344 34px 68px)}
  body[data-surface=grass] .table::before{inset:12px;border:2px solid rgba(255,255,255,.55);border-radius:16px}
  body[data-surface=marble] .table{border-radius:24px;border:9px solid #8d8d8d;--ttext:#3b3b3b;
    background:linear-gradient(115deg,transparent 40%,rgba(120,120,120,.25) 41%,transparent 43%),linear-gradient(35deg,transparent 60%,rgba(140,140,140,.2) 61%,transparent 63%),linear-gradient(160deg,transparent 20%,rgba(160,160,160,.18) 21%,transparent 23%),linear-gradient(135deg,#f4f2ee,#d8d5cf)}
  body[data-surface=marble] .table::before{display:none}
  body[data-surface=space] .table{border:6px solid #2b3570;
    background:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 33% 74%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 18%,#fff,transparent),radial-gradient(1px 1px at 76% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 30%,#cfe,transparent),radial-gradient(1px 1px at 22% 55%,#fff,transparent),radial-gradient(ellipse at 60% 70%,rgba(140,80,255,.35),transparent 60%),radial-gradient(ellipse at 50% 40%,#1b2550,#070b1e)}
  body[data-surface=space] .table::before{border-color:rgba(160,180,255,.25)}

  .pile{display:flex;justify-content:center;min-height:92px;align-items:center}
  .pile.closed{opacity:.45;transform:scale(.9)}
  .pile.closing{animation:closing .55s ease-in backwards}
  .pile .empty{width:62px;height:90px;border:2px dashed rgba(255,255,255,.25);border-radius:10px}
  .msg{font-size:14px;color:var(--ttext);text-align:center;min-height:18px;padding:0 14px}
  .msg.new{animation:msgIn .35s ease-out}
  .pausebox{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);border-radius:inherit;color:#fff;text-align:center;padding:16px}
  .pausebox b{font-size:22px}
  .pausebox button{width:auto}
  .status{text-align:center;font-size:16.5px;font-weight:650;min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 6px;line-height:1.3}
  .status.me{color:var(--gold)}
  .status.new{animation:pop .5s ease-out}
  .card{width:58px;height:84px;border-radius:9px;background:var(--card);color:var(--black);position:relative;flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid #d9d3bf;user-select:none;transition:transform .12s}
  .card.red{color:var(--red)}
  .card .k{position:absolute;top:5px;left:7px;font-size:19px;font-weight:800;line-height:1}
  .card .s{position:absolute;top:25px;left:7px;font-size:15px;line-height:1}
  .card .big{position:absolute;right:7px;bottom:5px;font-size:30px;line-height:1}
  .pile .card{margin:0 -9px;transform:rotate(var(--r,0deg))}
  .pile.in .card{animation:throwDown .38s cubic-bezier(.2,.8,.3,1.15) backwards;animation-delay:calc(var(--i,0)*70ms)}
  .pile.in.mine .card{animation-name:throwUp}
  .hand{display:flex;flex-wrap:wrap;justify-content:center;padding:14px 14px 4px 30px;row-gap:10px;min-height:100px}
  .hand .card{margin-left:-16px;cursor:pointer}
  .hand.deal .card{animation:dealIn .4s cubic-bezier(.2,.8,.3,1.1) backwards;animation-delay:calc(var(--i,0)*45ms)}
  /* Wenn man dran ist: legbare Karten leuchten gruen, der Rest wird abgedunkelt */
  .hand .card.ok{box-shadow:0 0 0 2px #5fe08a,0 0 12px rgba(95,224,138,.75)}
  .hand .card.no{filter:brightness(.55) saturate(.6)}
  .hand .card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.4)}
  .hand .card.fresh::after{content:"neu";position:absolute;top:-8px;right:-4px;background:var(--gold);color:var(--onGold);font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
  .mebar{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--mute);margin-top:4px}
  .actions{display:flex;gap:10px;margin-top:10px;position:sticky;bottom:12px;z-index:3}
  .actions button{box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .actions .ghost{background:#3b2a1d}
  .actions button:disabled{opacity:1;filter:brightness(.55)}
  .place{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1b1b;color:#fff;padding:12px 16px;border-radius:12px;
    font-size:14.5px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;line-height:1.35}
  #toast.on{opacity:1}
  #modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
  #modal.on{display:flex;animation:fadeIn .2s ease-out}
  #modal .box{width:100%;max-width:440px;background:#24170e;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:env(safe-area-inset-bottom);animation:up .25s ease-out}
  #modal .box h2{margin-top:0}
  details{font-size:14px;color:var(--mute);line-height:1.5}
  details summary{cursor:pointer;color:var(--ink);font-weight:600;padding:2px 0}
  .table.small{flex:0 0 auto;min-height:112px;padding:10px 14px;margin:12px 0 6px}
  .table.small .pile{min-height:0}.table.small .pile .empty{display:none}
  .wish{margin:6px 0 12px}
  .hand.mini{padding:10px 10px 0 22px;min-height:0;row-gap:6px}
  .hand.mini .card{width:42px;height:60px;margin-left:-12px;border-radius:7px;cursor:default}
  .hand.mini .card .k{font-size:15px;top:4px;left:5px}.hand.mini .card .s{font-size:12px;top:21px;left:5px}.hand.mini .card .big{font-size:18px;right:4px;bottom:3px}
  .card.back{background:repeating-linear-gradient(45deg,#7a1f1f 0 6px,#932a2a 6px 12px);border:3px solid var(--card)}
  @media (max-height:720px){.table{min-height:165px;padding:10px 14px;margin:10px 0 4px}}
  .wish .wr{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .wish .wr button{height:46px;padding:0;font-size:16px;border-radius:10px}
  .wish .chosen{font-size:14px;color:var(--mute);margin:10px 0;min-height:36px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{width:auto;height:34px;font-size:15px;padding:0 12px;border-radius:99px}
  .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);margin-left:8px;white-space:nowrap}
  .tm.hot{color:#ff6b57}
  .oh{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
  .oc{background:var(--card);color:#1c1c1c;border-radius:4px;font-size:11.5px;font-weight:800;line-height:1;padding:3px 2px;min-width:21px;text-align:center}
  .oc.red{color:var(--red)}.oc i{font-style:normal;display:block;font-size:10px;margin-top:1px}

  /* Sanduhr: sitzt rechts auf dem Tisch, nie ueber den eigenen Karten */
  .hgw{position:absolute;right:20px;top:50%;width:46px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
    opacity:0;transform:translateY(-50%) scale(.55);transition:opacity .3s,transform .5s ease-out;will-change:transform,opacity}
  .hgw.on{opacity:1}
  .hgw svg{width:46px;height:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .hgw b{font-size:17px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
  .hgw .stream{stroke-dasharray:4 5;animation:hg-s .35s linear infinite}

.pos{color:#7ee2a0}.neg{color:#ff8b7a}

.panel.act{text-align:center}.panel.act>b{display:block;margin-bottom:8px}

.scard .gm{font-size:22px}.scard .em{font-size:25px;margin-top:-6px}
.scard .lb{position:absolute;bottom:4px;left:1px;right:1px;text-align:center;font-size:7.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden}
.scard .asg{position:absolute;top:2px;right:3px;font-size:11px}
.scard.s0{background:linear-gradient(160deg,#3f82f0,#1d4fb0)}.scard.s1{background:linear-gradient(160deg,#ef5248,#b0241c)}
.scard.s2{background:linear-gradient(160deg,#3db466,#1c7a3c)}.scard.s3{background:linear-gradient(160deg,#f1c33a,#c08a0e);color:#3a2700}
.scard.z{background:linear-gradient(160deg,#7b4fe0,#3b1f8a)}.scard.nr{background:linear-gradient(160deg,#8d939c,#545a63)}
.scard.sp{background:linear-gradient(160deg,#2a2342,#120e22);border-color:#e5c25a;color:#ffe08a}
.scard.mini{width:34px;height:50px;border-width:1.5px}.scard.mini .v,.scard.mini .v2{font-size:10px}.scard.mini .gm,.scard.mini .em{font-size:15px}.scard.mini .lb{display:none}
.scard.none{background:rgba(255,255,255,.12);color:var(--mute)}
.shand{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0 10px;padding:0 2px}
.shand .scard{width:46px;height:68px;cursor:pointer}
.shand .scard.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.45)}

.shand .scard.sel.ok{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.45)}
.stable{min-height:210px}
.tinfo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:8px}
.tinfo small{display:block;font-size:10.5px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.06em}.tinfo b{font-size:14px}.tinfo .rd{margin-left:14px}
.strick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:96px;align-items:flex-start}

@keyframes tin{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.suitpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

/* ===== Würfelblock ===== */

/* ===================== Geschmeidige Animationen ===================== */
:root{--e-out:cubic-bezier(.22,1,.36,1);--e-spring:cubic-bezier(.34,1.45,.64,1);--e-soft:cubic-bezier(.4,0,.2,1)}
button{transition:transform .2s var(--e-out),background-color .22s var(--e-soft),color .22s,box-shadow .28s var(--e-out),opacity .22s,filter .22s}
button:active:not(:disabled){transform:scale(.965);transition-duration:.07s}
.card,.scard{transition:transform .32s var(--e-spring),box-shadow .3s var(--e-out),filter .28s var(--e-soft),opacity .28s}
.die{transition:transform .34s var(--e-spring),box-shadow .3s var(--e-out),background .3s}
.opp{transition:box-shadow .35s var(--e-out),border-color .35s,background-color .35s,opacity .35s}
.sw2 i{transition:transform .3s var(--e-spring)}
.tbar .tt i{transition:width .3s linear,background .45s var(--e-soft)}
/* Bildschirmwechsel */
#app.enter{animation:scr .5s var(--e-out)}
@keyframes scr{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}
#app.enter>.panel,#app.enter>.nav{animation:rowIn .55s var(--e-out) backwards}
#app.enter>.panel:nth-child(2){animation-delay:40ms}#app.enter>.panel:nth-child(3){animation-delay:80ms}#app.enter>.panel:nth-child(4){animation-delay:120ms}
#app.enter>.panel:nth-child(5),#app.enter>.nav{animation-delay:160ms}#app.enter>.panel:nth-child(n+6){animation-delay:200ms}
#app.enter .plist li,#app.enter .pcard{animation:rowIn .5s var(--e-out) backwards;animation-delay:calc(var(--i,0)*55ms + 90ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
details[open]>:not(summary){animation:rowIn .38s var(--e-out)}
/* Fenster */
#modal{transition:background-color .25s}
#modal.on{animation:fadeIn .25s var(--e-soft)}
#modal .box{animation:boxIn .46s var(--e-spring)}
#modal.out{animation:fadeOut .22s var(--e-soft) forwards;pointer-events:none}
#modal.out .box{animation:boxOut .22s var(--e-soft) forwards}
@keyframes boxIn{from{transform:translateY(46px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes boxOut{to{transform:translateY(30px) scale(.97);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.gpick .gcard{animation:rowIn .45s var(--e-out) backwards}
.gpick .gcard:nth-child(2){animation-delay:50ms}.gpick .gcard:nth-child(3){animation-delay:100ms}.gpick .gcard:nth-child(4){animation-delay:150ms}
#toast{transform:translate(-50%,14px) scale(.96);transition:opacity .3s var(--e-soft),transform .4s var(--e-spring)}
#toast.on{transform:translate(-50%,0)}
.ov .ovp{animation:rowIn .35s var(--e-out)}
/* Karten */
.pile.in .card{animation:throwDown .52s var(--e-out) backwards;animation-delay:calc(var(--i,0)*65ms)}
@keyframes throwDown{0%{transform:translateY(-44vh) rotate(-30deg) scale(1.2);opacity:0}30%{opacity:1}82%{transform:rotate(var(--r,0deg)) scale(.975)}100%{transform:rotate(var(--r,0deg));opacity:1}}
@keyframes throwUp{0%{transform:translateY(44vh) rotate(30deg) scale(1.2);opacity:0}30%{opacity:1}82%{transform:rotate(var(--r,0deg)) scale(.975)}100%{transform:rotate(var(--r,0deg));opacity:1}}
.pile.closing{animation:closing .6s var(--e-soft) backwards}
@keyframes closing{from{opacity:1;transform:none}to{opacity:.4;transform:scale(.9) translateY(6px)}}
.hand.deal .card{animation:dealIn .6s var(--e-spring) backwards;animation-delay:calc(var(--i,0)*40ms)}
@keyframes dealIn{from{transform:translateY(80px) rotate(-9deg) scale(.88);opacity:0}to{transform:none;opacity:1}}
.status.new{animation:pop .55s var(--e-spring)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.msg.new{animation:msgIn .42s var(--e-out)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.strick .te{animation:tin .46s var(--e-spring) both}
@keyframes tin{from{transform:translateY(34px) scale(.82) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}
.strick .te.win .scard{animation:winp 1.2s var(--e-soft) infinite alternate}
@keyframes winp{from{box-shadow:0 0 0 2px #ffd45a,0 0 8px rgba(255,212,90,.5)}to{box-shadow:0 0 0 3px #ffd45a,0 0 22px rgba(255,212,90,.95);transform:translateY(-3px) scale(1.04)}}
/* Würfel */
.die.roll{animation:droll .5s var(--e-soft) infinite}
@keyframes droll{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(90deg) translateY(-10px) scale(.94)}50%{transform:rotate(180deg) translateY(0) scale(1)}75%{transform:rotate(270deg) translateY(-6px) scale(.96)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
.die:not(.roll){animation:dland .45s var(--e-spring)}
@keyframes dland{from{transform:scale(.9)}to{transform:none}}
.die.held:not(.roll){animation:none}
/* weniger Bewegung bzw. schwache Geräte */
@media (prefers-reduced-motion:reduce){#app.enter>.panel,#app.enter>.nav,details[open]>:not(summary),#modal .box,#modal.out,#modal.out .box,.gpick .gcard,.ov .ovp,.strick .te,.strick .te.win .scard,.die,.die.roll{animation:none!important}#modal.out{opacity:0}}
body.low #app.enter>.panel,body.low #app.enter>.nav,body.low .strick .te.win .scard{animation:none}

/* ===================== Chatfenster (verschiebbar) ===================== */

.homechat,.dmb{position:relative}
.homechat .badge,.dmb .badge{position:absolute;top:-7px;right:-8px;margin:0;min-width:18px;height:18px;font-size:11px}

/* „schreibt gerade …“ und Schüttel-Hinweis */
#chatui .typing{display:flex;align-items:center;gap:4px;align-self:flex-start;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.06);font-size:12.5px;color:var(--mute);animation:msgIn .3s var(--e-out)}
#chatui .typing span{margin-left:5px}

#chatui .ttag{font-size:11.5px;color:#5fe08a;font-weight:600;flex:none}
.note.shk{margin:6px 0 0;text-align:center;font-size:12.5px}
/* Kopfzeile Startseite: nie breiter als der Bildschirm */
.head>h1{min-width:0;flex:0 1 auto;font-size:clamp(28px,9vw,38px)}

<body>
<div id="app"></div>
<div id="chatui"></div>
<div id="toast"></div>
<div id="modal"></div>
<div id="boom" aria-hidden="true"><div class="dim"></div><div class="glow"></div><div class="cen"><div class="halo"></div><div class="ring"></div><div class="ring r2"></div><div class="bomb">💣<i>✨</i></div><div class="bang">💥</div><div id="parts"></div></div><div class="flash"></div><div class="txt"><b>Mi Bombo!</b><span id="boomtxt"></span></div></div>
<script>
//LOGIC-START
// Blatt: bis 5 Spieler 32 Karten (7–A), ab 6 Spielern 52 Karten (2–A)
const RANKS32=['7','8','9','10','B','D','K','A'],RANKS52=['2','3','4','5','6','7','8','9','10','B','D','K','A'];
let RANKS=RANKS32;const SUITS=['♠','♥','♦','♣'];
const rk=c=>c>>2, su=c=>c&3;
const NR=g=>g&&g.deck===52?13:8, ACE=g=>NR(g)-1;
function useDeck(g){RANKS=NR(g)===13?RANKS52:RANKS32}
// Chaos-Modus: Sonderkarten (Joker sind Platzhalter, die anderen sind Aktionskarten)
const JOKER1=100,JOKER2=101,REV=110,SKIP=120,TURN=130,SPECIALS=[100,101,110,120,130];
const isJoker=c=>c===100||c===101,isAction=c=>c===110||c===120||c===130,isSpec=c=>c>=100;
const SPEC_NAME={100:'Joker',101:'Joker',110:'Revolution',120:'Aussetzer',130:'Richtungswechsel'};
const beats=(g,r,pr)=>g.rev?r<pr:r>pr;
function pileRank(g){const nat=g.pile.cards.filter(c=>!isJoker(c));return nat.length?rk(nat[0]):-1}
const B4=n=>Array(n).fill('Bürger');
const ROLES={3:['Präsident','Bauer','Arschloch'],
  4:['Präsident','Vize-Präsident','Vize-Arschloch','Arschloch'],
  5:['Präsident','Vize-Präsident','Bauer','Vize-Arschloch','Arschloch'],
  6:['Präsident','Vize-Präsident',...B4(2),'Vize-Arschloch','Arschloch'],
  7:['Präsident','Vize-Präsident',...B4(3),'Vize-Arschloch','Arschloch'],
  8:['Präsident','Vize-Präsident',...B4(4),'Vize-Arschloch','Arschloch']};
// Team-Modus (nur 4 Spieler): Plaetze 0+2 gegen 1+3
const isTeam=g=>!!g&&R(g).mode==='team'&&!!g.players&&g.players.length===4;
function teamPts(g){const t=[0,0];g.players.forEach((_,s)=>t[s%2]+=(g.ms&&g.ms[s]?g.ms[s].pts:0));return t}
const TEAM_NAME=['Team Blau','Team Rot'];
const clone=o=>JSON.parse(JSON.stringify(o));
const asc=(a,b)=>a-b;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nm(g,s){return g.players[s].name}
function cardsTxt(cs){
  if(cs.length===1&&isAction(cs[0]))return SPEC_NAME[cs[0]];
  const nat=cs.filter(c=>!isJoker(c));
  return (cs.length>1?cs.length+'× ':'')+(nat.length?RANKS[rk(nat[0])]:'Joker')+(nat.length&&nat.length<cs.length?' (mit Joker)':'');
}
function activeSeats(g){return g.players.map((_,i)=>i).filter(i=>g.hands[i].length>0)}
function nextActive(g,from,excl){const n=g.players.length,d=g.dir===-1?-1:1;for(let i=1;i<=n;i++){const s=((from+d*i)%n+n)%n;if(g.hands[s].length&&!(excl&&excl(s)))return s}return -1}
function isFree(g){return !g.pile||g.pile.closed}
const DEFAULT_RULES={turn:20,bombs:true,stock:true,aceRule:true,target:0,solo:true,mode:'classic'};
const MODES=['classic','chaos','team'];
function R(g){return Object.assign({},DEFAULT_RULES,g.rules||{})}

// Neue Partie: Statistik pro Platz zuruecksetzen
function initMs(g){
  const n=g.players.length;g.ms={};

//STICH-START
// ===== Wizard: Stichspiel mit Ansagen (Regeln wie das bekannte Original, eigenes Design) =====

function stCardName(c,as){

}
function stDeck(g){const d=[...Array(52).keys(),...ST_Z,...ST_N];if(SR(g).mode==='spezial')d.push(...ST_SPECIALS);return d}
function stStart(g){

// Neue Runde austeilen und Trumpf bestimmen
function stDeal(g){
  const n=g.players.length;g.round++;

// Werwolf auf der Hand: tauscht mit der Trumpfkarte, danach bestimmt der Besitzer den Trumpf
function stCheckWolf(g){

// Effektive Eigenschaften einer gespielten Karte im Stich
function stEff(e){

  if(c===JUGGLER)return {kind:'num',suit:+e.as,val:7.5};

// Gewinner eines (vollstaendigen oder teilweisen) Stichs: Index im Stich
function stWinnerIdx(g,trick){

function stPlay(g,seat,c,as){
  if(!stCanPlay(g,seat,c,as))return false;

  const e={s:seat,c};if(c===SHIFT||c===JUGGLER||c===CLOUD)e.as=c===SHIFT?as:+as;

  else{g.won[w]++;g.msg=nm(g,w)+' gewinnt den Stich.'}

// Wolke: Ansage um +1 oder -1 aendern

// Jongleur: jeder waehlt eine Karte, dann wird gleichzeitig nach links weitergegeben

function stCardPower(g,c){

// Waehlt Karte (+ Zusatz fuer Sonderkarten), die einen Stich gewinnt bzw. verliert
function stBotPlay(g,s){

  S.logout=async()=>{await sb.auth.signOut()};

const pileKey=g=>g&&g.pile?g.pile.cards.join('-')+'@'+g.round:'';
function onGame(g,force){

  if(G&&g.v<G.v&&!force)return;
  if(g.phase==='closed'){if(code){const h=g.host===myId;if(!h)toast('Der Host hat den Raum geschlossen.');const c=code;leave();store.hide&&store.hide(c).then(loadMyGames).catch(()=>{})}return}
  const prev=G;
  if(gameOf(g)!=='arsch')return onGameOther(g,prev);
  if(prev&&g.pile&&g.pile.cards.length===4&&pileKey(g)!==pileKey(prev))boom(nm(g,g.pile.by)+' legt 4× '+RANKS[rk(g.pile.cards[0])]);

  else if(prev&&g.v!==prev.v&&g.phase==='play'&&g.passed&&prev.passed&&g.passed.length>prev.passed.length)sfx('pass');
  if(prev&&g.round!==prev.round)sfx('deal');
  if(prev&&prev.phase==='play'&&g.phase==='play'&&prev.hands&&g.players.length===prev.players.length)g.players.forEach((p,s)=>{if(prev.hands[s]&&prev.hands[s].length>1&&g.hands[s].length===1)lastCardFlash(g,s)});
  if(prev&&g.v!==prev.v&&(g.turn!==prev.turn||g.phase!==prev.phase)&&g.turn===mySeatOf(g)&&['play','wish','swap','stock'].includes(g.phase)&&!g.paused)setTimeout(()=>sfx('turn'),250);
  if(prev&&prev.phase==='play'&&g.phase==='end'){const ms=mySeatOf(g);if(ms>=0)setTimeout(()=>sfx(g.order[0]===ms?'win':g.order[g.order.length-1]===ms?'lose':'mid'),Math.max(600,boomUntil-Date.now()+200))}
  // Vorausgewaehlte Karten bleiben beim Zugwechsel erhalten (nur neue Phase/Runde leert die Auswahl)
  if(!prev||g.phase!==prev.phase||g.round!==prev.round){sel.clear();wishSel=[];lockOn=false}
  else{if(g.turn!==prev.turn)wishSel=[];const s=g.players&&g.hands?g.players.findIndex(p=>p.id===myId):-1,h=s>=0&&g.hands[s]||[];for(const c of [...sel])if(!h.includes(c))sel.delete(c);if(!sel.size)lockOn=false}
  if(!prev||g.v!==prev.v||g.phase!==prev.phase)turnStart=Math.max(Date.now(),boomUntil);
  // Nach dem letzten Stich den Tisch noch kurz zeigen
  if(prev&&prev.phase==='play'&&g.phase==='end'){endHold=Math.max(Date.now()+2300,boomUntil+300);setTimeout(render,endHold-Date.now()+40)}
  if(g.phase==='end'&&seen.rec!==code+':'+g.round){seen.rec=code+':'+g.round;const c=code;setTimeout(()=>{RS().recordRound(c);setTimeout(()=>{loadPres();loadQuests(true)},2500)},1500)}
  G=g;clearTimeout(loadTimer);stale=false;render();maybeBot();tryLock();

}
const lockOk=cs=>{if(!cs.length||cs.length>4)return false;if(cs.some(isAction))return cs.length===1;const n=cs.filter(c=>!isJoker(c));return n.every(c=>rk(c)===rk(n[0]))};

let commitTok=0;
async function commit(g){
  if(busy||!sub)return false;busy=true;g.v=(g.v||0)+1;const s=sub,c=code,tok=++commitTok;
  s.local(g); // sofort anzeigen, Server bestaetigt im Hintergrund
  // Haengt die Verbindung, nach 10 s abbrechen und den Stand neu laden – sonst bliebe die App blockiert
  const to=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
  try{const ok=await Promise.race([RS().commit(c,g),to]);if(!ok)s.refetch()}catch(e){console.warn(e);s.refetch();if(String(e&&e.message)!=='timeout')writeErr(e)}
  if(tok===commitTok){busy=false;maybeBot();tryLock()}return true;
}
function running(){if(!G)return false;if(gameOf(G)!=='arsch')return otherRunning();return ['wish','swap','stock','play'].includes(G.phase)}
function maybeBot(){
  if(G&&gameOf(G)!=='arsch')return otherBot();

  const v=G.v;

    botTimer=null;if(!G||G.paused)return;if(G.v!==v){maybeBot();return}
    if(busy){setTimeout(maybeBot,300);return}
    const g=clone(G),s=g.turn;
    if(g.phase==='wish')wish(g,s,botWish(g,s));

}

      $('#hgBot').setAttribute('y',126-46*q);$('#hgBot').setAttribute('height',46*q);$('#hgS').style.display=q>=1?'none':'';
      $('#hgN').textContent=left;hg.classList.add('on');

}

  for(let i=0;i<(g.bots||0);i++)l.push({id:'bot'+i,name:BOTS[i],bot:true,level:g.botLevel||'normal'});
  if(R(g).mode==='team'&&g.tseed){let x=Math.floor(g.tseed*1e9)||1;const rnd=()=>(x=(x*48271)%2147483647)/2147483647;

  rec.ondataavailable=e=>{if(e.data&&e.data.size&&REC)REC.chunks.push(e.data)};
  rec.onstop=()=>micDone();rec.start(250);
  if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.06,AC.currentTime,.1);
  REC.timer=setInterval(()=>{if(!REC)return;const s=(Date.now()-REC.t0)/1000;if(s>=30)micStop(false);else{const el=$('#rect');if(el)el.textContent=fmtS(s)}},250);
  renderChat();
}
function micStop(cancel){if(!REC)return;REC.cancel=cancel;clearInterval(REC.timer);try{if(REC.rec.state!=='inactive')REC.rec.stop();else micDone()}catch(e){micDone()}}
async function micDone(){
  const R=REC;REC=null;if(!R)return;
  try{R.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  musicBack();renderChat();
  if(R.cancel)return;
  const secs=Math.min(30,Math.round((Date.now()-R.t0)/1000));
  if(secs<1){toast('Zu kurz – tippe auf 🎤, sprich und dann auf Senden.');return}
  const type=String(R.rec.mimeType||(R.chunks[0]&&R.chunks[0].type)||'audio/webm').split(';')[0];
  const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
  const blob=new Blob(R.chunks,{type});
  if(blob.size>480000){toast('Die Sprachnachricht ist zu groß.');return}
  const path=R.code+'/'+crypto.randomUUID()+'_'+secs+'.'+ext;
  try{
    const up=await store.sb.storage.from('voice').upload(path,blob,{contentType:type,upsert:false});if(up.error)throw up.error;
    VCACHE[path]=URL.createObjectURL(blob);
    await store.sendChat(R.code,'voice',path);
  }catch(e){console.warn(e);toast(/slow down/.test(String(e&&e.message))?'Zu viele Sprachnachrichten – warte kurz.':'Sprachnachricht ging nicht raus.')}
}
async function vplay(path){
  if(!store||!store.online||!/^[A-Z]{4}\/[0-9a-f-]{36}_[0-9]{1,2}\.(webm|m4a|ogg)$/.test(String(path)))return;
  try{
    let u=VCACHE[path];
    if(!u){const {data,error}=await store.sb.storage.from('voice').download(path);if(error)throw error;u=VCACHE[path]=URL.createObjectURL(data)}
    if(vPlaying)vPlaying.pause();
    const a=new Audio(u);vPlaying=a;
    if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.12,AC.currentTime,.1);
    a.onended=a.onpause=()=>{if(vPlaying===a){vPlaying=null;musicBack()}};
    await a.play();
  }catch(e){console.warn(e);musicBack();toast('Sprachnachricht konnte nicht abgespielt werden.')}
}

}

    case 'inv-open':return openInvite();

    case 'av-e':if(me)saveAvatar({e:v,c:(me.avatar&&me.avatar.c)||AV_COL[5]});return;

    case 'chat':{if(REC)micStop(true);const inRoom=!!(code&&G&&RS().online);if(!inRoom&&!me&&!chatOpen){toast('Für den Privatchat brauchst du ein Konto.');return}
      chatOpen=!chatOpen;wheelOpen=false;if(chatOpen){chatTab=inRoom?(chatTab==='dm'&&dmWith?'dm':'room'):'dm';if(!inRoom||chatTab==='dm')loadDmUnread()}

  }
  if(a==='wr'){const q=G.wishQ&&G.wishQ[0];if(q&&wishSel.length<q.n){wishSel.push(+v);render()}return}

    case 'kick2':closeModal();store.kick(code,v).then(()=>toast('Spieler entfernt.')).catch(()=>toast('Hat nicht geklappt.'));return;
    case 'bot+':if(G.host===myId&&total()<8){g.bots=(g.bots||0)+1;commit(g)}return;

        g.paused=null;deal(g);commit(g)}return;
    case 'endmatch':if(G.phase==='end'&&s>=0){g.paused=null;g.phase='over';commit(g)}return;
    case 'newmatch':if(G.phase==='over'&&s>=0){startMatch(g);deal(g);commit(g)}return;
    case 'pause':if(running()&&s>=0){g.paused={by:G.players[s].name,uid:myId};commit(g)}return;
    case 'unpause':if(G.paused&&s>=0){if(G.paused.uid&&G.paused.uid!==myId){toast('Nur '+G.paused.by+' kann die Partie fortsetzen.');return}g.paused=null;commit(g)}return;
    case 'lv-pause':closeModal();if(s>=0&&(running()||G.phase==='end')&&!G.paused){g.paused={by:G.players[s].name,uid:myId};commit(g).then(()=>leave());return}return leave();

    case 'lv-close':closeModal();if(G.host===myId&&G.phase==='lobby'){g.phase='closed';commit(g).then(()=>{if(code){const c=code;leave();store.hide(c).then(loadMyGames).catch(()=>{})}})}return;
    case 'lv-end':closeModal();if(s>=0){g.phase='over';g.paused=null;commit(g)}return;
    case 'wish':if(g.phase==='wish'&&g.turn===s){wish(g,s,wishSel.slice());wishSel=[];commit(g)}return;
    case 'do':{
      const cs=[...sel];
      if(g.phase==='swap'&&canGive(g,s,cs)){give(g,s,cs);sel.clear();return commit(g)}
      if(g.phase==='stock'&&canStock(g,s,cs)){takeStock(g,s,cs);sel.clear();return commit(g)}
      if(g.phase==='play'&&canPlay(g,s,cs)){play(g,s,cs);sel.clear();return commit(g)}
      return;
    }
    case 'skip':if(g.phase==='stock'&&g.turn===s){takeStock(g,s,null);sel.clear();commit(g)}return;
    case 'pass':if(canPass(g,s)){pass(g,s);sel.clear();commit(g)}return;
  }
}

const RULES='<details><summary>Regeln in Kurzform</summary>32 Karten, 7 bis Ass. Wer rauskommt, legt eine oder mehrere gleiche Karten. Danach muss jeder gleich viele, aber höhere Karten legen – oder passen. Wer einmal passt, darf in diesem Stich nicht mehr legen. Passen alle, darf derjenige, der zuletzt gelegt hat, allein weiter immer höher legen (gleich viele Karten) – hört er auf, kommt er neu raus. Vier gleiche Karten sind eine Bombe: Sie schlägt alles, auch Asse, und kann nur von einer höheren Bombe geschlagen werden. Wer zuerst keine Karten mehr hat, wird Präsident, der Letzte Arschloch. Jeder hat pro Zug 20 Sekunden – danach wird automatisch gepasst (oder beim Rauskommen die niedrigste Karte gelegt). Mit einem Ass als allerletzter Karte fertig zu werden ist erlaubt – wer das tut, landet aber automatisch auf dem letzten Platz (Arschloch). Wer nach dem Tauschen alle 4 Asse hält, muss offen spielen. Ab Runde 2 wünscht sich der Präsident bis zu 2 Karten vom Arschloch, bei 4+ Spielern der Vize-Präsident 1 Karte vom Vize-Arschloch – der Wunsch gilt nur, wenn er komplett erfüllt werden kann – sonst gibt es die besten Karten. Zurück gibt es gleich viele beliebige Karten. Bei 3 und 5 Spielern bleiben 2 Karten als Stock liegen: Der Bauer darf beide gegen 2 eigene tauschen oder liegen lassen. Das Arschloch kommt raus. Punkte pro Runde: Erster bekommt so viele Punkte, wie Mitspieler da sind, minus eins; Letzter bekommt 0. Der Host kann in der Lobby Hausregeln einstellen (Zeit pro Zug, Bomben, Stock, Ass-Regel, Weiterlegen, Punkteziel).<br><br><b>Mehr Spieler:</b> Ab 6 Spielern (bis 8) wird mit 52 Karten (2 bis Ass) gespielt, die Mitte heißt Bürger.<br><b>Chaos-Modus:</b> Zusätzlich 2 🃏 Joker (ersetzen jede Karte, allein höher als Ass – nur eine Bombe schlägt sie) und 3 Aktionskarten, die man statt eines Zugs spielen kann: 🔄 Revolution (die Rangfolge dreht sich um), ⏭️ Aussetzer (der Nächste setzt aus) und 🔁 Richtungswechsel.<br><b>Team-Modus (4 Spieler):</b> Je zwei gegenüber sitzende Spieler bilden ein Team, ihre Punkte werden zusammengezählt.</details>';

const TRIG=/(^|\s)(new|in|deal)(\s|$)/;

function mkey(n){if(n.nodeType!==1)return null;const k=n.getAttribute('data-key');if(k)return 'k'+k;if(n.id)return '#'+n.id;
  const a=n.getAttribute('data-a'),v=n.getAttribute('data-v');return a&&v!=null?a+':'+v:null}
function mattrs(o,n){
  for(const at of [...o.attributes])if(!n.hasAttribute(at.name)&&!(at.name==='open'&&o.tagName==='DETAILS'))o.removeAttribute(at.name);
  for(const at of n.attributes)if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
  if((o.tagName==='INPUT'||o.tagName==='TEXTAREA')&&o!==document.activeElement){
    const v=n.getAttribute('value')||'';if(o.value!==v&&o.type!=='file')o.value=v;
    if(o.type==='checkbox'||o.type==='radio')o.checked=n.hasAttribute('checked');}
}
function msame(o,n){return o.nodeType===n.nodeType&&o.nodeName===n.nodeName&&mkey(o)===mkey(n)}
function mnode(o,n){
  if(o.nodeType===3||o.nodeType===8){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;return o}
  if(LIVE.has(o.id))return o;
  // Elemente mit Start-Animation neu erzeugen, wenn sie neu dazukommen oder sich der Inhalt aendert
  const nc=n.getAttribute('class')||'';
  if(TRIG.test(nc)&&(nc!==(o.getAttribute('class')||'')||o.textContent!==n.textContent)){o.replaceWith(n);return n}
  mattrs(o,n);mkids(o,n);return o;
}
function mkids(op,np){
  const olds=[...op.childNodes],keyed=new Map();
  for(const c of olds){const k=mkey(c);if(k){if(!keyed.has(k))keyed.set(k,[]);keyed.get(k).push(c)}}
  const used=new Set();let p=0;const news=[...np.childNodes];
  news.forEach((n,i)=>{
    let o=null;const k=mkey(n);
    if(k){const l=keyed.get(k);while(l&&l.length){const c=l.shift();if(!used.has(c)&&c.nodeName===n.nodeName){o=c;break}}}
    else{while(p<olds.length&&(used.has(olds[p])||mkey(olds[p])))p++;if(p<olds.length&&msame(olds[p],n))o=olds[p++]}
    let r;if(o){used.add(o);r=mnode(o,n)}else r=n;
    const at=op.childNodes[i];if(at!==r)op.insertBefore(r,at||null);
  });
  for(const c of olds)if(!used.has(c)&&c.parentNode===op)c.remove();
}

function flipPrep(root){const m=new Map();if(REDUCED.matches||document.body.classList.contains('low'))return m;root.querySelectorAll(FLIPSEL).forEach(e=>m.set(e,e.getBoundingClientRect()));return m}
function flipRun(m){m.forEach((r,e)=>{if(!e.isConnected)return;const n=e.getBoundingClientRect(),dx=r.left-n.left,dy=r.top-n.top;
  if(Math.abs(dx)<1&&Math.abs(dy)<1)return;try{e.animate([{translate:dx+'px '+dy+'px'},{translate:'0 0'}],{duration:340,easing:'cubic-bezier(.22,1,.36,1)'})}catch(x){}})}

// ----- Laufende Partien: Hilfen -----
function otherRunning(){const k=gameOf(G);return k==='stich'?['trump','werwolf','bid','play','cloud','juggle'].includes(G.phase):k==='dice'?G.phase==='play':false}
// Welcher Sitz wird von diesem Geraet gesteuert? (am Tisch-Handy: jeder menschliche Spieler)
function ctrlSeat(){
  if(!G||!G.players)return -1;
  if(G.local){const t=G.turn;return t>=0&&G.players[t]&&!G.players[t].bot?t:-1}
  return mySeat();
}
function onGameOther(g,prev){
  const k=gameOf(g);
  if(k==='stich'&&prev&&prev.trick&&g.trick){
    if(g.trick.length>prev.trick.length)sfx('card');
    if(prev.trick.length>0&&g.trick.length===0&&g.lastTrick){trickHold=Date.now()+1700;setTimeout(render,1750);if(g.lastTrick.bomb)boom('💣 Bombe!')}
  }
  if(k==='stich'&&prev&&g.round!==prev.round)sfx('deal');
  if(k==='dice'&&prev&&g.rollId!==prev.rollId){sfx('deal');diceAnim=Date.now()+650;setTimeout(render,680)}
  const cs=(()=>{const t=G;G=g;const r=ctrlSeat();G=t;return r})();
  if(prev&&g.v!==prev.v&&g.turn!==prev.turn&&cs>=0&&g.turn===cs&&!g.local)setTimeout(()=>sfx('turn'),250);
  if(g.phase==='over'&&(!prev||prev.phase!=='over')){const ms=mySeatOf(g),pl=k==='stich'?stPlaces(g):dcPlaces(g);if(ms>=0&&g.players.length>1)setTimeout(()=>sfx(pl[ms]===0?'win':'mid'),400)}
  if(g.phase==='over'&&!g.local&&store.online&&seen.recG!==code+':'+g.match){seen.recG=code+':'+g.match;const c=code;setTimeout(()=>store.rpc&&store.rpc('record_game',{p_code:c}).catch(()=>{}),1200)}
  G=g;clearTimeout(loadTimer);stale=false;render();maybeBot();
  const st=myStatus();if(st!==lastStatus){lastStatus=st;heartbeat()}
}
// Computergegner fuer die neuen Spiele (der Host bzw. das Tisch-Handy zieht fuer sie)
function otherBot(){
  if(!G||botTimer||G.paused||!otherRunning())return;
  const k=gameOf(G),isHost=G.host===myId||G.local,me_=mySeat();
  if(!isHost&&me_<0)return;
  const need=k==='stich'?(G.phase==='juggle'?G.players.some((p,s)=>p.bot&&G.jPick&&G.jPick[s]==null):!!(G.players[G.turn]&&G.players[G.turn].bot)):(DR(G).mode==='roll'&&G.players[G.turn]&&G.players[G.turn].bot);
  if(!need)return;
  const v=G.v,delay=(k==='dice'?750:950)+(trickHold>Date.now()?trickHold-Date.now():0)+(isHost?0:7000+Math.max(0,me_)*1500);
  botTimer=setTimeout(()=>{botTimer=null;if(!G||G.paused)return;if(G.v!==v){maybeBot();return}if(busy){setTimeout(maybeBot,300);return}
    const g=clone(G);const ok=k==='stich'?stBotStep(g):dcBotStep(g);if(ok)commit(g)},delay);
}
function othersTotal(){return G.local?(G.names||[]).length+(G.bots||0):Math.min(lobby.length,8)+(G.bots||0)}

// ----- Aktionen -----
function otherAct(a,v,el,g,s){
  const k=gameOf(G),host=G.host===myId||G.local,info=GAMES[k];
  switch(a){
    case 'rule':{if(!host||G.phase!=='lobby')return true;const key=el.dataset.k;g.rules=Object.assign({},k==='stich'?ST_RULES:DC_RULES,g.rules||{});
      g.rules[key]=v==='true'?true:v==='false'?false:v;if(k==='dice'&&key==='mode'&&v==='real')g.bots=0;commit(g);return true}
    case 'bot+':if(host&&othersTotal()<info.max&&!(k==='dice'&&DR(G).mode==='real')){g.bots=(g.bots||0)+1;commit(g)}return true;
    case 'bot-':if(host&&g.bots>0){g.bots--;commit(g)}return true;
    case 'botlvl':return true;
    case 'ln-add':{const nmv=(drafts.ln||'').trim().slice(0,16);if(!nmv||!G.local)return true;g.names=(g.names||[]).concat([nmv]).slice(0,8);drafts.ln='';commit(g);return true}
    case 'ln-del':if(G.local){g.names=(g.names||[]).filter((_,i)=>i!==+v);commit(g)}return true;
    case 'start':{if(!host)return true;const t=othersTotal();if(t<info.min||t>info.max)return true;
      const pl=G.local?(G.names||[]).map((x,i)=>({id:'L'+i,name:x,bot:false})):lobby.slice(0,8).map(p=>({id:p.id,name:String(p.name||'Spieler').slice(0,16),bot:false}));
      for(let i=0;i<(g.bots||0);i++)pl.push({id:'bot'+i,name:BOTS[i],bot:true});
      g.players=pl;if(k==='stich')stStart(g);else dcStart(g);commit(g);return true}
    case 'newmatch':if(G.phase==='over'&&(s>=0||G.local)){if(k==='stich')stStart(g);else dcStart(g);commit(g)}return true;
    case 'next':if(k==='stich'&&G.phase==='rend'&&(s>=0||G.local)&&Date.now()-(seen.endAt||0)>=2500){stNext(g);commit(g)}return true;
    case 'lv-end':closeModal();if(s>=0||G.local){g.phase='over';g.paused=null;g.turn=-1;if(k==='stich'&&G.phase!=='rend'&&G.phase!=='over'){/* Runde abbrechen */}commit(g)}return true;
    // Wizard
    case 'st-trump':{const c=ctrlSeat();if(stSetTrump(g,c,+v))commit(g);return true}
    case 'st-bid':{const c=ctrlSeat();if(stBid(g,c,+v))commit(g);return true}
    case 'st-sel':{if(G.phase!=='play'&&G.phase!=='juggle')return true;const c=+v;sel.has(c)?sel.clear():(sel.clear(),sel.add(c));render();return true}
    case 'st-play':{const c=ctrlSeat(),card=[...sel][0];if(card==null)return true;
      if(card===SHIFT){openModal('<h2>🎭 Gestaltwandler</h2><p class="note">Als was spielst du ihn?</p><div class="row"><button data-a="st-as" data-v="Z">🧙 Zauberer</button><button class="ghost" data-a="st-as" data-v="N">🤡 Narr</button></div>');return true}
      if(card===JUGGLER||card===CLOUD){openModal('<h2>'+(card===JUGGLER?'🤹 Jongleur (7½)':'☁️ Wolke (9¾)')+'</h2><p class="note">Welche Farbe soll die Karte haben?</p><div class="suitpick">'+ST_SUITS.map((x,i)=>'<button class="sp'+i+'" data-a="st-as" data-v="'+i+'">'+x+(i===G.trump?' (Trumpf)':'')+'</button>').join('')+'</div>');return true}
      if(stPlay(g,c,card)){sel.clear();commit(g)}else toast('Diese Karte darfst du gerade nicht spielen – du musst bedienen.');return true}
    case 'st-as':{closeModal();const c=ctrlSeat(),card=[...sel][0];if(card==null)return true;const as=card===SHIFT?v:+v;if(stPlay(g,c,card,as)){sel.clear();commit(g)}else toast('Das geht gerade nicht.');return true}
    case 'st-cloud':{const c=G.local?G.cloudBy:mySeat();if(stCloud(g,c,+v))commit(g);return true}
    case 'st-jug':{const card=[...sel][0];if(card==null)return true;let c=mySeat();
      if(G.local){c=G.players.findIndex((p,i)=>!p.bot&&G.jPick&&G.jPick[i]==null)}
      if(stJugglePick(g,c,card)){sel.clear();commit(g)}return true}
    case 'st-block':openModal('<h2>📒 Block</h2>'+stBlock(G)+'<button class="ghost" data-a="modal-x" style="margin-top:10px">Schließen</button>');return true;
    // Wuerfelblock
    case 'dc-roll':{askMotion();const c=ctrlSeat();if(dcRoll(g,c))commit(g);return true}
    case 'dc-hold':{const c=ctrlSeat();if(dcHold(g,c,+v))commit(g);return true}
    case 'dc-score':{const c=ctrlSeat();if(dcScore(g,c,v))commit(g);return true}
    case 'dc-cell':{const [t,cat]=String(v).split(':');const tt=+t;if(DR(G).mode!=='real'||G.phase!=='play')return true;if(!G.local&&tt!==mySeat())return true;
      const cur=G.sheet[tt]&&G.sheet[tt][cat];
      openModal('<h2>'+esc(DC_NAME[cat])+'</h2><p class="note">'+esc(G.players[tt].name)+' · '+esc(DC_HINT[cat])+'</p><div class="vpick">'+dcAllowed(cat).map(x=>'<button class="'+(x===cur?'on':'')+'" data-a="dc-set" data-v="'+tt+':'+cat+':'+x+'">'+(x===0?'0 ✗':x)+'</button>').join('')+'</div>'+
        (cur!=null?'<button class="ghost" data-a="dc-set" data-v="'+tt+':'+cat+':x" style="margin-top:10px">Eintrag löschen</button>':'')+'<button class="ghost" data-a="modal-x" style="margin-top:10px">Abbrechen</button>');return true}
    case 'dc-set':{closeModal();const [t,cat,x]=String(v).split(':');const c=G.local?+t:mySeat();if(dcSet(g,c,+t,cat,x==='x'?null:+x))commit(g);return true}
  }
  return false;
}

// ----- Wizard-Ansicht -----
const ST_GEM=['🔷','🔴','🟢','🟡'];
function stCardHtml(c,cls,attrs,as){
  let inner,kind;
  if(stNum(c)){kind='n s'+stSuit(c);inner='<span class="v">'+stVal(c)+'</span><span class="gm">'+ST_GEM[stSuit(c)]+'</span><span class="v2">'+stVal(c)+'</span>'}
  else if(stIsZ(c)){kind='z';inner='<span class="v">Z</span><span class="em">🧙</span><span class="lb">Zauberer</span>'}
  else if(stIsN(c)){kind='nr';inner='<span class="v">N</span><span class="em">🤡</span><span class="lb">Narr</span>'}
  else{const E={80:'🎭',81:'🐉',82:'🧚',83:'💣',84:'🐺',85:'🤹',86:'☁️'};kind='sp';
    inner='<span class="v">'+(c===JUGGLER?'7½':c===CLOUD?'9¾':'')+'</span><span class="em">'+E[c]+'</span><span class="lb">'+ST_SPEC_NAME[c]+'</span>'+
      (as!=null&&(c===JUGGLER||c===CLOUD)?'<span class="asg">'+ST_GEM[+as]+'</span>':'')+(c===SHIFT&&as?'<span class="asg">'+(as==='Z'?'🧙':'🤡')+'</span>':'')}
  return '<div class="scard '+kind+(cls?' '+cls:'')+'" '+(attrs||'')+'>'+inner+'</div>';
}
function stBlock(g){
  const n=g.players.length;
  return '<div class="blockw"><table class="rk block"><tr><th>R</th>'+g.players.map(p=>'<th>'+esc(p.name.slice(0,7))+'</th>').join('')+'</tr>'+
    (g.hist||[]).map(h=>'<tr><td>'+h.r+'</td>'+h.pts.map((x,s)=>'<td class="'+(x>0?'pos':'neg')+'">'+h.bids[s]+'/'+h.won[s]+'<br><b>'+(x>0?'+':'')+x+'</b></td>').join('')+'</tr>').join('')+
    '<tr class="sum"><td>Σ</td>'+g.scores.map(x=>'<td><b>'+x+'</b></td>').join('')+'</tr></table></div>';
}
function drawStich(app,top){
  const n=G.players.length,cs=ctrlSeat(),me_=G.local?cs:mySeat(),viewS=G.local?(cs>=0?cs:-1):me_;
  if(G.phase==='over'){
    const st=stStandings(G),medal=['🥇','🥈','🥉'],pl=stPlaces(G);
    setHTML(app,top+'<h1 style="margin-top:6px">Endstand</h1><div class="panel"><ul class="plist">'+st.map(x=>'<li><span>'+(medal[pl[x.s]]||'')+' '+esc(x.name)+'</span><b>'+x.pts+' Punkte</b></li>').join('')+'</ul></div>'+
      '<div class="panel"><h3>Block</h3>'+stBlock(G)+'</div>'+((me_>=0||G.local)?'<button data-a="newmatch">Neue Partie</button>':'')+'<button class="ghost" data-a="leave" style="margin-top:10px">Verlassen</button>');
    return;
  }
  if(G.phase==='rend'){
    const h=G.hist[G.hist.length-1],ek=code+':'+G.match+':'+G.round;
    if(seen.endK!==ek){seen.endK=ek;seen.endAt=Date.now()}
    const cd=Math.max(0,3-Math.ceil((Date.now()-seen.endAt)/1000));if(cd>0)setTimeout(render,400);
    setHTML(app,top+'<h1 style="margin-top:6px">Runde '+G.round+' von '+G.total+'</h1><div class="panel"><ul class="plist">'+G.players.map((p,s)=>'<li><span>'+esc(p.name)+'<span class="note" style="margin-left:6px">Ansage '+h.bids[s]+' · Stiche '+h.won[s]+'</span></span><b class="'+(h.pts[s]>0?'pos':'neg')+'">'+(h.pts[s]>0?'+':'')+h.pts[s]+'</b></li>').join('')+'</ul></div>'+
      '<div class="panel"><h3>Zwischenstand</h3>'+stStandings(G).map((x,i)=>'<div class="rlist"><span>'+(i+1)+'. '+esc(x.name)+'</span><b>'+x.pts+'</b></div>').join('')+'</div>'+
      ((me_>=0||G.local||mySeat()>=0)?'<button data-a="next" '+(cd>0?'disabled':'')+'>Nächste Runde'+(cd>0?' ('+cd+')':'')+'</button>':'<p class="note" style="text-align:center">Gleich geht es weiter …</p>'));
    return;
  }
  const trumpTxt=G.trump>=0?ST_GEM[G.trump]+' '+ST_SUITS[G.trump]:'kein Trumpf';
  let opps='';
  for(let i=1;i<=n;i++){const s=((viewS<0?0:viewS)+i)%n;if(s===viewS)continue;const p=G.players[s];
    opps+='<div class="opp'+(G.turn===s&&!G.paused?' turn':'')+'" data-s="'+s+'"><div class="n">'+(p.bot?avOf(p.id,p.name,true):avOf(p.id,p.name,false))+(s===G.dealer?'<span title="Geber">🎴</span>':'')+esc(p.name)+'</div>'+
      '<div class="r">'+(G.bids[s]==null?'Ansage …':'Ansage '+G.bids[s]+' · Stiche '+G.won[s])+'</div><div class="c">'+G.hands[s].length+' Karten · '+G.scores[s]+' P</div></div>'}
  const showLast=!G.trick.length&&G.lastTrick&&trickHold>Date.now();
  const tr=showLast?G.lastTrick.cards:G.trick;
  const wi=showLast?G.lastTrick.cards.findIndex(e=>e.s===G.lastTrick.w):-1;
  const pile=tr.length?'<div class="strick">'+tr.map((e,i)=>'<div class="te'+(i===wi?' win':'')+'" data-key="t'+e.c+'">'+stCardHtml(e.c,'',' style="--i:'+i+'"',e.as)+'<span>'+esc(nm(G,e.s))+'</span></div>').join('')+'</div>':'<div class="empty">'+(G.phase==='play'?esc(nm(G,G.turn))+' spielt aus':'')+'</div>';
  const tcard=G.tcard!=null?stCardHtml(G.tcard,'mini'):'<div class="scard mini none">–</div>';
  const table='<div class="table stable"><div class="tinfo"><span class="tc">'+tcard+'</span><span><small>Trumpf</small><b>'+trumpTxt+'</b></span><span class="rd"><small>Runde</small><b>'+G.round+'/'+G.total+'</b></span></div>'+pile+'<div class="msg">'+esc(G.msg||'')+'</div></div>';
  // Aktion je nach Phase
  let panel='',hand='';const myTurn=cs>=0&&G.turn===cs;
  const hs=viewS>=0?G.hands[viewS]:[];
  if(G.phase==='trump'||G.phase==='werwolf'){
    panel=myTurn?'<div class="panel act"><b>'+(G.phase==='werwolf'?'🐺 Werwolf: Bestimme den Trumpf':'Bestimme den Trumpf')+'</b><div class="suitpick">'+ST_SUITS.map((x,i)=>'<button class="sp'+i+'" data-a="st-trump" data-v="'+i+'">'+ST_GEM[i]+' '+x+'</button>').join('')+(G.phase==='werwolf'?'<button class="ghost" data-a="st-trump" data-v="-1">Kein Trumpf</button>':'')+'</div></div>'
      :'<p class="note" style="text-align:center">'+esc(nm(G,G.turn))+' bestimmt den Trumpf …</p>';
  }else if(G.phase==='bid'){
    if(myTurn){const sum=G.bids.reduce((a,x)=>a+(x||0),0);
      panel='<div class="panel act"><b>Wie viele Stiche holst du?</b><span class="note">Bisher angesagt: '+sum+' von '+G.round+'</span><div class="bidpick">'+[...Array(G.round+1).keys()].map(b=>'<button data-a="st-bid" data-v="'+b+'" '+(stBidOk(G,cs,b)?'':'disabled')+'>'+b+'</button>').join('')+'</div></div>'}
    else panel='<p class="note" style="text-align:center">'+esc(nm(G,G.turn))+' sagt an …</p>';
  }else if(G.phase==='cloud'){
    const cb=G.cloudBy;panel=(G.local?!G.players[cb].bot:cb===mySeat())?'<div class="panel act"><b>☁️ Wolke: Ändere deine Ansage ('+G.bids[cb]+')</b><div class="row"><button data-a="st-cloud" data-v="-1" '+(G.bids[cb]>0?'':'disabled')+'>−1</button><button data-a="st-cloud" data-v="1">+1</button></div></div>':'<p class="note" style="text-align:center">'+esc(nm(G,cb))+' ändert die Ansage …</p>';
  }else if(G.phase==='juggle'){
    const js=G.local?G.players.findIndex((p,i)=>!p.bot&&G.jPick&&G.jPick[i]==null):mySeat();
    const mine=js>=0&&G.jPick&&G.jPick[js]==null;
    panel=mine?'<div class="panel act"><b>🤹 '+(G.local?esc(nm(G,js))+': ':'')+'Wähle eine Karte, die du nach links weitergibst</b><button data-a="st-jug" '+(sel.size?'':'disabled')+'>Weitergeben</button></div>':'<p class="note" style="text-align:center">Warte, bis alle eine Karte gewählt haben …</p>';
    if(G.local&&js>=0){const h2=G.hands[js];hand='<div class="shand">'+h2.map(c=>stCardHtml(c,sel.has(c)?'sel':'','data-key="h'+c+'" data-a="st-sel" data-v="'+c+'"')).join('')+'</div>'}
  }else if(G.phase==='play'&&myTurn){
    const card=[...sel][0],ok=card!=null&&(card===SHIFT||card===JUGGLER||card===CLOUD?true:stCanPlay(G,cs,card));
    panel='<div class="actions"><button class="ghost" data-a="st-block">📒 Block</button><button data-a="st-play" '+(ok?'':'disabled')+'>Ausspielen</button></div>';
  }else panel='<div class="actions"><button class="ghost" data-a="st-block">📒 Block</button></div>';
  if(!hand&&viewS>=0){
    const can=c=>G.phase==='play'&&myTurn&&(c===SHIFT?(stCanPlay(G,cs,c,'Z')):c===JUGGLER||c===CLOUD?stCanPlay(G,cs,c,0):stCanPlay(G,cs,c));
    const selectable=(G.phase==='play'&&myTurn)||(G.phase==='juggle'&&G.jPick&&G.jPick[viewS]==null);
    hand='<div class="shand">'+hs.map(c=>stCardHtml(c,(sel.has(c)?'sel':'')+(G.phase==='play'&&myTurn?(can(c)?' ok':' no'):''),'data-key="h'+c+'" '+(selectable?'data-a="st-sel" data-v="'+c+'"':''))).join('')+'</div>';
  }
  const meB=viewS>=0?'<div class="mebar"><span>'+(G.local?'🎲 ':'')+esc(nm(G,viewS))+(viewS===G.dealer?' 🎴':'')+'</span><span>'+(G.bids[viewS]==null?'Ansage …':'Ansage '+G.bids[viewS]+' · Stiche '+G.won[viewS])+' · '+G.scores[viewS]+' P</span></div>':'<p class="note" style="text-align:center">Du schaust zu.</p>';
  const pz=G.paused?'<div class="pausebox">⏸ Pausiert von '+esc(G.paused.by)+((mySeat()>=0||G.local)&&(!G.paused.uid||G.paused.uid===myId)?'<button data-a="unpause">Weiterspielen</button>':'')+'</div>':'';
  setHTML(app,top+'<div class="opps'+(n>4?' many':'')+'">'+opps+'</div>'+table+pz+meB+(G.local&&cs>=0&&G.phase!=='juggle'?'<p class="note" style="text-align:center;margin:4px 0">📱 Gib das Handy an <b>'+esc(nm(G,cs))+'</b></p>':'')+hand+panel);
}

// ----- Würfelblock-Ansicht -----
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHtml(v,cls,attrs){return '<div class="die'+(cls?' '+cls:'')+'" '+(attrs||'')+'>'+[...Array(9).keys()].map(i=>'<i class="'+(PIPS[v]&&PIPS[v].includes(i)?'p':'')+'"></i>').join('')+'</div>'}
function drawDice(app,top){
  const n=G.players.length,real=DR(G).mode==='real',cs=ctrlSeat(),myTurn=!real&&cs>=0&&G.turn===cs,me_=mySeat();
  const tot=G.players.map((_,s)=>dcTotals(G.sheet[s]));
  const rolling=diceAnim>Date.now();
  const canEdit=s=>real&&G.phase==='play'&&(G.local||s===me_);
  const cell=(s,k)=>{const v=G.sheet[s][k];
    if(v!=null)return '<td class="f'+(canEdit(s)?' ed':'')+'" '+(canEdit(s)?'data-a="dc-cell" data-v="'+s+':'+k+'"':'')+'>'+(v===0?'<span class="z">✗</span>':v)+'</td>';
    if(!real&&myTurn&&s===cs&&G.rolls>0&&!rolling){const p=dcScoreOf(k,G.dice);return '<td class="pot'+(p?'':' zero')+'" data-a="dc-score" data-v="'+k+'">'+(p||'0')+'</td>'}
    if(canEdit(s))return '<td class="ed empty" data-a="dc-cell" data-v="'+s+':'+k+'">+</td>';
    return '<td></td>'};
  const head='<tr><th></th>'+G.players.map((p,s)=>'<th class="'+(!real&&G.turn===s&&G.phase==='play'?'cur':'')+'">'+esc(p.name.slice(0,8))+'</th>').join('')+'</tr>';
  const row=k=>'<tr><td class="cn">'+DC_NAME[k]+'</td>'+G.players.map((_,s)=>cell(s,k)).join('')+'</tr>';
  const sum=(lbl,f,cls)=>'<tr class="'+(cls||'sum')+'"><td class="cn">'+lbl+'</td>'+tot.map(f).join('')+'</tr>';
  const sheet='<div class="blockw"><table class="dsheet">'+head+DC_UPPER.map(row).join('')+
    sum('Summe oben',x=>'<td>'+x.up+'</td>')+sum('Bonus (ab 63)',x=>'<td>'+(x.bonus?'+35':x.up>=63?'+35':'<small>'+Math.max(0,63-x.up)+' fehlen</small>')+'</td>')+
    ['k3','k4','fh','ss','ls','kn','ch'].map(row).join('')+sum('Gesamt',x=>'<td><b>'+x.total+'</b></td>','total')+'</table></div>';
  if(G.phase==='over'){
    const st=dcStandings(G),pl=dcPlaces(G),medal=['🥇','🥈','🥉'];
    setHTML(app,top+'<h1 style="margin-top:6px">Endstand</h1><div class="panel"><ul class="plist">'+st.map(x=>'<li><span>'+(n>1?(medal[pl[x.s]]||''):'🎲')+' '+esc(x.name)+'</span><b>'+x.pts+' Punkte</b></li>').join('')+'</ul></div>'+
      '<div class="panel">'+sheet+'</div>'+((me_>=0||G.local)?'<button data-a="newmatch">Neue Partie</button>':'')+'<button class="ghost" data-a="leave" style="margin-top:10px">Verlassen</button>');
    if(G.local)ls.set('al_table','');
    return;
  }
  let area='';
  if(!real){
    const who=G.players[G.turn];
    const dice=G.dice.map((v,i)=>dieHtml(rolling&&!G.held[i]?1+Math.floor(Math.random()*6):v,(G.held[i]&&G.rolls>0?'held':'')+(rolling&&!G.held[i]?' roll':''),myTurn&&G.rolls>0&&G.rolls<3?'data-a="dc-hold" data-v="'+i+'"':'')).join('');
    area='<div class="panel dicebox"><div class="dturn">'+(myTurn?(G.local?'📱 '+esc(who.name)+' ist dran':'Du bist dran'):esc(who?who.name:'')+' ist dran')+' · Wurf '+G.rolls+'/3</div>'+
      '<div class="dice">'+(G.rolls>0?dice:'<span class="note">Noch nicht gewürfelt</span>')+'</div>'+
      (myTurn?'<button data-a="dc-roll" '+(G.rolls<3&&!(G.rolls>0&&G.held.every(Boolean))?'':'disabled')+'>🎲 Würfeln'+(G.rolls>0&&G.rolls<3?' ('+(3-G.rolls)+' übrig)':'')+'</button>'+
        (G.rolls>0?'<p class="note" style="margin:8px 0 0;text-align:center">'+(G.rolls<3?'Tippe Würfel an, um sie festzuhalten. ':'')+'Trag deinen Wurf unten in ein Feld ein.</p>':'')+shakeHint():'')+'</div>';
  }else area='<div class="panel"><p class="note" style="margin:0">🎲 Würfelt mit echten Würfeln. '+(G.local?'Tippt in die Spalte des Spielers, um seine Punkte einzutragen.':'Tippe in deine Spalte, um deine Punkte einzutragen.')+'</p></div>';
  const pz=G.paused?'<div class="pausebox">⏸ Pausiert von '+esc(G.paused.by)+((mySeat()>=0||G.local)&&(!G.paused.uid||G.paused.uid===myId)?'<button data-a="unpause">Weiterspielen</button>':'')+'</div>':'';
  setHTML(app,top+pz+area+'<div class="panel" style="padding:8px">'+sheet+'</div>');
}

const ST_RULES_TXT='<details><summary>Regeln Wizard</summary>Jede Runde bekommt jeder eine Karte mehr (Runde 1: 1 Karte). Die oberste Karte des Rests bestimmt den Trumpf: Zahl = deren Farbe, Narr = kein Trumpf, Zauberer = der Geber wählt. In der letzten Runde ohne Rest gibt es keinen Trumpf.<br><br>Dann sagt jeder an, wie viele Stiche er holt. Farbe muss bedient werden; Zauberer, Narren und Sonderkarten dürfen immer gespielt werden. Der erste Zauberer gewinnt den Stich, sonst der höchste Trumpf, sonst die höchste Karte der ausgespielten Farbe. Narren verlieren immer (liegen nur Narren, gewinnt der erste).<br><br><b>Punkte:</b> Ansage genau getroffen: 20 + 10 pro Stich. Sonst −10 pro Stich Abweichung.<br><br><b>Sonderkarten (Spezial):</b> 🎭 Gestaltwandler – als Zauberer oder Narr spielbar. 🐉 Drache – schlägt alles, auch Zauberer, nur nicht die Fee. 🧚 Fee – verliert sonst wie ein Narr, schlägt aber den Drachen. 💣 Bombe – der Stich zählt für niemanden, wer ihn bekommen hätte, spielt aus. 🐺 Werwolf – wer ihn bekommt, tauscht ihn vor den Ansagen gegen die Trumpfkarte und bestimmt den Trumpf. 🤹 Jongleur (7½) – Farbe frei wählbar; nach dem Stich gibt jeder eine Karte nach links weiter. ☁️ Wolke (9¾) – Farbe frei wählbar; wer den Stich gewinnt, ändert seine Ansage um +1 oder −1.</details>';
const DC_RULES_TXT='<details><summary>Regeln Würfelblock</summary>Jeder hat pro Zug bis zu 3 Würfe mit 5 Würfeln. Nach jedem Wurf kannst du Würfel festhalten. Danach trägst du das Ergebnis in ein freies Feld ein – passt nichts, streichst du ein Feld (0 Punkte).<br><br><b>Oben:</b> Einser bis Sechser zählen die Augen der jeweiligen Zahl. Ab 63 Punkten oben gibt es 35 Bonuspunkte.<br><b>Unten:</b> Dreierpasch und Viererpasch (Summe aller Augen), Full House (25), Kleine Straße (4 in Folge, 30), Große Straße (5 in Folge, 40), Fünf Gleiche (50), Chance (Summe aller Augen).<br><br>Nach 13 Runden gewinnt, wer die meisten Punkte hat. Mit echten Würfeln würfelt ihr am Tisch und tragt nur die Punkte ein.</details>';

// ----- Schütteln zum Würfeln -----
let shakeLast=0,motionAsked=false;
const motionNeedsAsk=()=>!!(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function');
let motionOk=!motionNeedsAsk();
function askMotion(){if(motionOk||motionAsked||!motionNeedsAsk())return;motionAsked=true;
  try{DeviceMotionEvent.requestPermission().then(r=>{motionOk=r==='granted';render()}).catch(()=>{})}catch(e){}}
function shakeHint(){if(!SET.shake||!('ontouchstart' in window)||!window.DeviceMotionEvent||!G||G.rolls>=3)return '';
  return '<p class="note shk">📳 '+(motionOk?'Oder einfach das Handy schütteln':'Nach dem ersten Tippen kannst du auch schütteln')+'</p>'}
function canShakeRoll(){if(!SET.shake||!G||gameOf(G)!=='dice'||G.phase!=='play'||G.paused||DR(G).mode!=='roll'||modalOpen||document.hidden)return false;
  const c=ctrlSeat();return c>=0&&G.turn===c&&!(G.players[c]&&G.players[c].bot)&&G.rolls<3&&!(G.rolls>0&&G.held.every(Boolean))}
window.addEventListener('devicemotion',e=>{const a=e.acceleration&&e.acceleration.x!=null?e.acceleration:null,g=e.accelerationIncludingGravity;
  let m;if(a)m=Math.hypot(a.x||0,a.y||0,a.z||0);else if(g&&g.x!=null)m=Math.abs(Math.hypot(g.x||0,g.y||0,g.z||0)-9.81);else return;
  if(m<15)return;const now=Date.now();if(now-shakeLast<1400||!canShakeRoll())return;shakeLast=now;
  if(SET.vib)try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}act('dc-roll')});
</script>
