<style>
  :root{
    --ink:#f6efe2; --mute:#cbb89b; --card:#fbf8ee;
    --gold:#f2c14e; --onGold:#2b2100; --red:#c0392b; --black:#1c1c1c; --line:rgba(255,220,170,.17);
    --f1:#2c8a55; --f2:#17603a; --f3:#0c3d22; --ttext:#d5ead9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Kein Markieren bei langem Druecken (sonst oeffnet Android die Google-Suche) */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#1d110a;
    min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  /* Hintergrund als feste Ebene: wird nicht bei jedem Scrollen neu gezeichnet */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(95% 55% at 50% -8%,rgba(255,186,105,.30),transparent 70%),
      radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.55),transparent 60%),
      repeating-linear-gradient(91deg,rgba(0,0,0,.16) 0 2px,transparent 2px 11px,rgba(255,255,255,.025) 11px 12px,transparent 12px 27px),
      linear-gradient(180deg,#402716,#1d110a)}
  body[data-bg=night]{background:#0b1022}
  body[data-bg=night]::before{background:radial-gradient(90% 50% at 50% -5%,rgba(120,150,255,.28),transparent 70%),radial-gradient(60% 40% at 85% 100%,rgba(80,40,160,.25),transparent 70%),linear-gradient(180deg,#1a2550,#0b1022)}
  body[data-bg=living]{background:#2b211a}
  body[data-bg=living]::before{background:radial-gradient(70% 45% at 20% 0%,rgba(255,214,150,.35),transparent 70%),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 34px),linear-gradient(180deg,#6b5442,#2b211a)}
  body[data-bg=neon]{background:#0d0b26}
  body[data-bg=neon]::before{background:radial-gradient(70% 45% at 15% 5%,rgba(255,60,180,.35),transparent 70%),radial-gradient(70% 45% at 90% 95%,rgba(0,220,255,.25),transparent 70%),linear-gradient(160deg,#2a0b3d,#0d0b26)}
  body[data-bg=concrete]{background:#2a2c2f}
  body[data-bg=concrete]::before{background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.12),transparent 70%),linear-gradient(180deg,#4a4d52,#22252a)}

  #app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  #app>*{flex-shrink:0}
  .conn{font-size:12px;color:#ff8f7a;text-align:center;margin:-4px 0 6px}
  h1{font-size:38px;margin:22px 0 4px;letter-spacing:.5px;font-family:Georgia,'Times New Roman',serif;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5)}
  h2{font-size:24px;margin:8px 0 12px;font-family:Georgia,'Times New Roman',serif;color:var(--gold)}
  h3{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
  .suits{letter-spacing:10px;font-size:20px;margin:0 0 6px;color:var(--mute)}
  .suits i{font-style:normal;color:#d9534f}
  .sub{color:var(--mute);margin:0 0 18px;line-height:1.4}
  .panel{background:rgba(12,6,2,.45);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
  input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font-size:18px;padding:0 14px;outline:none}
  input:focus{border-color:var(--gold)}
  input+input,input+label{margin-top:10px}
  button{font:inherit;font-weight:650;font-size:17px;height:52px;border-radius:14px;border:0;padding:0 18px;cursor:pointer;background:var(--gold);color:var(--onGold);width:100%;touch-action:manipulation}
  button.ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  button.small{height:38px;font-size:14.5px;width:auto;padding:0 12px;border-radius:11px}
  button.danger{background:#b5402f;color:#fff}
  button:disabled{opacity:.4;cursor:default}
  button:active:not(:disabled){transform:translateY(1px)}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  .stack>*+*{margin-top:10px}
  .note{font-size:13.5px;color:var(--mute);line-height:1.45}
  .err{color:#ff8f7a;font-size:14px;min-height:18px;margin-top:8px}
  .code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 2px}
  ul.plist{list-style:none;margin:0;padding:0}
  ul.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:17px}
  ul.plist li:last-child{border-bottom:0}
  ul.plist li>span:first-child{display:flex;gap:10px;align-items:center;min-width:0}
  .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
  .tag.gold{color:var(--gold);border-color:var(--gold)}
  .dot{width:10px;height:10px;border-radius:50%;background:#6b6258;flex:none}
  .dot.on{background:#3ddc6f;box-shadow:0 0 0 3px rgba(61,220,111,.2)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:99px;background:#e2463a;color:#fff;font-size:12px;font-weight:800;padding:0 6px;margin-left:6px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .acct{height:38px;width:auto;font-size:14.5px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .nav button{height:64px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:14px}
  .nav button b{font-size:22px;line-height:1;position:relative}
  .nav .badge{position:absolute;top:-8px;right:-16px;margin:0}
  .back{background:none;border:0;color:var(--mute);height:auto;width:auto;padding:4px 0;font-size:15px;font-weight:600;margin:2px 0 6px;align-self:flex-start}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--mute)}
  table.rk{width:100%;border-collapse:collapse;font-size:15px}
  table.rk th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:4px 4px 8px}
  table.rk th:nth-child(2){text-align:left}
  table.rk td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  table.rk td:nth-child(2){text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.rk tr.me td{color:var(--gold)}
  .award{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .award:first-of-type{border-top:0}
  .award .e{font-size:28px;width:36px;text-align:center}
  .award b{display:block}
  .award span{font-size:13.5px;color:var(--mute)}
  .pcard{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .pcard:first-of-type{border-top:0}
  .pcard .pts{margin-left:auto;font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .pcard .det{font-size:12.5px;color:var(--mute);margin-top:2px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{width:auto;height:auto;padding:8px 10px;font-size:13.5px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--ink);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px}
  .opt.on{border-color:var(--gold)}
  .sw{width:44px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.25)}
  .swc{width:30px;height:30px;border-radius:50%}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:10px;gap:8px}
  .top b{color:var(--ink);letter-spacing:2px}
  .top .tb{display:flex;gap:6px;align-items:center}
  .linkbtn{background:none;border:0;color:var(--mute);font-size:13px;height:auto;width:auto;padding:4px;text-decoration:underline;font-weight:400}
  .iconbtn{width:34px;height:34px;padding:0;border-radius:10px;font-size:15px;background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  .opps{display:flex;gap:8px;flex-wrap:wrap}
  .opp{flex:1 1 30%;min-width:0;background:rgba(12,6,2,.45);border:1px solid var(--line);border-radius:14px;padding:9px 10px;position:relative}
  .opp.turn{border-color:var(--gold)}
  /* Leuchten ueber Deckkraft statt Schatten-Animation: guenstig fuer die Grafikkarte */
  .opp.turn::after{content:"";position:absolute;inset:-3px;border-radius:16px;box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold);opacity:.25;animation:glow 1.3s ease-in-out infinite alternate;pointer-events:none;will-change:opacity}
  .opp .n{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .r{font-size:11.5px;color:var(--mute);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .c{font-size:13px;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
  .opp .c span:last-child{color:var(--gold)}

  /* ---------- Tisch ---------- */
  .table{flex:1;min-height:215px;max-height:340px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 14px;margin:16px 0 8px;
    border-radius:120px;border:10px solid #5d3619;color:var(--ttext);
    background:radial-gradient(ellipse at 50% 30%,var(--f1) 0%,var(--f2) 55%,var(--f3) 100%);
    box-shadow:0 0 0 2px #24130a,inset 0 0 0 2px rgba(0,0,0,.4),inset 0 0 46px rgba(0,0,0,.6),0 16px 30px rgba(0,0,0,.55)}
  .table::before{content:"";position:absolute;inset:9px;border-radius:inherit;border:1px dashed rgba(255,255,255,.16);pointer-events:none}
  .table>*{position:relative;z-index:1}
  body[data-surface=desk] .table{border-radius:14px;border:8px solid #2e1b0e;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18)),repeating-linear-gradient(90deg,#6b4423 0 3px,#744a27 3px 10px,#5f3c1f 10px 12px,#6e4625 12px 24px)}
  body[data-surface=desk] .table::before{inset:14px 22px;border-radius:8px;border:2px dashed rgba(255,255,255,.22);background:radial-gradient(ellipse at 50% 40%,var(--f1),var(--f3));box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:0}
  body[data-surface=wood] .table{border-radius:10px;border:6px solid #7a4e26;--ttext:#3a2410;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.08)),repeating-linear-gradient(90deg,#c58e57 0 2px,#cf9862 2px 14px,#b98251 14px 16px,#d29d68 16px 52px,#5a3518 52px 54px)}
  body[data-surface=wood] .table::before{display:none}
  body[data-surface=grass] .table{border-radius:26px;border:9px solid #2a5a22;
    background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.28) 100%),repeating-linear-gradient(90deg,#3f8f3a 0 34px,#4ba344 34px 68px)}
  body[data-surface=grass] .table::before{inset:12px;border:2px solid rgba(255,255,255,.55);border-radius:16px}
  body[data-surface=marble] .table{border-radius:24px;border:9px solid #8d8d8d;--ttext:#3b3b3b;
    background:linear-gradient(115deg,transparent 40%,rgba(120,120,120,.25) 41%,transparent 43%),linear-gradient(35deg,transparent 60%,rgba(140,140,140,.2) 61%,transparent 63%),linear-gradient(160deg,transparent 20%,rgba(160,160,160,.18) 21%,transparent 23%),linear-gradient(135deg,#f4f2ee,#d8d5cf)}
  body[data-surface=marble] .table::before{display:none}
  body[data-surface=space] .table{border:6px solid #2b3570;
    background:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 33% 74%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 18%,#fff,transparent),radial-gradient(1px 1px at 76% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 30%,#cfe,transparent),radial-gradient(1px 1px at 22% 55%,#fff,transparent),radial-gradient(ellipse at 60% 70%,rgba(140,80,255,.35),transparent 60%),radial-gradient(ellipse at 50% 40%,#1b2550,#070b1e)}
  body[data-surface=space] .table::before{border-color:rgba(160,180,255,.25)}

  .pile{display:flex;justify-content:center;min-height:92px;align-items:center}
  .pile.closed{opacity:.45;transform:scale(.9)}
  .pile.closing{animation:closing .55s ease-in backwards}
  .pile .empty{width:62px;height:90px;border:2px dashed rgba(255,255,255,.25);border-radius:10px}
  .msg{font-size:14px;color:var(--ttext);text-align:center;min-height:18px;padding:0 14px}
  .msg.new{animation:msgIn .35s ease-out}
  .pausebox{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);border-radius:inherit;color:#fff;text-align:center;padding:16px}
  .pausebox b{font-size:22px}
  .pausebox button{width:auto}
  .status{text-align:center;font-size:16.5px;font-weight:650;min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 6px;line-height:1.3}
  .status.me{color:var(--gold)}
  .status.new{animation:pop .5s ease-out}
  .card{width:58px;height:84px;border-radius:9px;background:var(--card);color:var(--black);position:relative;flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid #d9d3bf;user-select:none;transition:transform .12s}
  .card.red{color:var(--red)}
  .card .k{position:absolute;top:5px;left:7px;font-size:19px;font-weight:800;line-height:1}
  .card .s{position:absolute;top:25px;left:7px;font-size:15px;line-height:1}
  .card .big{position:absolute;right:7px;bottom:5px;font-size:30px;line-height:1}
  .pile .card{margin:0 -9px;transform:rotate(var(--r,0deg))}
  .pile.in .card{animation:throwDown .38s cubic-bezier(.2,.8,.3,1.15) backwards;animation-delay:calc(var(--i,0)*70ms)}
  .pile.in.mine .card{animation-name:throwUp}
  .hand{display:flex;flex-wrap:wrap;justify-content:center;padding:14px 14px 4px 30px;row-gap:10px;min-height:100px}
  .hand .card{margin-left:-16px;cursor:pointer}
  .hand.deal .card{animation:dealIn .4s cubic-bezier(.2,.8,.3,1.1) backwards;animation-delay:calc(var(--i,0)*45ms)}
  /* Wenn man dran ist: legbare Karten leuchten gruen, der Rest wird abgedunkelt */
  .hand .card.ok{box-shadow:0 0 0 2px #5fe08a,0 0 12px rgba(95,224,138,.75)}
  .hand .card.no{filter:brightness(.55) saturate(.6)}
  .hand .card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.4)}
  .hand .card.fresh::after{content:"neu";position:absolute;top:-8px;right:-4px;background:var(--gold);color:var(--onGold);font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
  .mebar{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--mute);margin-top:4px}
  .actions{display:flex;gap:10px;margin-top:10px;position:sticky;bottom:12px;z-index:3}
  .actions button{box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .actions .ghost{background:#3b2a1d}
  .actions button:disabled{opacity:1;filter:brightness(.55)}
  .place{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1b1b;color:#fff;padding:12px 16px;border-radius:12px;
    font-size:14.5px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;line-height:1.35}
  #toast.on{opacity:1}
  #modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
  #modal.on{display:flex;animation:fadeIn .2s ease-out}
  #modal .box{width:100%;max-width:440px;background:#24170e;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:env(safe-area-inset-bottom);animation:up .25s ease-out}
  #modal .box h2{margin-top:0}
  details{font-size:14px;color:var(--mute);line-height:1.5}
  details summary{cursor:pointer;color:var(--ink);font-weight:600;padding:2px 0}
  .table.small{flex:0 0 auto;min-height:112px;padding:10px 14px;margin:12px 0 6px}
  .table.small .pile{min-height:0}.table.small .pile .empty{display:none}
  .wish{margin:6px 0 12px}
  .hand.mini{padding:10px 10px 0 22px;min-height:0;row-gap:6px}
  .hand.mini .card{width:42px;height:60px;margin-left:-12px;border-radius:7px;cursor:default}
  .hand.mini .card .k{font-size:15px;top:4px;left:5px}.hand.mini .card .s{font-size:12px;top:21px;left:5px}.hand.mini .card .big{font-size:18px;right:4px;bottom:3px}
  .card.back{background:repeating-linear-gradient(45deg,#7a1f1f 0 6px,#932a2a 6px 12px);border:3px solid var(--card)}
  @media (max-height:720px){.table{min-height:165px;padding:10px 14px;margin:10px 0 4px}}
  .wish .wr{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .wish .wr button{height:46px;padding:0;font-size:16px;border-radius:10px}
  .wish .chosen{font-size:14px;color:var(--mute);margin:10px 0;min-height:36px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{width:auto;height:34px;font-size:15px;padding:0 12px;border-radius:99px}
  .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);margin-left:8px;white-space:nowrap}
  .tm.hot{color:#ff6b57}
  .oh{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
  .oc{background:var(--card);color:#1c1c1c;border-radius:4px;font-size:11.5px;font-weight:800;line-height:1;padding:3px 2px;min-width:21px;text-align:center}
  .oc.red{color:var(--red)}.oc i{font-style:normal;display:block;font-size:10px;margin-top:1px}

  /* Sanduhr: sitzt rechts auf dem Tisch, nie ueber den eigenen Karten */
  .hgw{position:absolute;right:20px;top:50%;width:46px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
    opacity:0;transform:translateY(-50%) scale(.55);transition:opacity .3s,transform .5s ease-out;will-change:transform,opacity}
  .hgw.on{opacity:1}
  .hgw svg{width:46px;height:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .hgw b{font-size:17px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}

/* ===================== Geschmeidige Animationen ===================== */
:root{--e-out:cubic-bezier(.22,1,.36,1);--e-spring:cubic-bezier(.34,1.45,.64,1);--e-soft:cubic-bezier(.4,0,.2,1)}
button{transition:transform .2s var(--e-out),background-color .22s var(--e-soft),color .22s,box-shadow .28s var(--e-out),opacity .22s,filter .22s}
button:active:not(:disabled){transform:scale(.965);transition-duration:.07s}
.card,.scard{transition:transform .32s var(--e-spring),box-shadow .3s var(--e-out),filter .28s var(--e-soft),opacity .28s}
.die{transition:transform .34s var(--e-spring),box-shadow .3s var(--e-out),background .3s}
.opp{transition:box-shadow .35s var(--e-out),border-color .35s,background-color .35s,opacity .35s}
.sw2 i{transition:transform .3s var(--e-spring)}
.tbar .tt i{transition:width .3s linear,background .45s var(--e-soft)}
/* Bildschirmwechsel */
#app.enter{animation:scr .5s var(--e-out)}
@keyframes scr{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:none}}
#app.enter>.panel,#app.enter>.nav{animation:rowIn .55s var(--e-out) backwards}
#app.enter>.panel:nth-child(2){animation-delay:40ms}#app.enter>.panel:nth-child(3){animation-delay:80ms}#app.enter>.panel:nth-child(4){animation-delay:120ms}
#app.enter>.panel:nth-child(5),#app.enter>.nav{animation-delay:160ms}#app.enter>.panel:nth-child(n+6){animation-delay:200ms}
#app.enter .plist li,#app.enter .pcard{animation:rowIn .5s var(--e-out) backwards;animation-delay:calc(var(--i,0)*55ms + 90ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
details[open]>:not(summary){animation:rowIn .38s var(--e-out)}
/* Fenster */
#modal{transition:background-color .25s}
#modal.on{animation:fadeIn .25s var(--e-soft)}
#modal .box{animation:boxIn .46s var(--e-spring)}
#modal.out{animation:fadeOut .22s var(--e-soft) forwards;pointer-events:none}
#modal.out .box{animation:boxOut .22s var(--e-soft) forwards}
@keyframes boxIn{from{transform:translateY(46px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes boxOut{to{transform:translateY(30px) scale(.97);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.gpick .gcard{animation:rowIn .45s var(--e-out) backwards}
.gpick .gcard:nth-child(2){animation-delay:50ms}.gpick .gcard:nth-child(3){animation-delay:100ms}.gpick .gcard:nth-child(4){animation-delay:150ms}
#toast{transform:translate(-50%,14px) scale(.96);transition:opacity .3s var(--e-soft),transform .4s var(--e-spring)}
#toast.on{transform:translate(-50%,0)}
.ov .ovp{animation:rowIn .35s var(--e-out)}
/* Karten */
.pile.in .card{animation:throwDown .52s var(--e-out) backwards;animation-delay:calc(var(--i,0)*65ms)}
@keyframes throwDown{0%{transform:translateY(-44vh) rotate(-30deg) scale(1.2);opacity:0}30%{opacity:1}82%{transform:rotate(var(--r,0deg)) scale(.975)}100%{transform:rotate(var(--r,0deg));opacity:1}}
@keyframes throwUp{0%{transform:translateY(44vh) rotate(30deg) scale(1.2);opacity:0}30%{opacity:1}82%{transform:rotate(var(--r,0deg)) scale(.975)}100%{transform:rotate(var(--r,0deg));opacity:1}}
.pile.closing{animation:closing .6s var(--e-soft) backwards}
@keyframes closing{from{opacity:1;transform:none}to{opacity:.4;transform:scale(.9) translateY(6px)}}
.hand.deal .card{animation:dealIn .6s var(--e-spring) backwards;animation-delay:calc(var(--i,0)*40ms)}
@keyframes dealIn{from{transform:translateY(80px) rotate(-9deg) scale(.88);opacity:0}to{transform:none;opacity:1}}
.status.new{animation:pop .55s var(--e-spring)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.msg.new{animation:msgIn .42s var(--e-out)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.strick .te{animation:tin .46s var(--e-spring) both}
@keyframes tin{from{transform:translateY(34px) scale(.82) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}
.strick .te.win .scard{animation:winp 1.2s var(--e-soft) infinite alternate}
@keyframes winp{from{box-shadow:0 0 0 2px #ffd45a,0 0 8px rgba(255,212,90,.5)}to{box-shadow:0 0 0 3px #ffd45a,0 0 22px rgba(255,212,90,.95);transform:translateY(-3px) scale(1.04)}}
/* Würfel */
.die.roll{animation:droll .5s var(--e-soft) infinite}
@keyframes droll{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(90deg) translateY(-10px) scale(.94)}50%{transform:rotate(180deg) translateY(0) scale(1)}75%{transform:rotate(270deg) translateY(-6px) scale(.96)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
.die:not(.roll){animation:dland .45s var(--e-spring)}
@keyframes dland{from{transform:scale(.9)}to{transform:none}}
.die.held:not(.roll){animation:none}
/* weniger Bewegung bzw. schwache Geräte */
@media (prefers-reduced-motion:reduce){#app.enter>.panel,#app.enter>.nav,details[open]>:not(summary),#modal .box,#modal.out,#modal.out .box,.gpick .gcard,.ov .ovp,.strick .te,.strick .te.win .scard,.die,.die.roll{animation:none!important}#modal.out{opacity:0}}
body.low #app.enter>.panel,body.low #app.enter>.nav,body.low .strick .te.win .scard{animation:none}

<body>
<div id="app"></div>
<div id="chatui"></div>
<div id="toast"></div>
<div id="modal"></div>
<div id="boom" aria-hidden="true"><div class="dim"></div><div class="glow"></div><div class="cen"><div class="halo"></div><div class="ring"></div><div class="ring r2"></div><div class="bomb">💣<i>✨</i></div><div class="bang">💥</div><div id="parts"></div></div><div class="flash"></div><div class="txt"><b>Mi Bombo!</b><span id="boomtxt"></span></div></div>
<script>
//LOGIC-START
// Blatt: bis 5 Spieler 32 Karten (7–A), ab 6 Spielern 52 Karten (2–A)
const RANKS32=['7','8','9','10','B','D','K','A'],RANKS52=['2','3','4','5','6','7','8','9','10','B','D','K','A'];
let RANKS=RANKS32;const SUITS=['♠','♥','♦','♣'];
const rk=c=>c>>2, su=c=>c&3;
const NR=g=>g&&g.deck===52?13:8, ACE=g=>NR(g)-1;
function useDeck(g){RANKS=NR(g)===13?RANKS52:RANKS32}
// Chaos-Modus: Sonderkarten (Joker sind Platzhalter, die anderen sind Aktionskarten)
const JOKER1=100,JOKER2=101,REV=110,SKIP=120,TURN=130,SPECIALS=[100,101,110,120,130];
const isJoker=c=>c===100||c===101,isAction=c=>c===110||c===120||c===130,isSpec=c=>c>=100;
const SPEC_NAME={100:'Joker',101:'Joker',110:'Revolution',120:'Aussetzer',130:'Richtungswechsel'};
const beats=(g,r,pr)=>g.rev?r<pr:r>pr;
function pileRank(g){const nat=g.pile.cards.filter(c=>!isJoker(c));return nat.length?rk(nat[0]):-1}
const B4=n=>Array(n).fill('Bürger');
const ROLES={3:['Präsident','Bauer','Arschloch'],
  4:['Präsident','Vize-Präsident','Vize-Arschloch','Arschloch'],
  5:['Präsident','Vize-Präsident','Bauer','Vize-Arschloch','Arschloch'],
  6:['Präsident','Vize-Präsident',...B4(2),'Vize-Arschloch','Arschloch'],
  7:['Präsident','Vize-Präsident',...B4(3),'Vize-Arschloch','Arschloch'],
  8:['Präsident','Vize-Präsident',...B4(4),'Vize-Arschloch','Arschloch']};
// Team-Modus (nur 4 Spieler): Plaetze 0+2 gegen 1+3
const isTeam=g=>!!g&&R(g).mode==='team'&&!!g.players&&g.players.length===4;
function teamPts(g){const t=[0,0];g.players.forEach((_,s)=>t[s%2]+=(g.ms&&g.ms[s]?g.ms[s].pts:0));return t}
const TEAM_NAME=['Team Blau','Team Rot'];
const clone=o=>JSON.parse(JSON.stringify(o));
const asc=(a,b)=>a-b;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nm(g,s){return g.players[s].name}
function cardsTxt(cs){
  if(cs.length===1&&isAction(cs[0]))return SPEC_NAME[cs[0]];
  const nat=cs.filter(c=>!isJoker(c));
  return (cs.length>1?cs.length+'× ':'')+(nat.length?RANKS[rk(nat[0])]:'Joker')+(nat.length&&nat.length<cs.length?' (mit Joker)':'');
}
function activeSeats(g){return g.players.map((_,i)=>i).filter(i=>g.hands[i].length>0)}
function nextActive(g,from,excl){const n=g.players.length,d=g.dir===-1?-1:1;for(let i=1;i<=n;i++){const s=((from+d*i)%n+n)%n;if(g.hands[s].length&&!(excl&&excl(s)))return s}return -1}
function isFree(g){return !g.pile||g.pile.closed}
const DEFAULT_RULES={turn:20,bombs:true,stock:true,aceRule:true,target:0,solo:true,mode:'classic'};
const MODES=['classic','chaos','team'];
function R(g){return Object.assign({},DEFAULT_RULES,g.rules||{})}

// Neue Partie: Statistik pro Platz zuruecksetzen
function initMs(g){
  const n=g.players.length;g.ms={};
  for(let i=0;i<n;i++)g.ms[i]={pts:0,rounds:0,pl:Array(n).fill(0),aces:0,bombs:0,aceEnd:0,to:0,streak:0,best:0,climbs:0,bob:0};
}
function startMatch(g){initMs(g);g.order=null;g.round=0;g.paused=null;g.final=false;g.match=(g.match|0)+1;g.deck=g.players.length>=6?52:32}
function deal(g){
  useDeck(g);
  const n=g.players.length,base=[...Array(NR(g)*4).keys()];if(R(g).mode==='chaos')base.push(...SPECIALS);
  const deck=shuffle(base);
  g.stock=(n===3||n===5)&&R(g).stock?deck.splice(0,2):[];g.bauer=-1;g.open=[];g.losers=[];g.rev=false;g.dir=1;g.teamRound=-1;
  g.rs={aces:{},bombs:{},aceEnd:{},to:{},streak:{},climb:{},bob:{}};
  const prev=g.order&&g.order.length===n?g.order:null;
  const start=prev?prev[0]:Math.floor(Math.random()*n);
  const hands={},fresh={};
  for(let i=0;i<n;i++){hands[i]=[];fresh[i]=[]}
  deck.forEach((c,i)=>hands[(start+i)%n].push(c));
  for(let i=0;i<n;i++)hands[i].sort(asc);
  g.solo=false;g.prevRoles={};g.hands=hands;g.fresh=fresh;g.pile=null;g.passed=[];g.last=-1;g.finished=[];g.swaps=[];g.wishQ=[];
  g.round=(g.round||0)+1;g.roles={};
  if(prev){
    prev.forEach((s,i)=>g.roles[s]=i);g.prevRoles=Object.assign({},g.roles);
    g.wishQ.push({hi:prev[0],lo:prev[n-1],n:2});
    if(n>=4)g.wishQ.push({hi:prev[1],lo:prev[n-2],n:1});
    if(g.stock.length)g.bauer=prev[(n-1)/2];
    g.phase='wish';g.turn=prev[0];g.starter=prev[n-1];
    g.msg=nm(g,prev[0])+' darf sich 2 Karten wünschen.';
  }else{g.turn=start;g.msg=nm(g,start)+' fängt an.'+(g.stock.length?' 2 Karten bleiben verdeckt liegen.':'');startPlay(g)}
}
function startPlay(g){
  g.phase='play';
  g.players.forEach((_,i)=>{g.rs.aces[i]=g.hands[i].filter(c=>rk(c)===ACE(g)).length});
  g.open=g.players.map((_,i)=>i).filter(i=>g.rs.aces[i]===4);
  if(g.open.length)g.msg+=' '+g.open.map(i=>nm(g,i)).join(' und ')+' hat 4 Asse und muss offen spielen!';
}
function wish(g,seat,ranks){
  useDeck(g);
  const q=g.wishQ.shift(),lo=q.lo,h=g.hands[lo];ranks=ranks.slice(0,q.n);
  // Der Wunsch gilt nur, wenn er komplett erfuellt werden kann – sonst gibt es die besten Karten
  const pool=h.slice(),pick=[];let full=ranks.length>0;
  for(const r of ranks){const k=pool.findIndex(c=>rk(c)===r);if(k<0){full=false;break}pick.push(pool.splice(k,1)[0])}
  const got=full?pick:[];
  g.hands[lo]=full?pool:h;
  while(got.length<q.n)got.push(g.hands[lo].pop());
  g.hands[seat].push(...got);g.hands[seat].sort(asc);g.fresh[seat]=got;
  g.swaps.push({from:seat,to:lo,n:q.n});
  const best=q.n===1?'die beste Karte':'die '+q.n+' besten Karten';
  if(!ranks.length)g.msg=nm(g,seat)+' nimmt '+best+' von '+nm(g,lo)+'.';
  else g.msg=nm(g,seat)+' wünscht sich '+ranks.map(r=>RANKS[r]).join(' und ')+' – '+
    (full?(ranks.length<q.n?'bekommen, dazu die beste Karte.':ranks.length>1?'beide bekommen.':'bekommen.')
      :nm(g,lo)+' hat '+(ranks.length>1?'nicht beide':'sie nicht')+', deshalb gibt es '+best+'.');
  if(g.wishQ.length){g.turn=g.wishQ[0].hi;g.msg+=' Jetzt wünscht sich '+nm(g,g.turn)+' eine Karte.'}
  else{g.phase='swap';g.turn=g.swaps[0].from}
}
function canGive(g,seat,cards){
  if(g.phase!=='swap'||g.turn!==seat||!g.swaps.length)return false;
  return cards.length===g.swaps[0].n&&cards.every(c=>g.hands[seat].includes(c));
}
function give(g,seat,cards){
  const s=g.swaps.shift();
  g.hands[seat]=g.hands[seat].filter(c=>!cards.includes(c));
  g.hands[s.to].push(...cards);g.hands[s.to].sort(asc);g.fresh[s.to]=cards.slice();g.fresh[seat]=[];
  if(g.swaps.length){g.turn=g.swaps[0].from}
  else if(g.bauer>=0&&g.stock&&g.stock.length===2){g.phase='stock';g.turn=g.bauer;g.msg=nm(g,g.bauer)+' darf sich den Stock ansehen.'}
  else{g.turn=g.starter;g.msg='Getauscht. '+nm(g,g.starter)+' kommt raus.';startPlay(g)}
}
function canStock(g,seat,cards){
  return g.phase==='stock'&&g.turn===seat&&cards.length===2&&cards.every(c=>g.hands[seat].includes(c));
}
function takeStock(g,seat,cards){
  if(cards){
    g.hands[seat]=g.hands[seat].filter(c=>!cards.includes(c));
    g.hands[seat].push(...g.stock);g.hands[seat].sort(asc);g.fresh[seat]=g.stock.slice();g.stock=cards.slice();
    g.msg=nm(g,seat)+' nimmt den Stock. ';
  }else g.msg=nm(g,seat)+' lässt den Stock liegen. ';
  g.turn=g.starter;g.msg+=nm(g,g.starter)+' kommt raus.';startPlay(g);
}
function botStock(g,seat){
  const h=g.hands[seat],sum=a=>Math.min(rk(a[0]),20)+Math.min(rk(a[1]),20);
  return sum(g.stock)>sum(h)+2?h.slice(0,2):null;
}
function canPlay(g,seat,cards){
  if(g.phase!=='play'||g.turn!==seat||!cards.length)return false;
  if(!cards.every(c=>g.hands[seat].includes(c))||new Set(cards).size!==cards.length)return false;
  if(cards.some(isAction))return cards.length===1;           // Aktionskarte immer allein
  const nat=cards.filter(c=>!isJoker(c));
  if(cards.length>4||(nat.length&&!nat.every(c=>rk(c)===rk(nat[0]))))return false;
  if(isFree(g))return true;
  const pn=g.pile.cards.length,pr=pileRank(g),r=nat.length?rk(nat[0]):-1;
  if(cards.length===4&&pn!==4&&R(g).bombs&&nat.length)return true;   // Bombe (auch mit Joker)
  if(cards.length!==pn||pr<0)return false;                           // Joker allein schlaegt nur eine Bombe
  if(r<0)return true;                                                 // nur Joker: hoeher als alles
  return beats(g,r,pr);
}
// Aktionskarte ausspielen (Chaos-Modus)
function action(g,seat,c){
  g.hands[seat]=g.hands[seat].filter(x=>x!==c);g.fresh[seat]=[];
  const who=nm(g,seat);let skip=false;
  if(c===REV){g.rev=!g.rev;g.msg=who+' spielt 🔄 Revolution! '+(g.rev?'Jetzt ist die '+RANKS[0]+' die höchste und das Ass die niedrigste Karte.':'Die Rangfolge ist wieder normal.')}
  else if(c===TURN){g.dir=g.dir===-1?1:-1;g.msg=who+' spielt 🔁 Richtungswechsel – es geht andersherum weiter.'}
  else{skip=true;g.msg=who+' spielt ⏭️ Aussetzer!'}
  if(g.solo){g.solo=false;if(g.pile)g.pile.closed=true;g.passed=[]}
  if(!g.hands[seat].length){g.finished.push(seat);g.msg+=' Fertig!'}
  const act=activeSeats(g);if(act.length<=1){if(act.length)g.finished.push(act[0]);endRound(g);return}
  let nx=nextActive(g,seat,s=>g.passed.includes(s));
  if(nx<0||nx===seat){if(g.pile)g.pile.closed=true;g.passed=[];nx=nextActive(g,seat)}
  if(skip){const sk=nx;const n2=nextActive(g,sk,s=>g.passed.includes(s));g.msg+=' '+nm(g,sk)+' muss aussetzen.';if(n2>=0)nx=n2}
  if(nx===g.last&&g.pile&&!g.pile.closed){g.pile.closed=true;g.passed=[]}
  g.turn=nx;if(isFree(g))g.msg+=' '+nm(g,nx)+' kommt raus.';
}
function endRound(g){
  const n=g.players.length;
  g.phase='end';g.order=g.finished.concat(g.losers.slice().reverse());g.roles={};g.order.forEach((s,i)=>g.roles[s]=i);g.turn=-1;
  if(!g.ms)initMs(g);
  const prevRoles=g.prevRoles||{};
  g.order.forEach((s,i)=>{const m=g.ms[s];m.pts+=n-1-i;m.rounds++;m.pl[i]++;
    m.aces+=g.rs.aces[s]||0;m.bombs+=g.rs.bombs[s]||0;m.aceEnd+=g.rs.aceEnd[s]?1:0;m.to+=g.rs.to[s]||0;m.bob=(m.bob||0)+(g.rs.bob[s]||0);
    if(i===0){m.streak=(m.streak||0)+1;m.best=Math.max(m.best||0,m.streak);if(prevRoles[s]===n-1){g.rs.climb[s]=true;m.climbs=(m.climbs||0)+1}}else m.streak=0;
    g.rs.streak[s]=m.streak;
  });
  if(isTeam(g)){const sum=[0,0];g.order.forEach((s,i)=>sum[s%2]+=i);g.teamRound=sum[0]<sum[1]?0:sum[1]<sum[0]?1:-1}
  const t=R(g).target;g.final=!!(t&&(isTeam(g)?teamPts(g).some(p=>p>=t):g.order.some(s=>g.ms[s].pts>=t)));
}
function play(g,seat,cards){
  useDeck(g);
  if(cards.length===1&&isAction(cards[0]))return action(g,seat,cards[0]);
  const natc=cards.filter(c=>!isJoker(c));
  g.hands[seat]=g.hands[seat].filter(c=>!cards.includes(c));
  g.fresh[seat]=[];
  const wasBomb=!isFree(g)&&g.pile.cards.length===4;
  if(isFree(g)){g.passed=[];g.solo=false}
  g.pile={cards:cards.slice().sort(asc),by:seat,closed:false};g.last=seat;
  if(cards.length===4){g.rs.bombs[seat]=(g.rs.bombs[seat]||0)+1;if(wasBomb)g.rs.bob[seat]=(g.rs.bob[seat]||0)+1}
  g.msg=nm(g,seat)+(cards.length===4?' legt eine Bombe: ':' legt ')+cardsTxt(cards)+'.';
  g.losers=g.losers||[];
  if(!g.hands[seat].length){
    if(natc.length&&rk(natc[0])===ACE(g)&&R(g).aceRule){g.losers.push(seat);g.rs.aceEnd[seat]=true;g.msg+=' Mit Ass beendet – verboten! '+nm(g,seat)+' landet automatisch ganz hinten.'}
    else{g.finished.push(seat);g.msg+=' Fertig!'}
  }
  const act=activeSeats(g);
  if(act.length<=1){if(act.length)g.finished.push(act[0]);endRound(g);return}
  const top=cards.length===4&&natc.length&&rk(natc[0])===(g.rev?0:ACE(g)),nx=nextActive(g,seat,s=>g.passed.includes(s));
  if(top||nx<0||nx===seat){
    // Hausregel Weiterlegen: alle anderen haben gepasst -> allein immer hoeher weiterlegen
    if(!top&&g.hands[seat].length&&R(g).solo&&legalMoves(g,seat,true).length){g.solo=true;g.turn=seat;g.msg+=' Alle anderen haben gepasst – '+nm(g,seat)+' darf allein weiterlegen.';return}
    g.pile.closed=true;g.passed=[];g.solo=false;g.turn=g.hands[seat].length?seat:nextActive(g,seat);
    g.msg+=(top?' Höher geht nicht – ':' Alle anderen haben gepasst – ')+nm(g,g.turn)+' kommt raus.';
  }else g.turn=nx;
}
function canPass(g,seat){return g.phase==='play'&&g.turn===seat&&!isFree(g)}
function pass(g,seat){
  g.fresh[seat]=[];
  if(g.solo&&seat===g.last){g.pile.closed=true;g.passed=[];g.solo=false;g.turn=seat;g.msg=nm(g,seat)+' hört auf und kommt neu raus.';return}
  g.passed.push(seat);
  const nx=nextActive(g,seat,s=>g.passed.includes(s));
  if(nx<0||nx===g.last){
    if(g.hands[g.last].length&&R(g).solo&&legalMoves(g,g.last,true).length){g.solo=true;g.turn=g.last;g.msg='Alle passen – '+nm(g,g.last)+' darf allein weiterlegen (immer höher) oder neu rauskommen.';return}
    g.pile.closed=true;g.passed=[];g.solo=false;
    g.turn=g.hands[g.last].length?g.last:nextActive(g,g.last);
    g.msg='Alle passen – '+nm(g,g.turn)+' kommt raus.';
  }else{g.turn=nx;g.msg=nm(g,seat)+' passt und ist für diesen Stich raus.'}
}
function timeoutMove(g){
  const s=g.turn;g.rs.to[s]=(g.rs.to[s]||0)+1;
  if(canPass(g,s))pass(g,s);else play(g,s,[g.hands[s][0]]);
  g.msg='Zeit abgelaufen! '+g.msg;
}
function groupsOf(h){const gr={};h.forEach(c=>{if(!isSpec(c))(gr[rk(c)]=gr[rk(c)]||[]).push(c)});return gr}
// Alle erlaubten Zuege; noAct: ohne Aktionskarten
function legalMoves(g,seat,noAct){
  const h=g.hands[seat],gr=groupsOf(h),J=h.filter(isJoker),A=noAct?[]:h.filter(isAction).map(c=>[c]),out=[];
  if(isFree(g)){
    for(const r in gr){const x=gr[r];for(let k=1;k<=x.length;k++)out.push(x.slice(0,k));for(let j=1;j<=J.length&&x.length+j<=4;j++)out.push(x.concat(J.slice(0,j)))}
    for(let j=1;j<=J.length;j++)out.push(J.slice(0,j));
    return out.concat(A);
  }
  const n=g.pile.cards.length,pr=pileRank(g),bombs=R(g).bombs;
  for(const r in gr){const x=gr[r];
    if(pr>=0&&beats(g,+r,pr)){if(x.length>=n)out.push(x.slice(0,n));else if(x.length+J.length>=n)out.push(x.concat(J.slice(0,n-x.length)))}
    if(bombs&&n!==4&&x.length+J.length>=4&&x.length>=2)out.push(x.slice(0,4).concat(J.slice(0,Math.max(0,4-x.length))));
  }
  if(pr>=0&&n<=J.length)out.push(J.slice(0,n));
  return out.concat(A);
}
function botMoveCore(g,seat){
  const AC=ACE(g),lvl=(g.players[seat]&&g.players[seat].level)||'normal';
  const h=g.hands[seat],gr=groupsOf(h),ranks=Object.keys(gr).map(Number).sort(asc);
  const aceRule=R(g).aceRule,onlyAces=ranks.length===1&&ranks[0]===AC;
  if(lvl==='easy'){
    const all=legalMoves(g,seat);let mv=all;
    if(aceRule&&h.length<=4)mv=mv.filter(m=>!(m.length===h.length&&rk(m[0])===AC));
    if(!mv.length)mv=isFree(g)?all:[];
    if(!mv.length)return null;
    if(!isFree(g)&&Math.random()<.3)return null;

// Rundenende: wer die Wolke in seinen Stichen hat, aendert zuerst seine Ansage um 1

// Wolke: Ansage um +1 oder -1 aendern

// ----- Computergegner -----
function stCardPower(g,c){

}

// Waehlt Karte (+ Zusatz fuer Sonderkarten), die einen Stich gewinnt bzw. verliert

    if(w.length&&(last||lvl!=='hard'||w[0].pow>=.5||Math.random()<.7))return w[0];

function stBotCloud(g,s){const need=g.bids[s]-g.won[s],left=g.hands[s].length;
  // spaeter Stiche erwartet? dann eher hoch, sonst passend zu den schon geholten Stichen

// ===== Kniffel: 5 Würfel, 13 Felder (Regeln wie das bekannte Würfelspiel) =====
const DC_CATS=['c1','c2','c3','c4','c5','c6','k3','k4','fh','ss','ls','kn','ch'];

const DR=g=>Object.assign({},DC_RULES,g.rules||{});
const dcSum=d=>d.reduce((a,x)=>a+x,0);

  if(!d||d.length!==5||d.some(x=>!(x>=1&&x<=6)))return 0;
  const c=dcCounts(d),mx=Math.max(...c);
  if(cat[0]==='c'&&cat!=='ch'){const k=+cat[1];return c[k]*k}
  switch(cat){
    case 'k3':return mx>=3?dcSum(d):0;
    case 'k4':return mx>=4?dcSum(d):0;
    case 'fh':return c.includes(3)&&c.includes(2)?25:0;
    case 'ss':return dcRun(d)>=4?30:0;
    case 'ls':return dcRun(d)>=5?40:0;
    case 'kn':return mx===5?50:0;

  }
  return 0;
}
// Erlaubte Werte beim Eintragen mit echten Wuerfeln
function dcAllowed(cat){
  if(DC_UPPER.includes(cat)){const k=+cat[1];return [0,1,2,3,4,5].map(i=>i*k)}
  if(cat==='k3'||cat==='k4'){const a=[0];const lo=cat==='k3'?5:5;for(let i=lo;i<=30;i++)a.push(i);return a}
  if(cat==='ch'){const a=[];for(let i=5;i<=30;i++)a.push(i);return a}

}

function dcRoll(g,seat){

// Echte Wuerfel: Wert eintragen (null = loeschen)

function dcStandings(g){return g.players.map((p,s)=>({s,name:p.name,pts:dcTotals(g.sheet[s]).total})).sort((a,b)=>b.pts-a.pts)}

}
function dcBotStep(g){

}
function cleanDice(g){
  const I=(x,lo,hi)=>Number.isInteger(x)&&x>=lo&&x<=hi,S=(x,k)=>typeof x==='string'?x.slice(0,k):typeof x==='number'&&isFinite(x)?String(x):'';

//CABO-START
// ===== Cabo: Gedächtnis-Kartenspiel – möglichst wenige Punkte vor sich liegen haben =====
// Zwei Varianten:
//  'haus' (Standard): echtes Kartenspiel, 52 Karten + 2 Joker. Karten-Code 0–51 = Farbe*13+(Rang-1), Farben ♠♥♦♣; 52/53 = Joker.
//     Punkte: Joker −1, Ass 1, 2–10 Nennwert, Bube/Dame/schwarzer König 10, roter König 0.
//     Aktionen (vom Stapel gezogen und abgeworfen): 7 eine Karte anschauen · 8 blind tauschen · 9 anschauen und dann entscheiden, ob getauscht wird.

const CB_RULES={bots:'normal',help:false,mode:'haus'};

function cbStart(g){

// Startblick: zwei eigene Karten anschauen
function cbPeekStart(g,s,a,b){

const cbFx=(g,k,s,i,t)=>{g.fx={k,s,i,t:t||null,id:((g.fx&&g.fx.id)||0)+1}};
function cbDraw(g,s){

}
function cbTake(g,s){

}
function cbCabo(g,s){

  g.caboBy=s;g.msg='📣 '+nm(g,s)+' ruft CABO! Alle anderen haben noch einen Zug.';cbFx(g,'cabo',s,[]);cbNext(g);return true;

// Gezogene Karte gegen eine oder mehrere eigene Karten (gleichen Rangs) tauschen
function cbSwap(g,s,idx){

// Gezogene Karte abwerfen (nur vom Stapel); Aktionskarten erlauben dann eine Aktion
function cbDiscard(g,s){

function cbSkip(g,s){if(g.phase!=='act'||g.turn!==s)return false;

// Aktion ausführen.
// Original: peek(i) / spy(t,j) / swap(i,t,j).  Hausregeln: look(i) oder look(-1,t,j) / blind(i,t,j) / peekswap(i,t,j) → danach cbDecide(ja/nein)

    if(t!=null&&t>=0){if(!oppOk(t,j))return false;g.lines[t][j].kb|=cbBit(s);g.msg=nm(g,s)+' schaut sich eine Karte von '+nm(g,t)+' an.';cbFx(g,'spy',t,[j],[s])}

// 9er: nach dem Anschauen entscheiden, ob getauscht wird
function cbDecide(g,s,yes){
  if(g.phase!=='act'||g.turn!==s||!g.act||g.act.k!=='peekswap'||!g.act.sel)return false;
  if(!yes)return cbSkip(g,s);

// Dazwischen werfen (nur Hausregeln): jederzeit eine eigene Karte mit gleichem Rang wie die oberste Ablagekarte abwerfen.
// Passt sie nicht, wird sie aufgedeckt, bleibt liegen und es gibt eine Strafkarte.
function cbCanThrow(g,s){return cbH(g)&&(g.phase==='play'||g.phase==='act')&&!!g.lines[s]&&g.lines[s].length>0&&g.disc.length>0&&s!==g.caboBy}

  }else{
    c.up=true;
    if(g.deck.length&&L.length<CB_MAXL)L.push({v:g.deck.pop(),up:false,kb:0});

}
function cbNext(g){

}
// Rundenende und Wertung
function cbEndRound(g,why){
  const n=g.players.length,sums=g.lines.map(l=>cbSum(g,l)),kami=g.lines.findIndex(l=>cbKami(g,l)),sc=Array(n).fill(0);
  let note='';
  if(kami>=0){for(let s=0;s<n;s++)sc[s]=s===kami?0:50;note='💥 Kamikaze von '+nm(g,kami)+'! Alle anderen bekommen 50 Punkte.'}
  else{
    const mn=Math.min(...sums),cb=g.caboBy;
    if(cb>=0&&sums[cb]===mn){for(let s=0;s<n;s++)sc[s]=s===cb?0:sums[s];note='📣 '+nm(g,cb)+' hat mit CABO richtig gelegen.'}
    else{for(let s=0;s<n;s++)sc[s]=sums[s]===mn?0:sums[s];if(cb>=0){sc[cb]=sums[cb]+10;note='📣 '+nm(g,cb)+' hat sich mit CABO verschätzt: +10 Strafpunkte.'}
      else note=why==='deck'?'Der Stapel ist leer – die Runde endet.':''}
  }
  const resetNow=[];
  for(let s=0;s<n;s++){g.totals[s]+=sc[s];if(g.totals[s]===100&&!g.reset[s]){g.totals[s]=50;g.reset[s]=true;resetNow.push(s)}}
  if(resetNow.length)note+=(note?' ':'')+resetNow.map(s=>nm(g,s)).join(', ')+' hatte genau 100 – zurück auf 50!';
  g.hist.push({sums,sc,caboBy:g.caboBy,kami});
  g.lines.forEach(l=>l.forEach(c=>{c.up=true}));

  g.msg=note||'Runde vorbei.';

  const mn=Math.min(...sc);let st=g.starter;for(let k=0;k<n;k++){const s=(g.starter+k)%n;if(sc[s]===mn){st=s;break}}g.starter=st;

function cbNextRound(g){if(g.phase!=='rend')return false;cbDeal(g);return true}
function cbStandings(g){const last=g.hist.length?g.hist[g.hist.length-1].sc:g.players.map(()=>0);
  return g.players.map((p,s)=>({s,t:g.totals[s],l:last[s]})).sort((a,b)=>a.t-b.t||a.l-b.l)}
function cbPlaces(g){const st=cbStandings(g),pl=Array(g.players.length).fill(0);

// ----- Computergegner mit Gedächtnis -----
function cbEst(g,s){const L=g.lines[s];let sum=0,unk=0;L.forEach(c=>{if(cbKnows(c,s))sum+=cbPts(g,c.v);else unk++});return {sum,unk,est:sum+unk*(cbH(g)?5.9:6.5)}}
// Welcher Computer würde jetzt dazwischen werfen? → [Sitz, Karte] oder null
function cbBotThrow(g){
  if(!cbH(g)||!(g.phase==='play'||g.phase==='act')||!g.disc.length)return null;
  const lv=CR(g).bots,top=cbRank(g,g.disc[g.disc.length-1]),sel=g.act&&g.act.sel;
  for(let s=0;s<g.players.length;s++){

    const L=g.lines[s];
    for(let i=0;i<L.length;i++){
      if(sel&&((s===g.turn&&i===sel.i)||(s===sel.t&&i===sel.j)))continue;
      const c=L[i];if(!cbKnows(c,s)||cbRank(g,c.v)!==top)continue;

function cbBotStep(g){

  const th=cbBotThrow(g);if(th)return cbThrow(g,th[0],th[1]);

  const L=g.lines[s],know=i=>cbKnows(L[i],s),P=c=>cbPts(g,c.v);

      if(lv==='easy')return cbSkip(g,s);const ch=[];opp.forEach(t=>g.lines[t].forEach((c,j)=>{if(!cbKnows(c,s))ch.push([t,j])}));
      if(!ch.length)return cbSkip(g,s);const [t,j]=ch[Math.floor(Math.random()*ch.length)];return cbDoAct(g,s,-1,t,j)}
    if(k==='swap'||k==='blind'){

      let best=null;opp.forEach(t=>{if(t===g.caboBy)return;g.lines[t].forEach((c,j)=>{if(cbKnows(c,s)&&(!best||P(c)<best.v))best={t,j,v:P(c)}})});
      if(hi>=0&&best&&P(L[hi])-best.v>=3)return cbDoAct(g,s,hi,best.t,best.j);
      if(lv!=='easy'&&hi>=0&&P(L[hi])>=10){const ts=opp.filter(t=>t!==g.caboBy&&g.lines[t].length);if(ts.length){const t=ts[Math.floor(Math.random()*ts.length)];return cbDoAct(g,s,hi,t,Math.floor(Math.random()*g.lines[t].length))}}

      let best=null;ts.forEach(t=>g.lines[t].forEach((c,j)=>{if(cbKnows(c,s)&&(!best||P(c)<best.v))best={t,j,v:P(c)}}));

const pileKey=g=>g&&g.pile?g.pile.cards.join('-')+'@'+g.round:'';

/* ---------- Sprachnachrichten ---------- */
let REC=null,vPlaying=null;const VCACHE={};
const fmtS=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const vSecs=p=>+((/_(\d+)\./.exec(String(p))||[])[1]||0);
function musicBack(){if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.6,AC.currentTime,.3)}
function recMime(){const M=window.MediaRecorder;if(!M)return null;
  for(const t of ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])if(M.isTypeSupported&&M.isTypeSupported(t))return t;return ''}
async function micStart(){
  if(REC||!code||!store.online)return;
  const mt=recMime();
  if(mt===null||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Dein Browser kann keine Sprachnachrichten aufnehmen.');return}
  let stream;
  try{if(vPlaying)voiceStop();audioSession('play-and-record');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){audioSession('auto');toast('Ohne Mikrofon-Erlaubnis geht das nicht – erlaube das Mikrofon für diese Seite bzw. App.');return}
  let rec;try{rec=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:32000},mt?{mimeType:mt}:{}))}catch(e){rec=new MediaRecorder(stream)}
  REC={rec,stream,chunks:[],t0:Date.now(),cancel:false,code};
  rec.ondataavailable=e=>{if(e.data&&e.data.size&&REC)REC.chunks.push(e.data)};
  rec.onstop=()=>micDone();rec.start(250);
  if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.06,AC.currentTime,.1);
  REC.timer=setInterval(()=>{if(!REC)return;const s=(Date.now()-REC.t0)/1000;if(s>=30)micStop(false);else{const el=$('#rect');if(el)el.textContent=fmtS(s)}},250);
  renderChat();
}
function micStop(cancel){if(!REC)return;REC.cancel=cancel;clearInterval(REC.timer);try{if(REC.rec.state!=='inactive')REC.rec.stop();else micDone()}catch(e){micDone()}}
async function micDone(){
  const R=REC;REC=null;if(!R)return;
  try{R.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  audioSession('auto');musicBack();renderChat();
  if(R.cancel)return;
  const secs=Math.min(30,Math.round((Date.now()-R.t0)/1000));
  if(secs<1){toast('Zu kurz – tippe auf 🎤, sprich und dann auf Senden.');return}
  const type=String(R.rec.mimeType||(R.chunks[0]&&R.chunks[0].type)||'audio/webm').split(';')[0];
  const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
  const blob=new Blob(R.chunks,{type});
  if(blob.size>480000){toast('Die Sprachnachricht ist zu groß.');return}
  const path=R.code+'/'+crypto.randomUUID()+'_'+secs+'.'+ext;
  try{
    const up=await store.sb.storage.from('voice').upload(path,blob,{contentType:type,upsert:false});if(up.error)throw up.error;
    VBLOB[path]=blob;VCACHE[path]=URL.createObjectURL(blob);
    await store.sendChat(R.code,'voice',path);
  }catch(e){console.warn(e);toast(/slow down/.test(String(e&&e.message))?'Zu viele Sprachnachrichten – warte kurz.':'Sprachnachricht ging nicht raus.')}
}
// Abspielen ueber das (beim Antippen schon entsperrte) Web-Audio – geht ohne Autoplay-Sperre und laeuft neben Musik/Radio
const VBLOB={},VBUF={};let vSrc=null,vEl=null,radioVol0=null;
function audioSession(t){try{if(navigator.audioSession)navigator.audioSession.type=t}catch(e){}}
function duckAll(on){
  if(AC&&MUSG)MUSG.gain.setTargetAtTime(on?SET.musVol*.08:SET.musVol*.6,AC.currentTime,.15);
  const r=RADIO&&RADIO.el;if(r){if(on){if(radioVol0==null)radioVol0=r.volume;r.volume=Math.min(r.volume,.12)}else if(radioVol0!=null){r.volume=radioVol0;radioVol0=null}}
}
function voiceStop(){const s=vSrc,e=vEl;vSrc=null;vEl=null;vPlaying=null;try{s&&s.stop()}catch(x){}try{e&&e.pause()}catch(x){}duckAll(false);audioSession('auto');renderChat()}
const decodeA=(a,ab)=>new Promise((res,rej)=>{try{const p=a.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)}catch(e){rej(e)}});
async function vplay(path){
  if(!store||!store.online||!/^[A-Z]{4}\/[0-9a-f-]{36}_[0-9]{1,2}\.(webm|m4a|ogg)$/.test(String(path)))return;
  const a=ac();// noch im Antippen: Audio entsperren
  if(vPlaying){const was=vPlaying;voiceStop();if(was===path)return}
  vPlaying=path;audioSession('playback');duckAll(true);renderChat();
  try{
    let blob=VBLOB[path];
    if(!blob){const {data,error}=await store.sb.storage.from('voice').download(path);if(error)throw error;blob=VBLOB[path]=data}
    if(vPlaying!==path)return;
    let buf=VBUF[path];
    if(!buf&&a){try{buf=VBUF[path]=await decodeA(a,await blob.arrayBuffer())}catch(e){buf=null}}
    if(vPlaying!==path)return;
    if(buf&&a){
      if(a.state!=='running')try{await a.resume()}catch(e){}
      const src=a.createBufferSource(),g=a.createGain(),cp=a.createDynamicsCompressor();
      src.buffer=buf;g.gain.value=1.8;cp.threshold.value=-12;cp.ratio.value=6;
      src.connect(g).connect(cp).connect(a.destination);src.onended=()=>{if(vSrc===src)voiceStop()};vSrc=src;src.start();return;
    }
    // Ersatz: normales Audio-Element
    const el=new Audio(VCACHE[path]||(VCACHE[path]=URL.createObjectURL(blob)));el.volume=1;vEl=el;
    el.onended=()=>{if(vEl===el)voiceStop()};await el.play();
  }catch(e){console.warn(e);if(vPlaying===path)voiceStop();toast('Sprachnachricht konnte nicht abgespielt werden.')}
}

function mkey(n){if(n.nodeType!==1)return null;const k=n.getAttribute('data-key');if(k)return 'k'+k;if(n.id)return '#'+n.id;
  const a=n.getAttribute('data-a'),v=n.getAttribute('data-v');return a&&v!=null?a+':'+v:null}
function mattrs(o,n){
  for(const at of [...o.attributes])if(!n.hasAttribute(at.name)&&!(at.name==='open'&&o.tagName==='DETAILS'))o.removeAttribute(at.name);
  for(const at of n.attributes)if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
  if((o.tagName==='INPUT'||o.tagName==='TEXTAREA')&&o!==document.activeElement){
    const v=n.getAttribute('value')||'';if(o.value!==v&&o.type!=='file')o.value=v;
    if(o.type==='checkbox'||o.type==='radio')o.checked=n.hasAttribute('checked');}
}
function msame(o,n){return o.nodeType===n.nodeType&&o.nodeName===n.nodeName&&mkey(o)===mkey(n)}
function mnode(o,n){
  if(o.nodeType===3||o.nodeType===8){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;return o}
  if(LIVE.has(o.id))return o;
  // Elemente mit Start-Animation neu erzeugen, wenn sie neu dazukommen oder sich der Inhalt aendert
  const nc=n.getAttribute('class')||'';
  if(TRIG.test(nc)&&(nc!==(o.getAttribute('class')||'')||o.textContent!==n.textContent)){o.replaceWith(n);return n}
  mattrs(o,n);mkids(o,n);return o;
}
function mkids(op,np){
  const olds=[...op.childNodes],keyed=new Map();
  for(const c of olds){const k=mkey(c);if(k){if(!keyed.has(k))keyed.set(k,[]);keyed.get(k).push(c)}}
  const used=new Set();let p=0;const news=[...np.childNodes];
  news.forEach((n,i)=>{
    let o=null;const k=mkey(n);
    if(k){const l=keyed.get(k);while(l&&l.length){const c=l.shift();if(!used.has(c)&&c.nodeName===n.nodeName){o=c;break}}}
    else{while(p<olds.length&&(used.has(olds[p])||mkey(olds[p])))p++;if(p<olds.length&&msame(olds[p],n))o=olds[p++]}
    let r;if(o){used.add(o);r=mnode(o,n)}else r=n;
    const at=op.childNodes[i];if(at!==r)op.insertBefore(r,at||null);
  });
  for(const c of olds)if(!used.has(c)&&c.parentNode===op)c.remove();
}

function ctrlSeat(){

}
function onGameOther(g,prev){
  const k=gameOf(g);if(k==='stich')setTimeout(stLockCheck,0);
  if(k==='stich'&&prev&&prev.trick&&g.trick){
    if(g.trick.length>prev.trick.length)sfx('card');

  }

  if(k==='dice'&&prev&&g.rollId!==prev.rollId){sfx('deal');diceAnim=Date.now()+650;setTimeout(render,680)}
  if(k==='cabo'&&prev&&g.fx&&(!prev.fx||g.fx.id!==prev.fx.id)){const f=g.fx.k;if(f==='cabo'){cbAnnounce(nm(g,g.fx.s));sfx('turn')}else if(f==='swap'||f==='xswap')sfx('deal');else if(f==='miss'||f==='tmiss')sfx('lose');else sfx('card');setTimeout(render,1600)}

  if(k==='cabo'&&prev&&g.round!==prev.round){sfx('deal');cbSel.clear();cbOpp=null;cbShow=null;cbThrowMode=false}
  if(k==='p10'&&prev){if(g.round!==prev.round){sfx('deal');p10Sel.clear();p10Stage=[]}else if(g.fx&&(!prev.fx||g.fx.id!==prev.fx.id)){const f=g.fx.k;if(f==='lay')sfx('win');else if(f==='skip'){sfx('lose');if(g.fx.x===mySeatOf(g))toast('⏭ Du musst einmal aussetzen!')}else if(f==='hit')sfx('deal');else sfx('card')}
    const ms=mySeatOf(g);if(ms>=0&&g.hands[ms])[...p10Sel].forEach(c=>{if(!g.hands[ms].includes(c))p10Sel.delete(c)});if(ms>=0&&g.hands[ms])p10Stage=p10Stage.map(x=>x.filter(c=>g.hands[ms].includes(c))).filter(x=>x.length)}
  if(k==='qwixx'&&prev&&g.rollId!==prev.rollId){sfx('deal');diceAnim=Date.now()+650;setTimeout(render,680)}
  if(k==='qwixx'&&prev&&g.fx&&(!prev.fx||g.fx.id!==prev.fx.id)&&g.locked.some((x,r)=>x>=0&&prev.locked[r]<0))sfx('win');
  const cs=(()=>{const t=G;G=g;const r=ctrlSeat();G=t;return r})();
  if(prev&&g.v!==prev.v&&g.turn!==prev.turn&&cs>=0&&g.turn===cs&&!g.local)setTimeout(()=>sfx('turn'),250);
  if(g.phase==='over'&&(!prev||prev.phase!=='over')){const ms=mySeatOf(g),pl=k==='stich'?stPlaces(g):k==='cabo'?cbPlaces(g):k==='p10'?p10Places(g):k==='qwixx'?qxPlaces(g):dcPlaces(g);if(ms>=0&&g.players.length>1)setTimeout(()=>sfx(pl[ms]===0?'win':'mid'),400)}
  if(g.phase==='over'&&!g.local&&store.online&&seen.recG!==code+':'+g.match){seen.recG=code+':'+g.match;const c=code;setTimeout(()=>store.rpc&&store.rpc('record_game',{p_code:c}).then(()=>setTimeout(loadGS,800)).catch(()=>{}),1200)}
  G=g;clearTimeout(loadTimer);stale=false;render();maybeBot();

// Computergegner fuer die neuen Spiele (der Host bzw. das Tisch-Handy zieht fuer sie)
function otherBot(){
  if(!G||botTimer||G.paused||!otherRunning())return;
  const k=gameOf(G),isHost=G.host===myId||G.local,me_=mySeat();
  if(!isHost&&me_<0)return;
  const need=k==='p10'?!!(G.phase==='play'&&G.players[G.turn]&&G.players[G.turn].bot):k==='qwixx'?(G.phase==='roll'?!!G.players[G.active].bot:G.phase==='white'?G.players.some((p,s)=>p.bot&&G.wc[s]==null):G.phase==='color'?!!G.players[G.active].bot:false):k==='cabo'?(G.phase==='peek'?G.players.some((p,s)=>p.bot&&!G.ready[s]):!!(G.players[G.turn]&&G.players[G.turn].bot)||!!cbBotThrow(G)):k==='stich'?(G.phase==='juggle'?G.players.some((p,s)=>p.bot&&G.jPick&&G.jPick[s]==null):!!(G.players[G.turn]&&G.players[G.turn].bot)):(DR(G).mode==='roll'&&G.players[G.turn]&&G.players[G.turn].bot);
  if(!need)return;
  const v=G.v,delay=(k==='dice'?750:950)+(trickHold>Date.now()?trickHold-Date.now():0)+(isHost?0:7000+Math.max(0,me_)*1500);
  botTimer=setTimeout(()=>{botTimer=null;if(!G||G.paused)return;if(G.v!==v){maybeBot();return}if(busy){setTimeout(maybeBot,300);return}
    const g=clone(G);const ok=k==='stich'?stBotStep(g):k==='cabo'?cbBotStep(g):k==='p10'?p10BotStep(g):k==='qwixx'?qxBotStep(g):dcBotStep(g);if(ok)commit(g)},delay);
}
function othersTotal(){return G.local?(G.names||[]).length+(G.bots||0):Math.min(lobby.length,8)+(G.bots||0)}

// ----- Aktionen -----
function otherAct(a,v,el,g,s){
  const k=gameOf(G),host=G.host===myId||G.local,info=GAMES[k];
  if(k==='cabo'&&a.startsWith('cb-'))return cbAct(a,v);
  if(k==='p10'&&a.startsWith('p10-'))return p10Act(a,v);
  if(k==='qwixx'&&a.startsWith('qx-'))return qxAct(a,v);
  switch(a){
    case 'rule':{if(!host||G.phase!=='lobby')return true;const key=el.dataset.k;g.rules=Object.assign({},k==='stich'?ST_RULES:k==='cabo'?CB_RULES:k==='p10'?P10_RULES:k==='qwixx'?QX_RULES:DC_RULES,g.rules||{});
      g.rules[key]=v==='true'?true:v==='false'?false:v;if(k==='dice'&&key==='mode'&&v==='real')g.bots=0;commit(g);return true}
    case 'bot+':if(host&&othersTotal()<info.max&&!(k==='dice'&&DR(G).mode==='real')){g.bots=(g.bots||0)+1;commit(g)}return true;
    case 'bot-':if(host&&g.bots>0){g.bots--;commit(g)}return true;
    case 'botlvl':return true;
    case 'ln-add':{const nmv=(drafts.ln||'').trim().slice(0,16);if(!nmv||!G.local)return true;g.names=(g.names||[]).concat([nmv]).slice(0,8);drafts.ln='';commit(g);return true}
    case 'ln-del':if(G.local){g.names=(g.names||[]).filter((_,i)=>i!==+v);commit(g)}return true;
    case 'start':{if(!host)return true;const t=othersTotal();if(t<info.min||t>info.max)return true;
      const pl=G.local?(G.names||[]).map((x,i)=>({id:'L'+i,name:x,bot:false})):lobby.slice(0,8).map(p=>({id:p.id,name:String(p.name||'Spieler').slice(0,16),bot:false}));
      for(let i=0;i<(g.bots||0);i++)pl.push({id:'bot'+i,name:BOTS[i],bot:true});
      g.players=pl;if(k==='stich')stStart(g);else if(k==='cabo')cbStart(g);else if(k==='p10'){p10Start(g);p10Sel.clear();p10Stage=[]}else if(k==='qwixx')qxStart(g);else dcStart(g);cbSel.clear();cbOpp=null;commit(g);return true}
    case 'newmatch':if(G.phase==='over'&&(s>=0||G.local)){if(k==='stich')stStart(g);else if(k==='cabo')cbStart(g);else if(k==='p10')p10Start(g);else if(k==='qwixx')qxStart(g);else dcStart(g);commit(g)}return true;
    case 'next':if(G.phase==='rend'&&(s>=0||G.local)&&Date.now()-(seen.endAt||0)>=2500){if(k==='stich'){stNext(g);commit(g)}else if(k==='cabo'&&cbNextRound(g)){cbSel.clear();cbOpp=null;cbShow=null;commit(g)}else if(k==='p10'&&p10NextHand(g)){p10Sel.clear();p10Stage=[];commit(g)}}return true;
    case 'lv-end':closeModal();if(s>=0||G.local){g.phase='over';g.paused=null;g.turn=-1;if(k==='stich'&&G.phase!=='rend'&&G.phase!=='over'){/* Runde abbrechen */}commit(g)}return true;
    // Wizard
    case 'st-trump':{const c=ctrlSeat();if(stSetTrump(g,c,+v))commit(g);return true}
    case 'st-bid':{const c=ctrlSeat();if(stBid(g,c,+v))commit(g);return true}
    case 'st-sel':{if(G.phase!=='play'&&G.phase!=='juggle')return true;const c=+v;if(stLock){stLock=null}sel.has(c)?sel.clear():(sel.clear(),sel.add(c));render();return true}
    case 'st-play':{const c=ctrlSeat(),card=[...sel][0];if(card==null)return true;if(trickHold>Date.now())return true;
      if(card===SHIFT){openModal('<h2>🎭 Gestaltwandler</h2><p class="note">Als was spielst du ihn?</p><div class="row"><button data-a="st-as" data-v="Z">🧙 Zauberer</button><button class="ghost" data-a="st-as" data-v="N">🤡 Narr</button></div>');return true}
      if(card===JUGGLER||card===CLOUD){openModal('<h2>'+(card===JUGGLER?'🤹 Jongleur (7½)':'☁️ Wolke (9¾)')+'</h2><p class="note">Welche Farbe soll die Karte haben?</p><div class="suitpick">'+ST_SUITS.map((x,i)=>'<button class="sp'+i+'" data-a="st-as" data-v="'+i+'">'+x+(i===G.trump?' (Trumpf)':'')+'</button>').join('')+'</div>');return true}

      stLock={c:card};sfx('msg');render();return true}
    case 'st-lockas':{closeModal();const card=[...sel][0];if(card==null||!stCanLock())return true;stLock={c:card,as:card===SHIFT?v:+v};sfx('msg');render();return true}
    case 'st-unlock':stLock=null;render();return true;
    case 'st-cloud':{const c=G.local?G.cloudBy:mySeat();if(stCloud(g,c,+v))commit(g);return true}
    case 'st-jug':{const card=[...sel][0];if(card==null)return true;let c=mySeat();
      if(G.local){c=G.players.findIndex((p,i)=>!p.bot&&G.jPick&&G.jPick[i]==null)}
      if(stJugglePick(g,c,card)){sel.clear();commit(g)}return true}
    case 'st-block':openModal('<h2>📒 Block</h2>'+stBlock(G)+'<button class="ghost" data-a="modal-x" style="margin-top:10px">Schließen</button>');return true;

    case 'dc-roll':{askMotion();const c=ctrlSeat();if(dcRoll(g,c))commit(g);return true}
    case 'dc-hold':{const c=ctrlSeat();if(dcHold(g,c,+v))commit(g);return true}
    case 'dc-score':{const c=ctrlSeat();if(dcScore(g,c,v))commit(g);return true}
    case 'dc-cell':{const [t,cat]=String(v).split(':');const tt=+t;if(DR(G).mode!=='real'||G.phase!=='play')return true;if(!G.local&&tt!==mySeat())return true;
      const cur=G.sheet[tt]&&G.sheet[tt][cat];
      openModal('<h2>'+esc(DC_NAME[cat])+'</h2><p class="note">'+esc(G.players[tt].name)+' · '+esc(DC_HINT[cat])+'</p><div class="vpick">'+dcAllowed(cat).map(x=>'<button class="'+(x===cur?'on':'')+'" data-a="dc-set" data-v="'+tt+':'+cat+':'+x+'">'+(x===0?'0 ✗':x)+'</button>').join('')+'</div>'+
        (cur!=null?'<button class="ghost" data-a="dc-set" data-v="'+tt+':'+cat+':x" style="margin-top:10px">Eintrag löschen</button>':'')+'<button class="ghost" data-a="modal-x" style="margin-top:10px">Abbrechen</button>');return true}
    case 'dc-set':{closeModal();const [t,cat,x]=String(v).split(':');const c=G.local?+t:mySeat();if(dcSet(g,c,+t,cat,x==='x'?null:+x))commit(g);return true}
  }
  return false;
}

function drawStich(app,top){

  const holdEnd=(G.phase==='rend'||G.phase==='over')&&G.lastTrick&&trickHold>Date.now();

      ((me_>=0||G.local||mySeat()>=0)?'<button data-a="next" '+(cd>0?'disabled':'')+'>Nächste Runde'+(cd>0?' ('+cd+')':'')+'</button>':'<p class="note" style="text-align:center">Gleich geht es weiter …</p>'));

  let opps='';

    opps+='<div class="opp'+(G.turn===s&&!G.paused?' turn':'')+'" data-s="'+s+'" data-a="pinfo" data-v="'+s+'"><div class="n">'+(p.bot?avOf(p.id,p.name,true):avOf(p.id,p.name,false))+(s===G.dealer?'<span title="Geber">🎴</span>':'')+esc(p.name)+'</div>'+

      '<div class="c">'+G.hands[s].length+' Karten · '+G.scores[s]+' P</div>'+(blind&&G.hands[s].length?'<div class="ocard">'+G.hands[s].map(c=>stCardHtml(c,'mini')).join('')+'</div>':'')+'</div>'}
  const showLast=!G.trick.length&&G.lastTrick&&trickHold>Date.now();

function dieHtml(v,cls,attrs){return '<div class="die'+(cls?' '+cls:'')+'" '+(attrs||'')+'>'+[...Array(9).keys()].map(i=>'<i class="'+(PIPS[v]&&PIPS[v].includes(i)?'p':'')+'"></i>').join('')+'</div>'}

      '<div class="dice">'+(G.rolls>0?dice:'<span class="note">Noch nicht gewürfelt</span>')+'</div>'+

        (G.rolls>0?'<p class="note" style="margin:8px 0 0;text-align:center">'+(G.rolls<3?'Tippe Würfel an, um sie festzuhalten. ':'')+'Trag deinen Wurf unten in ein Feld ein.</p>':'')+shakeHint():'')+'</div>';
  }else area='<div class="panel"><p class="note" style="margin:0">🎲 Würfelt mit echten Würfeln. '+(G.local?'Tippt in die Spalte des Spielers, um seine Punkte einzutragen.':'Tippe in deine Spalte, um deine Punkte einzutragen.')+'</p></div>';

const ST_RULES_TXT='<details><summary>Regeln Wizard</summary>Runde 1 spielt ihr blind („Hellsehen“): Jeder sieht die Karten der anderen, aber nicht die eigene – ausschaltbar in der Lobby. Jede Runde bekommt jeder eine Karte mehr (Runde 1: 1 Karte). Die oberste Karte des Rests bestimmt den Trumpf: Zahl = deren Farbe, Narr = kein Trumpf, Zauberer = der Geber wählt. In der letzten Runde ohne Rest gibt es keinen Trumpf.<br><br>Dann sagt jeder an, wie viele Stiche er holt. Farbe muss bedient werden; Zauberer, Narren und Sonderkarten dürfen immer gespielt werden. Der erste Zauberer gewinnt den Stich, sonst der höchste Trumpf, sonst die höchste Karte der ausgespielten Farbe. Narren verlieren immer (liegen nur Narren, gewinnt der erste).<br><br><b>Punkte:</b> Ansage genau getroffen: 20 + 10 pro Stich. Sonst −10 pro Stich Abweichung.<br><br><b>Sonderkarten (Spezial):</b> 🎭 Gestaltwandler – als Zauberer oder Narr spielbar. 🐉 Drache – schlägt alles, auch Zauberer, nur nicht die Fee. 🧚 Fee – die niedrigste Karte, schlägt aber den Drachen. Wer mit Fee oder Bombe eröffnet, spielt wie mit einem Narren: Die erste Farbkarte danach muss bedient werden. Liegt die Fee als Trumpfkarte, gibt es keinen Trumpf. 💣 Bombe – der Stich zählt für niemanden, wer ihn bekommen hätte, spielt aus. Als Trumpfkarte: kein Trumpf. 🐺 Werwolf – wer ihn bekommt, tauscht ihn vor den Ansagen gegen die Trumpfkarte und bestimmt den Trumpf. 🤹 Jongleur (7½) – Farbe frei wählbar; nach dem Stich gibt jeder gleichzeitig eine Karte nach links weiter (nicht beim letzten Stich der Runde). ☁️ Wolke (9¾) – Farbe frei wählbar; wer den Stich mit der Wolke gewinnt, ändert sofort seine Ansage um +1 oder −1 (nicht, wenn auch die Bombe im Stich lag). Gestaltwandler, Drache, Werwolf, Jongleur oder Wolke als Trumpfkarte: Der Geber bestimmt den Trumpf.</details>';
const DC_RULES_TXT='<details><summary>Regeln Kniffel</summary>Jeder hat pro Zug bis zu 3 Würfe mit 5 Würfeln. Nach jedem Wurf kannst du Würfel festhalten. Danach trägst du das Ergebnis in ein freies Feld ein – passt nichts, streichst du ein Feld (0 Punkte).<br><br><b>Oben:</b> Einser bis Sechser zählen die Augen der jeweiligen Zahl. Ab 63 Punkten oben gibt es 35 Bonuspunkte.<br><b>Unten:</b> Dreierpasch und Viererpasch (Summe aller Augen), Full House (25), Kleine Straße (4 in Folge, 30), Große Straße (5 in Folge, 40), Kniffel (50), Chance (Summe aller Augen).<br><br>Nach 13 Runden gewinnt, wer die meisten Punkte hat. Mit echten Würfeln würfelt ihr am Tisch und tragt nur die Punkte ein.</details>';

let shakeLast=0,motionAsked=false;
const motionNeedsAsk=()=>!!(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function');
let motionOk=!motionNeedsAsk();
function askMotion(){if(motionOk||motionAsked||!motionNeedsAsk())return;motionAsked=true;
  try{DeviceMotionEvent.requestPermission().then(r=>{motionOk=r==='granted';render()}).catch(()=>{})}catch(e){}}
function shakeHint(){if(!SET.shake||!('ontouchstart' in window)||!window.DeviceMotionEvent||!G||G.rolls>=3)return '';
  return '<p class="note shk">📳 '+(motionOk?'Oder einfach das Handy schütteln':'Nach dem ersten Tippen kannst du auch schütteln')+'</p>'}
function canShakeRoll(){if(!SET.shake||!G||gameOf(G)!=='dice'||G.phase!=='play'||G.paused||DR(G).mode!=='roll'||modalOpen||document.hidden)return false;
  const c=ctrlSeat();return c>=0&&G.turn===c&&!(G.players[c]&&G.players[c].bot)&&G.rolls<3&&!(G.rolls>0&&G.held.every(Boolean))}
window.addEventListener('devicemotion',e=>{const a=e.acceleration&&e.acceleration.x!=null?e.acceleration:null,g=e.accelerationIncludingGravity;
  let m;if(a)m=Math.hypot(a.x||0,a.y||0,a.z||0);else if(g&&g.x!=null)m=Math.abs(Math.hypot(g.x||0,g.y||0,g.z||0)-9.81);else return;
  if(m<15)return;const now=Date.now();if(now-shakeLast<1400||!canShakeRoll())return;shakeLast=now;
  if(SET.vib)try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}act('dc-roll')});

// ----- Wizard: Karte vorab einloggen (wie bei Arschloch) -----
let stLock=null,stLockT=0;
function stCanLock(){if(!G||gameOf(G)!=='stich'||G.local||G.paused||G.phase!=='play')return false;const s=mySeat();return s>=0&&G.turn!==s&&G.hands[s]&&G.hands[s].length>0&&!(G.players[s]&&G.players[s].bot)}
function stLockCheck(){
  if(!stLock)return;if(!G||gameOf(G)!=='stich'){stLock=null;return}
  if(G.phase!=='play'&&G.phase!=='cloud'&&G.phase!=='juggle'){stLock=null;return}
  const s=mySeat();if(s<0||G.phase!=='play'||G.turn!==s||G.paused)return;
  if(!G.hands[s].includes(stLock.c)){stLock=null;render();return}
  const wait=Math.max(trickHold-Date.now(),0)+450;clearTimeout(stLockT);
  stLockT=setTimeout(()=>{if(!stLock||!G||G.phase!=='play'||G.turn!==mySeat()||G.paused)return;if(busy||trickHold>Date.now())return stLockCheck();
    const L=stLock,g=clone(G);stLock=null;
    if(stPlay(g,s,L.c,L.as)){sel.clear();commit(g)}
    else{toast('🔓 Deine eingeloggte Karte passt nicht – du musst bedienen. Wähle neu.');sel.clear();render()}},wait);
}

// ===================== Cabo =====================
let cbSel=new Set(),cbOpp=null,cbShow=null;
const CB_ICON={peek:'👁️',spy:'🕵️',swap:'🔄',look:'👁️',blind:'🔄',peekswap:'🕵️'};
let cbThrowMode=false;
function cbCard(v,cls,attrs){
  if(v==null)return '<div class="cbc back'+(cls?' '+cls:'')+'" '+(attrs||'')+'><span class="cbl">CABO</span></div>';
  if(G&&cbH(G)){
    if(v>=52)return '<div class="cbc f hk jk'+(cls?' '+cls:'')+'" '+(attrs||'')+'><span class="cn">🃏</span><span class="hc">🃏</span><span class="hp">−1</span></div>';
    const r=v%13+1,su=Math.floor(v/13),red=su===1||su===2,rn=CB_RN[r],sy=CB_SUIT[su],ha=CB_HACT[r];
    return '<div class="cbc f hk'+(red?' red':'')+(r>10?' face':'')+(cls?' '+cls:'')+'" '+(attrs||'')+'><span class="cn">'+rn+'<i>'+sy+'</i></span><span class="hc">'+(r>10?rn:sy)+'</span>'+
      (ha?'<span class="ci">'+CB_ICON[ha]+'</span>':'')+(r===13&&red?'<span class="hp">0</span>':'')+'<span class="cn2">'+rn+'<i>'+sy+'</i></span></div>';
  }
  const a=CB_ACT[v];
  return '<div class="cbc f v'+v+(a?'':' na')+(cls?' '+cls:'')+'" '+(attrs||'')+'><span class="cn">'+v+'</span>'+(a?'<span class="ci">'+CB_ICON[a]+'</span>':'')+'<span class="cn2">'+v+'</span></div>';
}
const cbShown=(s,i)=>cbShow&&cbShow.until>Date.now()&&cbShow.s===s&&cbShow.i.includes(i);
function cbReveal(s,i,ms){cbShow={s,i,until:Date.now()+ms};setTimeout(render,ms+50)}
function cbBlock(g){
  return '<div class="blockw"><table class="rk block"><tr><th>R</th>'+g.players.map(p=>'<th>'+esc(p.name.slice(0,7))+'</th>').join('')+'</tr>'+
    (g.hist||[]).map((h,r)=>'<tr><td>'+(r+1)+'</td>'+h.sc.map((x,s)=>'<td>'+(h.caboBy===s?'📣':'')+(h.kami===s?'💥':'')+'<b>'+x+'</b><br><small>Σ '+h.sums[s]+'</small></td>').join('')+'</tr>').join('')+
    '<tr class="sum"><td>Σ</td>'+g.totals.map(x=>'<td><b>'+x+'</b></td>').join('')+'</tr></table></div>';
}
function cbAct(a,v){
  const s=mySeat(),g=clone(G);if(s<0)return true;
  switch(a){
    case 'cb-mine':{const i=+v,L=G.lines[s];if(!L[i])return true;
      if(cbThrowMode&&G.phase!=='peek'){cbThrowMode=false;if(busy){toast('Einen Moment …');render();return true}
        if(cbThrow(g,s,i)){sfx('card');commit(g)}else{toast('Diese Karte kannst du gerade nicht werfen.');render()}return true}
      if(G.phase==='peek'){if(G.ready[s])return true;if(cbSel.has(i))cbSel.delete(i);else if(cbSel.size<2)cbSel.add(i);render();return true}
      if(G.turn!==s)return true;
      if(G.phase==='play'&&G.drawn){cbSel.has(i)?cbSel.delete(i):cbSel.add(i);render();return true}
      if(G.phase==='act'&&!G.act.sel&&['peek','swap','look','blind','peekswap'].includes(G.act.k)){cbSel.has(i)?cbSel.clear():(cbSel.clear(),cbSel.add(i));if(G.act.k==='look')cbOpp=null;render()}
      return true}
    case 'cb-opp':{if(G.phase!=='act'||G.turn!==s||G.act.sel||!['spy','swap','look','blind','peekswap'].includes(G.act.k))return true;const [t,j]=String(v).split(':').map(Number);
      if(G.act.k!=='spy'&&G.act.k!=='look'&&t===G.caboBy){toast('Die Karten von '+nm(G,t)+' sind nach dem CABO gesperrt.');return true}
      cbOpp=cbOpp&&cbOpp[0]===t&&cbOpp[1]===j?null:[t,j];if(G.act.k==='look')cbSel.clear();render();return true}
    case 'cb-throw':if(!cbCanThrow(G,s)){toast(s===G.caboBy?'Nach deinem CABO sind deine Karten gesperrt.':'Gerade kann nichts dazwischen geworfen werden.');return true}
      cbThrowMode=!cbThrowMode;render();return true;
    case 'cb-yes':case 'cb-no':if(cbDecide(g,s,a==='cb-yes')){cbSel.clear();cbOpp=null;if(a==='cb-yes')sfx('deal');commit(g)}return true;
    case 'cb-ready':{const [x,y]=[...cbSel];if(cbSel.size!==2)return true;if(cbPeekStart(g,s,x,y)){cbSel.clear();commit(g)}return true}
    case 'cb-draw':if(cbDraw(g,s)){cbSel.clear();sfx('card');commit(g)}else if(!G.deck.length)toast('Der Stapel ist leer.');return true;
    case 'cb-take':if(cbTake(g,s)){cbSel.clear();sfx('card');commit(g)}return true;
    case 'cb-cabo':openModal('<h2>📣 CABO rufen?</h2><p class="note">Du glaubst, du hast die wenigsten Punkte. Alle anderen haben noch einen Zug – liegst du falsch, bekommst du 10 Strafpunkte.</p><div class="row"><button data-a="cb-cabo-ok">CABO!</button><button class="ghost" data-a="modal-x">Abbrechen</button></div>');return true;
    case 'cb-cabo-ok':closeModal();if(cbCabo(g,s))commit(g);return true;
    case 'cb-swap':{const ix=[...cbSel];if(!ix.length)return true;if(cbSwap(g,s,ix)){cbSel.clear();sfx('deal');commit(g)}return true}
    case 'cb-disc':if(cbDiscard(g,s)){cbSel.clear();sfx('card');commit(g)}return true;
    case 'cb-skip':if(cbSkip(g,s)){cbSel.clear();cbOpp=null;commit(g)}return true;
    case 'cb-do':{const k=G.act&&G.act.k,i=[...cbSel][0];
      if(k==='peek'){if(i==null)return true;if(cbDoAct(g,s,i)){cbSel.clear();commit(g);cbReveal(s,[i],3000)}}
      else if(k==='spy'){if(!cbOpp)return true;const [t,j]=cbOpp;if(cbDoAct(g,s,0,t,j)){cbOpp=null;commit(g);cbReveal(t,[j],3000)}}
      else if(k==='swap'||k==='blind'){if(i==null||!cbOpp)return true;const [t,j]=cbOpp;if(cbDoAct(g,s,i,t,j)){cbSel.clear();cbOpp=null;sfx('deal');commit(g)}}
      else if(k==='look'){if(cbOpp){const [t,j]=cbOpp;if(cbDoAct(g,s,-1,t,j)){cbOpp=null;commit(g);cbReveal(t,[j],3000)}}else if(i!=null&&cbDoAct(g,s,i)){cbSel.clear();commit(g);cbReveal(s,[i],3000)}}
      else if(k==='peekswap'){if(i==null||!cbOpp)return true;const [t,j]=cbOpp;if(cbDoAct(g,s,i,t,j)){cbSel.clear();cbOpp=null;commit(g)}}
      return true}
    case 'cb-block':openModal('<h2>📒 Punkte</h2>'+cbBlock(G)+'<button class="ghost" data-a="modal-x" style="margin-top:10px">Schließen</button>');return true;
  }
  return false;
}

const CB_RULES_TXT='<details><summary>Regeln Cabo</summary>Ziel: am Ende einer Runde möglichst wenige Punkte vor sich liegen haben. Jeder bekommt 4 verdeckte Karten und schaut sich zu Beginn zwei davon an – danach nur noch im Kopf behalten!<br><br>'+

  '<b>Hausregeln 🃏 (Standard)</b> – echtes Kartenspiel mit 54 Karten. Punkte: Joker −1 · Ass 1 · 2–10 Nennwert · Bube, Dame und schwarzer König 10 · <b>roter König 0</b>.<br>'+
  'Aktionskarten (nur vom Stapel gezogen und abgeworfen, alle freiwillig): <b>7</b> 👁️ eine Karte anschauen – deine oder die eines Mitspielers · <b>8</b> 🔄 eine eigene Karte blind mit einer fremden tauschen · <b>9</b> 🕵️ eine eigene und eine fremde Karte anschauen, dann entscheiden, ob getauscht wird.<br>'+
  '<b>⚡ Dazwischen werfen:</b> Jederzeit – auch wenn du nicht dran bist – darfst du eine eigene Karte mit dem gleichen Rang wie die oberste Ablagekarte drauflegen (z. B. eine 2 auf eine 2). Passt sie nicht, wird sie aufgedeckt, bleibt liegen und du bekommst eine Strafkarte.<br><br>'+
  '<b>Original-Regeln</b> – Zahlenkarten 0–13: 7/8 👁️ eigene Karte anschauen · 9/10 🕵️ fremde Karte anschauen · 11/12 🔄 blind tauschen. <b>Kamikaze:</b> genau zwei 12er und zwei 13er: du bekommst 0, alle anderen 50 Punkte.<br><br>'+

function p10Card(c,cls,attrs){

  if(p10W(c))return '<div class="pc wild'+(cls?' '+cls:'')+'" '+(attrs||'')+'><b>J</b><i>Joker</i></div>';

}
function p10Sorted(h){return h.slice().sort((a,b)=>{const k=c=>p10W(c)?200:p10S(c)?300:p10SortCol?p10C(c)*20+p10V(c):p10V(c)*4+p10C(c);return k(a)-k(b)})}
// Folge in richtiger Reihenfolge anzeigen (Joker an ihren Platz)
function p10Show(gr){
  if(gr.t!=='run')return gr.c;
  const nat=gr.c.filter(p10N),w=gr.c.filter(p10W),out=[];
  for(let v=gr.lo;v<gr.lo+gr.c.length;v++){const c=nat.find(x=>p10V(x)===v);out.push(c!=null?c:w.pop())}
  return out.filter(x=>x!=null);
}
function p10Act(a,v){

    case 'p10-sort':p10SortCol=!p10SortCol;render();return true;

    case 'p10-stage':{if(!p10Sel.size)return true;p10Stage.push([...p10Sel]);p10Sel.clear();render();return true}

    case 'p10-lay':{const def=P10_PH[G.ph[s]],grs=p10Stage.slice();if(p10Sel.size)grs.push([...p10Sel]);

    case 'p10-hit':{const gi=+v,c=[...p10Sel][0];if(c==null){toast('Wähl erst eine Karte aus deiner Hand.');return true}
      if(!G.laid[s]){toast('Anlegen geht erst, wenn du deine eigene Phase ausgelegt hast.');return true}
      if(p10Hit(g,s,c,gi)){p10Sel.delete(c);sfx('deal');commit(g)}else toast('Die Karte passt hier nicht.');return true}
    case 'p10-disc':{if(!my||!G.drew)return true;if(p10Sel.size!==1){toast('Wähl genau eine Karte zum Abwerfen.');return true}const c=[...p10Sel][0];
      if(p10S(c)){openModal('<h2>⏭ Wer soll aussetzen?</h2><div class="col">'+G.players.map((p,t)=>t===s?'':'<button class="ghost" data-a="p10-skipto" data-v="'+t+'" '+(G.skip[t]>0&&G.players.some((_,u)=>u!==s&&G.skip[u]===0)?'disabled':'')+'>'+esc(p.name)+' · Phase '+(G.ph[t]+1)+'</button>').join('')+'</div><button class="ghost" data-a="modal-x" style="margin-top:8px">Abbrechen</button>');return true}

    case 'p10-skipto':{closeModal();const c=[...p10Sel][0];if(p10Discard(g,s,c,+v)){p10Sel.clear();p10Stage=[];sfx('card');commit(g)}return true}
    case 'p10-block':openModal('<h2>📒 Punkte</h2>'+p10Block(G)+'<button class="ghost" data-a="modal-x" style="margin-top:10px">Schließen</button>');return true;
  }
  return false;
}
