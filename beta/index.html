<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Arschloch – Kartenspiel</title>
<meta name="theme-color" content="#2a170c">
<meta name="description" content="Das Kartenspiel Arschloch – online mit Freunden, jeder auf seinem Handy.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Arschloch">
<script src="supabase.js"></script>
<style>
  :root{
    --ink:#f6efe2; --mute:#cbb89b; --card:#fbf8ee;
    --gold:#f2c14e; --onGold:#2b2100; --red:#c0392b; --black:#1c1c1c; --line:rgba(255,220,170,.17);
    --f1:#2c8a55; --f2:#17603a; --f3:#0c3d22; --ttext:#d5ead9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Kein Markieren bei langem Druecken (sonst oeffnet Android die Google-Suche) */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#1d110a;
    min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  /* Hintergrund als feste Ebene: wird nicht bei jedem Scrollen neu gezeichnet */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(95% 55% at 50% -8%,rgba(255,186,105,.30),transparent 70%),
      radial-gradient(120% 80% at 50% 110%,rgba(0,0,0,.55),transparent 60%),
      repeating-linear-gradient(91deg,rgba(0,0,0,.16) 0 2px,transparent 2px 11px,rgba(255,255,255,.025) 11px 12px,transparent 12px 27px),
      linear-gradient(180deg,#402716,#1d110a)}
  body[data-bg=night]{background:#0b1022}
  body[data-bg=night]::before{background:radial-gradient(90% 50% at 50% -5%,rgba(120,150,255,.28),transparent 70%),radial-gradient(60% 40% at 85% 100%,rgba(80,40,160,.25),transparent 70%),linear-gradient(180deg,#1a2550,#0b1022)}
  body[data-bg=living]{background:#2b211a}
  body[data-bg=living]::before{background:radial-gradient(70% 45% at 20% 0%,rgba(255,214,150,.35),transparent 70%),repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 34px),linear-gradient(180deg,#6b5442,#2b211a)}
  body[data-bg=neon]{background:#0d0b26}
  body[data-bg=neon]::before{background:radial-gradient(70% 45% at 15% 5%,rgba(255,60,180,.35),transparent 70%),radial-gradient(70% 45% at 90% 95%,rgba(0,220,255,.25),transparent 70%),linear-gradient(160deg,#2a0b3d,#0d0b26)}
  body[data-bg=concrete]{background:#2a2c2f}
  body[data-bg=concrete]::before{background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.12),transparent 70%),linear-gradient(180deg,#4a4d52,#22252a)}

  #app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  #app>*{flex-shrink:0}
  .conn{font-size:12px;color:#ff8f7a;text-align:center;margin:-4px 0 6px}
  h1{font-size:38px;margin:22px 0 4px;letter-spacing:.5px;font-family:Georgia,'Times New Roman',serif;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5)}
  h2{font-size:24px;margin:8px 0 12px;font-family:Georgia,'Times New Roman',serif;color:var(--gold)}
  h3{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
  .suits{letter-spacing:10px;font-size:20px;margin:0 0 6px;color:var(--mute)}
  .suits i{font-style:normal;color:#d9534f}
  .sub{color:var(--mute);margin:0 0 18px;line-height:1.4}
  .panel{background:rgba(12,6,2,.45);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
  input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font-size:18px;padding:0 14px;outline:none}
  input:focus{border-color:var(--gold)}
  input+input,input+label{margin-top:10px}
  button{font:inherit;font-weight:650;font-size:17px;height:52px;border-radius:14px;border:0;padding:0 18px;cursor:pointer;background:var(--gold);color:var(--onGold);width:100%;touch-action:manipulation}
  button.ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  button.small{height:38px;font-size:14.5px;width:auto;padding:0 12px;border-radius:11px}
  button.danger{background:#b5402f;color:#fff}
  button:disabled{opacity:.4;cursor:default}
  button:active:not(:disabled){transform:translateY(1px)}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  .stack>*+*{margin-top:10px}
  .note{font-size:13.5px;color:var(--mute);line-height:1.45}
  .err{color:#ff8f7a;font-size:14px;min-height:18px;margin-top:8px}
  .code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 2px}
  ul.plist{list-style:none;margin:0;padding:0}
  ul.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:17px}
  ul.plist li:last-child{border-bottom:0}
  ul.plist li>span:first-child{display:flex;gap:10px;align-items:center;min-width:0}
  .tag{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
  .tag.gold{color:var(--gold);border-color:var(--gold)}
  .dot{width:10px;height:10px;border-radius:50%;background:#6b6258;flex:none}
  .dot.on{background:#3ddc6f;box-shadow:0 0 0 3px rgba(61,220,111,.2)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:99px;background:#e2463a;color:#fff;font-size:12px;font-weight:800;padding:0 6px;margin-left:6px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .acct{height:38px;width:auto;font-size:14.5px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .nav button{height:64px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border-radius:14px}
  .nav button b{font-size:22px;line-height:1;position:relative}
  .nav .badge{position:absolute;top:-8px;right:-16px;margin:0}
  .back{background:none;border:0;color:var(--mute);height:auto;width:auto;padding:4px 0;font-size:15px;font-weight:600;margin:2px 0 6px;align-self:flex-start}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--mute)}
  table.rk{width:100%;border-collapse:collapse;font-size:15px}
  table.rk th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:4px 4px 8px}
  table.rk th:nth-child(2){text-align:left}
  table.rk td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  table.rk td:nth-child(2){text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.rk tr.me td{color:var(--gold)}
  .award{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .award:first-of-type{border-top:0}
  .award .e{font-size:28px;width:36px;text-align:center}
  .award b{display:block}
  .award span{font-size:13.5px;color:var(--mute)}
  .pcard{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .pcard:first-of-type{border-top:0}
  .pcard .pts{margin-left:auto;font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .pcard .det{font-size:12.5px;color:var(--mute);margin-top:2px}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{width:auto;height:auto;padding:8px 10px;font-size:13.5px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--ink);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px}
  .opt.on{border-color:var(--gold)}
  .sw{width:44px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.25)}
  .swc{width:30px;height:30px;border-radius:50%}

  .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:10px;gap:8px}
  .top b{color:var(--ink);letter-spacing:2px}
  .top .tb{display:flex;gap:6px;align-items:center}
  .linkbtn{background:none;border:0;color:var(--mute);font-size:13px;height:auto;width:auto;padding:4px;text-decoration:underline;font-weight:400}
  .iconbtn{width:34px;height:34px;padding:0;border-radius:10px;font-size:15px;background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line)}
  .opps{display:flex;gap:8px;flex-wrap:wrap}
  .opp{flex:1 1 30%;min-width:0;background:rgba(12,6,2,.45);border:1px solid var(--line);border-radius:14px;padding:9px 10px;position:relative}
  .opp.turn{border-color:var(--gold)}
  /* Leuchten ueber Deckkraft statt Schatten-Animation: guenstig fuer die Grafikkarte */
  .opp.turn::after{content:"";position:absolute;inset:-3px;border-radius:16px;box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold);opacity:.25;animation:glow 1.3s ease-in-out infinite alternate;pointer-events:none;will-change:opacity}
  .opp .n{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .r{font-size:11.5px;color:var(--mute);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opp .c{font-size:13px;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
  .opp .c span:last-child{color:var(--gold)}

  /* ---------- Tisch ---------- */
  .table{flex:1;min-height:215px;max-height:340px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 14px;margin:16px 0 8px;
    border-radius:120px;border:10px solid #5d3619;color:var(--ttext);
    background:radial-gradient(ellipse at 50% 30%,var(--f1) 0%,var(--f2) 55%,var(--f3) 100%);
    box-shadow:0 0 0 2px #24130a,inset 0 0 0 2px rgba(0,0,0,.4),inset 0 0 46px rgba(0,0,0,.6),0 16px 30px rgba(0,0,0,.55)}
  .table::before{content:"";position:absolute;inset:9px;border-radius:inherit;border:1px dashed rgba(255,255,255,.16);pointer-events:none}
  .table>*{position:relative;z-index:1}
  body[data-surface=desk] .table{border-radius:14px;border:8px solid #2e1b0e;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18)),repeating-linear-gradient(90deg,#6b4423 0 3px,#744a27 3px 10px,#5f3c1f 10px 12px,#6e4625 12px 24px)}
  body[data-surface=desk] .table::before{inset:14px 22px;border-radius:8px;border:2px dashed rgba(255,255,255,.22);background:radial-gradient(ellipse at 50% 40%,var(--f1),var(--f3));box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:0}
  body[data-surface=wood] .table{border-radius:10px;border:6px solid #7a4e26;--ttext:#3a2410;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.08)),repeating-linear-gradient(90deg,#c58e57 0 2px,#cf9862 2px 14px,#b98251 14px 16px,#d29d68 16px 52px,#5a3518 52px 54px)}
  body[data-surface=wood] .table::before{display:none}
  body[data-surface=grass] .table{border-radius:26px;border:9px solid #2a5a22;
    background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.28) 100%),repeating-linear-gradient(90deg,#3f8f3a 0 34px,#4ba344 34px 68px)}
  body[data-surface=grass] .table::before{inset:12px;border:2px solid rgba(255,255,255,.55);border-radius:16px}
  body[data-surface=marble] .table{border-radius:24px;border:9px solid #8d8d8d;--ttext:#3b3b3b;
    background:linear-gradient(115deg,transparent 40%,rgba(120,120,120,.25) 41%,transparent 43%),linear-gradient(35deg,transparent 60%,rgba(140,140,140,.2) 61%,transparent 63%),linear-gradient(160deg,transparent 20%,rgba(160,160,160,.18) 21%,transparent 23%),linear-gradient(135deg,#f4f2ee,#d8d5cf)}
  body[data-surface=marble] .table::before{display:none}
  body[data-surface=space] .table{border:6px solid #2b3570;
    background:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 33% 74%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 18%,#fff,transparent),radial-gradient(1px 1px at 76% 62%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 30%,#cfe,transparent),radial-gradient(1px 1px at 22% 55%,#fff,transparent),radial-gradient(ellipse at 60% 70%,rgba(140,80,255,.35),transparent 60%),radial-gradient(ellipse at 50% 40%,#1b2550,#070b1e)}
  body[data-surface=space] .table::before{border-color:rgba(160,180,255,.25)}

  .pile{display:flex;justify-content:center;min-height:92px;align-items:center}
  .pile.closed{opacity:.45;transform:scale(.9)}
  .pile.closing{animation:closing .55s ease-in backwards}
  .pile .empty{width:62px;height:90px;border:2px dashed rgba(255,255,255,.25);border-radius:10px}
  .msg{font-size:14px;color:var(--ttext);text-align:center;min-height:18px;padding:0 14px}
  .msg.new{animation:msgIn .35s ease-out}
  .pausebox{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);border-radius:inherit;color:#fff;text-align:center;padding:16px}
  .pausebox b{font-size:22px}
  .pausebox button{width:auto}
  .status{text-align:center;font-size:16.5px;font-weight:650;min-height:42px;display:flex;align-items:center;justify-content:center;padding:0 6px;line-height:1.3}
  .status.me{color:var(--gold)}
  .status.new{animation:pop .5s ease-out}
  .card{width:58px;height:84px;border-radius:9px;background:var(--card);color:var(--black);position:relative;flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid #d9d3bf;user-select:none;transition:transform .12s}
  .card.red{color:var(--red)}
  .card .k{position:absolute;top:5px;left:7px;font-size:19px;font-weight:800;line-height:1}
  .card .s{position:absolute;top:25px;left:7px;font-size:15px;line-height:1}
  .card .big{position:absolute;right:7px;bottom:5px;font-size:30px;line-height:1}
  .pile .card{margin:0 -9px;transform:rotate(var(--r,0deg))}
  .pile.in .card{animation:throwDown .38s cubic-bezier(.2,.8,.3,1.15) backwards;animation-delay:calc(var(--i,0)*70ms)}
  .pile.in.mine .card{animation-name:throwUp}
  .hand{display:flex;flex-wrap:wrap;justify-content:center;padding:14px 14px 4px 30px;row-gap:10px;min-height:100px}
  .hand .card{margin-left:-16px;cursor:pointer}
  .hand.deal .card{animation:dealIn .4s cubic-bezier(.2,.8,.3,1.1) backwards;animation-delay:calc(var(--i,0)*45ms)}
  /* Wenn man dran ist: legbare Karten leuchten gruen, der Rest wird abgedunkelt */
  .hand .card.ok{box-shadow:0 0 0 2px #5fe08a,0 0 12px rgba(95,224,138,.75)}
  .hand .card.no{filter:brightness(.55) saturate(.6)}
  .hand .card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--gold),0 8px 14px rgba(0,0,0,.4)}
  .hand .card.fresh::after{content:"neu";position:absolute;top:-8px;right:-4px;background:var(--gold);color:var(--onGold);font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px}
  .mebar{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--mute);margin-top:4px}
  .actions{display:flex;gap:10px;margin-top:10px;position:sticky;bottom:12px;z-index:3}
  .actions button{box-shadow:0 6px 16px rgba(0,0,0,.5)}
  .actions .ghost{background:#3b2a1d}
  .actions button:disabled{opacity:1;filter:brightness(.55)}
  .place{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1b1b;color:#fff;padding:12px 16px;border-radius:12px;
    font-size:14.5px;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;line-height:1.35}
  #toast.on{opacity:1}
  #modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
  #modal.on{display:flex;animation:fadeIn .2s ease-out}
  #modal .box{width:100%;max-width:440px;background:#24170e;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:env(safe-area-inset-bottom);animation:up .25s ease-out}
  #modal .box h2{margin-top:0}
  details{font-size:14px;color:var(--mute);line-height:1.5}
  details summary{cursor:pointer;color:var(--ink);font-weight:600;padding:2px 0}
  .table.small{flex:0 0 auto;min-height:112px;padding:10px 14px;margin:12px 0 6px}
  .table.small .pile{min-height:0}.table.small .pile .empty{display:none}
  .wish{margin:6px 0 12px}
  .hand.mini{padding:10px 10px 0 22px;min-height:0;row-gap:6px}
  .hand.mini .card{width:42px;height:60px;margin-left:-12px;border-radius:7px;cursor:default}
  .hand.mini .card .k{font-size:15px;top:4px;left:5px}.hand.mini .card .s{font-size:12px;top:21px;left:5px}.hand.mini .card .big{font-size:18px;right:4px;bottom:3px}
  .card.back{background:repeating-linear-gradient(45deg,#7a1f1f 0 6px,#932a2a 6px 12px);border:3px solid var(--card)}
  @media (max-height:720px){.table{min-height:165px;padding:10px 14px;margin:10px 0 4px}}
  .wish .wr{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .wish .wr button{height:46px;padding:0;font-size:16px;border-radius:10px}
  .wish .chosen{font-size:14px;color:var(--mute);margin:10px 0;min-height:36px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{width:auto;height:34px;font-size:15px;padding:0 12px;border-radius:99px}
  .tm{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold);margin-left:8px;white-space:nowrap}
  .tm.hot{color:#ff6b57}
  .oh{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
  .oc{background:var(--card);color:#1c1c1c;border-radius:4px;font-size:11.5px;font-weight:800;line-height:1;padding:3px 2px;min-width:21px;text-align:center}
  .oc.red{color:var(--red)}.oc i{font-style:normal;display:block;font-size:10px;margin-top:1px}

  /* Sanduhr: sitzt rechts auf dem Tisch, nie ueber den eigenen Karten */
  .hgw{position:absolute;right:20px;top:50%;width:46px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;
    opacity:0;transform:translateY(-50%) scale(.55);transition:opacity .3s,transform .5s ease-out;will-change:transform,opacity}
  .hgw.on{opacity:1}
  .hgw svg{width:46px;height:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .hgw b{font-size:17px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000}
  .hgw .stream{stroke-dasharray:4 5;animation:hg-s .35s linear infinite}

<body>
<div id="app"></div>
<div id="chatui"></div>
<div id="toast"></div>
<div id="modal"></div>
<div id="boom" aria-hidden="true"><div class="dim"></div><div class="glow"></div><div class="cen"><div class="halo"></div><div class="ring"></div><div class="ring r2"></div><div class="bomb">💣<i>✨</i></div><div class="bang">💥</div><div id="parts"></div></div><div class="flash"></div><div class="txt"><b>Mi Bombo!</b><span id="boomtxt"></span></div></div>
<script>
//LOGIC-START
const RANKS=['7','8','9','10','B','D','K','A'], SUITS=['♠','♥','♦','♣'];
const rk=c=>c>>2, su=c=>c&3;
const ROLES={3:['Präsident','Bauer','Arschloch'],
  4:['Präsident','Vize-Präsident','Vize-Arschloch','Arschloch'],
  5:['Präsident','Vize-Präsident','Bauer','Vize-Arschloch','Arschloch']};
const clone=o=>JSON.parse(JSON.stringify(o));
const asc=(a,b)=>a-b;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nm(g,s){return g.players[s].name}
function cardsTxt(cs){return (cs.length>1?cs.length+'× ':'')+RANKS[rk(cs[0])]}
function activeSeats(g){return g.players.map((_,i)=>i).filter(i=>g.hands[i].length>0)}
function nextActive(g,from,excl){const n=g.players.length;for(let i=1;i<=n;i++){const s=(from+i)%n;if(g.hands[s].length&&!(excl&&excl(s)))return s}return -1}
function isFree(g){return !g.pile||g.pile.closed}
const DEFAULT_RULES={turn:20,bombs:true,stock:true,aceRule:true,target:0,solo:true};
function R(g){return Object.assign({},DEFAULT_RULES,g.rules||{})}

// Neue Partie: Statistik pro Platz zuruecksetzen
function initMs(g){
  const n=g.players.length;g.ms={};
  for(let i=0;i<n;i++)g.ms[i]={pts:0,rounds:0,pl:Array(n).fill(0),aces:0,bombs:0,aceEnd:0,to:0,streak:0,best:0,climbs:0,bob:0};
}
function startMatch(g){initMs(g);g.order=null;g.round=0;g.paused=null;g.final=false;g.match=(g.match|0)+1}
function deal(g){
  const n=g.players.length, deck=shuffle([...Array(32).keys()]);
  g.stock=n===4||!R(g).stock?[]:deck.splice(0,2);g.bauer=-1;g.open=[];g.losers=[];
  g.rs={aces:{},bombs:{},aceEnd:{},to:{},streak:{},climb:{},bob:{}};
  const prev=g.order&&g.order.length===n?g.order:null;
  const start=prev?prev[0]:Math.floor(Math.random()*n);
  const hands={},fresh={};
  for(let i=0;i<n;i++){hands[i]=[];fresh[i]=[]}
  deck.forEach((c,i)=>hands[(start+i)%n].push(c));
  for(let i=0;i<n;i++)hands[i].sort(asc);
  g.solo=false;g.prevRoles={};g.hands=hands;g.fresh=fresh;g.pile=null;g.passed=[];g.last=-1;g.finished=[];g.swaps=[];g.wishQ=[];
  g.round=(g.round||0)+1;g.roles={};
  if(prev){
    prev.forEach((s,i)=>g.roles[s]=i);g.prevRoles=Object.assign({},g.roles);
    g.wishQ.push({hi:prev[0],lo:prev[n-1],n:2});
    if(n>=4)g.wishQ.push({hi:prev[1],lo:prev[n-2],n:1});
    if(n!==4&&g.stock.length)g.bauer=prev[(n-1)/2];
    g.phase='wish';g.turn=prev[0];g.starter=prev[n-1];
    g.msg=nm(g,prev[0])+' darf sich 2 Karten wünschen.';
  }else{g.turn=start;g.msg=nm(g,start)+' fängt an.'+(g.stock.length?' 2 Karten bleiben verdeckt liegen.':'');startPlay(g)}
}
function startPlay(g){
  g.phase='play';
  g.players.forEach((_,i)=>{g.rs.aces[i]=g.hands[i].filter(c=>rk(c)===7).length});
  g.open=g.players.map((_,i)=>i).filter(i=>g.rs.aces[i]===4);
  if(g.open.length)g.msg+=' '+g.open.map(i=>nm(g,i)).join(' und ')+' hat 4 Asse und muss offen spielen!';
}
function wish(g,seat,ranks){
  const q=g.wishQ.shift(),lo=q.lo,got=[];let hit=0;ranks=ranks.slice(0,q.n);
  for(const r of ranks){const i=g.hands[lo].findIndex(c=>rk(c)===r);if(i>=0){got.push(g.hands[lo].splice(i,1)[0]);hit++}}
  while(got.length<q.n)got.push(g.hands[lo].pop());
  g.hands[seat].push(...got);g.hands[seat].sort(asc);g.fresh[seat]=got;
  g.swaps.push({from:seat,to:lo,n:q.n});
  const best=q.n===1?'die beste Karte':'die '+q.n+' besten Karten';
  if(!ranks.length)g.msg=nm(g,seat)+' nimmt '+best+' von '+nm(g,lo)+'.';
  else g.msg=nm(g,seat)+' wünscht sich '+ranks.map(r=>RANKS[r]).join(' und ')+' – '+
    (hit===ranks.length?(hit===q.n?(q.n===2?'beide bekommen.':'bekommen.'):'bekommen, dazu die beste Karte.')
      :hit?'eine bekommen, dazu die beste Karte.':nm(g,lo)+' hat '+(ranks.length>1?'sie':'sie')+' nicht, es gibt '+(q.n===1?'die beste Karte.':'die besten Karten.'));
  if(g.wishQ.length){g.turn=g.wishQ[0].hi;g.msg+=' Jetzt wünscht sich '+nm(g,g.turn)+' eine Karte.'}
  else{g.phase='swap';g.turn=g.swaps[0].from}
}
function canGive(g,seat,cards){
  if(g.phase!=='swap'||g.turn!==seat||!g.swaps.length)return false;
  return cards.length===g.swaps[0].n&&cards.every(c=>g.hands[seat].includes(c));
}
function give(g,seat,cards){
  const s=g.swaps.shift();
  g.hands[seat]=g.hands[seat].filter(c=>!cards.includes(c));
  g.hands[s.to].push(...cards);g.hands[s.to].sort(asc);g.fresh[s.to]=cards.slice();g.fresh[seat]=[];
  if(g.swaps.length){g.turn=g.swaps[0].from}
  else if(g.bauer>=0&&g.stock&&g.stock.length===2){g.phase='stock';g.turn=g.bauer;g.msg=nm(g,g.bauer)+' darf sich den Stock ansehen.'}
  else{g.turn=g.starter;g.msg='Getauscht. '+nm(g,g.starter)+' kommt raus.';startPlay(g)}
}

  };

    .on('broadcast',{event:'invite'},m=>onInv(m.payload)).on('broadcast',{event:'friends'},()=>onFr()).subscribe()};
  S.register=async(u,pw)=>{

      if(!r.data.session){const l=await sb.auth.signInWithPassword({email:mail(u),password:pw,options:{captchaToken:await captchaToken()}});if(l.error)throw l.error}
    }

  };
  S.login=async(u,pw)=>{const r=await sb.auth.signInWithPassword({email:mail(u),password:pw,options:{captchaToken:await captchaToken()}});if(r.error)throw r.error};
  S.deleteAccount=async()=>{await rpc('delete_my_account');await sb.auth.signOut()};
  S.logout=async()=>{await sb.auth.signOut()};

      store.listenUser(()=>pollInvites(),()=>loadFriends());

async function joinRoom(pre){

function boom(t){
  const el=$('#boom'),parts=$('#parts');$('#boomtxt').textContent=t;
  const E=['🔥','💥','✨','🔥','☄️','💣','⭐','🔥','💥','🃏','♠','♥','♦','♣'],N=LOW?16:32,R=Math.max(innerWidth,innerHeight);let h='';
  for(let i=0;i<N;i++){
    const a=Math.random()*6.283,d=R*(.35+Math.random()*.75);
    h+='<span style="font-size:'+(24+Math.random()*48|0)+'px;color:'+(i%2?'#ffd257':'#ff5a2a')+';--dx:'+(Math.cos(a)*d|0)+'px;--dy:'+(Math.sin(a)*d|0)+'px;--rot:'+((Math.random()*1440-720)|0)+'deg;--t:'+(1.3+Math.random()*1.1).toFixed(2)+'s;--d:'+(2.6+Math.random()*.45).toFixed(2)+'s">'+E[i%E.length]+'</span>';
  }
  el.classList.remove('on');document.body.classList.remove('rumble');parts.innerHTML=h;void el.offsetWidth;
  el.classList.add('on');document.body.classList.add('rumble');boomUntil=Date.now()+5200;
  clearTimeout(boomT);boomT=setTimeout(()=>{el.classList.remove('on');document.body.classList.remove('rumble');parts.innerHTML=''},5300);
  duck(5200);sfx('fuse');setTimeout(()=>{sfx('boom');if(SET.vib)try{navigator.vibrate&&navigator.vibrate([250,60,400])}catch(e){}},2600);
}
const pileKey=g=>g&&g.pile?g.pile.cards.join('-')+'@'+g.round:'';
function onGame(g,force){
  g=cleanGame(g);if(!g)return;
  if(G&&g.v<G.v&&!force)return;
  if(g.phase==='closed'){if(code){const h=g.host===myId;if(!h)toast('Der Host hat den Raum geschlossen.');const c=code;leave();store.hide&&store.hide(c).then(loadMyGames).catch(()=>{})}return}
  const prev=G;
  if(prev&&g.pile&&g.pile.cards.length===4&&pileKey(g)!==pileKey(prev))boom(nm(g,g.pile.by)+' legt 4× '+RANKS[rk(g.pile.cards[0])]);
  else if(prev&&g.pile&&pileKey(g)!==pileKey(prev))sfx('card');
  else if(prev&&g.v!==prev.v&&g.phase==='play'&&g.passed&&prev.passed&&g.passed.length>prev.passed.length)sfx('pass');
  if(prev&&g.round!==prev.round)sfx('deal');
  if(prev&&g.v!==prev.v&&(g.turn!==prev.turn||g.phase!==prev.phase)&&g.turn===mySeatOf(g)&&['play','wish','swap','stock'].includes(g.phase)&&!g.paused)setTimeout(()=>sfx('turn'),250);
  if(prev&&prev.phase==='play'&&g.phase==='end'){const ms=mySeatOf(g);if(ms>=0)setTimeout(()=>sfx(g.order[0]===ms?'win':g.order[g.order.length-1]===ms?'lose':'mid'),Math.max(600,boomUntil-Date.now()+200))}
  if(!prev||g.turn!==prev.turn||g.phase!==prev.phase||g.round!==prev.round){sel.clear();wishSel=[]}
  if(!prev||g.v!==prev.v||g.phase!==prev.phase)turnStart=Math.max(Date.now(),boomUntil);
  // Nach dem letzten Stich den Tisch noch kurz zeigen
  if(prev&&prev.phase==='play'&&g.phase==='end'){endHold=Math.max(Date.now()+2300,boomUntil+300);setTimeout(render,endHold-Date.now()+40)}
  if(g.phase==='end'&&seen.rec!==code+':'+g.round){seen.rec=code+':'+g.round;const c=code;setTimeout(()=>{store.recordRound(c);setTimeout(loadPres,2500)},1500)}
  G=g;clearTimeout(loadTimer);stale=false;render();maybeBot();
  const st=myStatus();if(st!==lastStatus){lastStatus=st;heartbeat()}
}
async function commit(g){
  if(busy||!sub)return false;busy=true;g.v=(g.v||0)+1;const s=sub,c=code;
  s.local(g); // sofort anzeigen, Server bestaetigt im Hintergrund
  try{const ok=await store.commit(c,g);if(!ok)s.refetch()}catch(e){console.warn(e);s.refetch();writeErr(e)}
  busy=false;maybeBot();return true;
}
function running(){return G&&['wish','swap','stock','play'].includes(G.phase)}
function maybeBot(){
  if(!G||botTimer||G.paused||!running())return;
  const isHost=G.host===myId,me_=mySeat();
  if(!isHost&&me_<0)return;
  if(!G.players[G.turn]||!G.players[G.turn].bot)return;
  const v=G.v;
  botTimer=setTimeout(()=>{
    botTimer=null;if(!G||G.paused)return;if(G.v!==v){maybeBot();return}
    if(busy){setTimeout(maybeBot,300);return}
    const g=clone(G),s=g.turn;
    if(g.phase==='wish')wish(g,s,botWish(g,s));
    else if(g.phase==='stock')takeStock(g,s,botStock(g,s));
    else if(g.phase==='swap')give(g,s,botGive(g,s));
    else{const m=botMove(g,s);if(m)play(g,s,m);else pass(g,s)}
    commit(g);
  },Math.max(1000,boomUntil-Date.now()+400)+(isHost?0:7000+Math.max(0,me_)*1500));
}
function tick(){
  const hg=$('#hg');
  if(!G||G.phase!=='play'||G.paused||G.turn<0||!G.players[G.turn]||G.players[G.turn].bot){if(hg)hg.classList.remove('on');return}
  const TURN=turnSecs();
  if(!TURN){if(hg)hg.classList.remove('on');const t=$('#tm');if(t)t.textContent='';return}
  const me_=mySeat(),el=(Date.now()-turnStart)/1000,left=Math.max(0,Math.ceil(TURN-el)),mine=G.turn===me_;
  if(mine&&left<=5&&left>0&&left!==seen.tickS){seen.tickS=left;sfx('tick')}
  const t=$('#tm');if(t){t.textContent=el<0?'':left+' s';t.classList.toggle('hot',left<=5)}
  if(hg){
    const hs=TURN/2;
    if(mine&&el>=hs&&el<TURN+1){
      const q=Math.min(1,(el-hs)/hs);hg.style.transform='translateY(-50%) scale('+(.6+.4*q).toFixed(3)+')';
      const y=20+50*q;$('#hgTop').setAttribute('y',y);$('#hgTop').setAttribute('height',70-y);
      $('#hgBot').setAttribute('y',126-46*q);$('#hgBot').setAttribute('height',46*q);$('#hgS').style.display=q>=1?'none':'';
      $('#hgN').textContent=left;hg.classList.add('on');
    }else hg.classList.remove('on');
  }
  if(el>=TURN&&autoV!==G.v&&!busy&&(mine||(G.host===myId&&el>=TURN+5)||(me_>=0&&el>=TURN+12+me_*2))){autoV=G.v;const g=clone(G);timeoutMove(g);sel.clear();commit(g)}
}

// Spezial-Emotes: je hoeher die Stufe, desto groesser der Auftritt
function special(uid,t){
  const sp=SPECIAL[t-1];if(!sp)return;const e=sp[1];
  const name=(G&&G.players&&(G.players.find(p=>p.id===uid)||{}).name)||(lobby.find(p=>p.id===uid)||{}).name||'';
  if(t<=3){
    let x='<span class="halo"></span>';
    if(t===1)x+=parts(8,'✨','p spark',70);

let REC=null,vPlaying=null;const VCACHE={};
const fmtS=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const vSecs=p=>+((/_(\d+)\./.exec(String(p))||[])[1]||0);
function musicBack(){if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.6,AC.currentTime,.3)}
function recMime(){const M=window.MediaRecorder;if(!M)return null;
  for(const t of ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])if(M.isTypeSupported&&M.isTypeSupported(t))return t;return ''}
async function micStart(){
  if(REC||!code||!store.online)return;
  const mt=recMime();
  if(mt===null||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Dein Browser kann keine Sprachnachrichten aufnehmen.');return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){toast('Ohne Mikrofon-Erlaubnis geht das nicht – erlaube das Mikrofon für diese Seite bzw. App.');return}
  let rec;try{rec=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:32000},mt?{mimeType:mt}:{}))}catch(e){rec=new MediaRecorder(stream)}
  REC={rec,stream,chunks:[],t0:Date.now(),cancel:false,code};
  rec.ondataavailable=e=>{if(e.data&&e.data.size&&REC)REC.chunks.push(e.data)};
  rec.onstop=()=>micDone();rec.start(250);
  if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.06,AC.currentTime,.1);
  REC.timer=setInterval(()=>{if(!REC)return;const s=(Date.now()-REC.t0)/1000;if(s>=30)micStop(false);else{const el=$('#rect');if(el)el.textContent=fmtS(s)}},250);
  renderChat();
}
function micStop(cancel){if(!REC)return;REC.cancel=cancel;clearInterval(REC.timer);try{if(REC.rec.state!=='inactive')REC.rec.stop();else micDone()}catch(e){micDone()}}
async function micDone(){
  const R=REC;REC=null;if(!R)return;
  try{R.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  musicBack();renderChat();
  if(R.cancel)return;
  const secs=Math.min(30,Math.round((Date.now()-R.t0)/1000));
  if(secs<1){toast('Zu kurz – tippe auf 🎤, sprich und dann auf Senden.');return}
  const type=String(R.rec.mimeType||(R.chunks[0]&&R.chunks[0].type)||'audio/webm').split(';')[0];
  const ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
  const blob=new Blob(R.chunks,{type});
  if(blob.size>480000){toast('Die Sprachnachricht ist zu groß.');return}
  const path=R.code+'/'+crypto.randomUUID()+'_'+secs+'.'+ext;
  try{
    const up=await store.sb.storage.from('voice').upload(path,blob,{contentType:type,upsert:false});if(up.error)throw up.error;
    VCACHE[path]=URL.createObjectURL(blob);
    await store.sendChat(R.code,'voice',path);
  }catch(e){console.warn(e);toast(/slow down/.test(String(e&&e.message))?'Zu viele Sprachnachrichten – warte kurz.':'Sprachnachricht ging nicht raus.')}
}
async function vplay(path){
  if(!store||!store.online||!/^[A-Z]{4}\/[0-9a-f-]{36}_[0-9]{1,2}\.(webm|m4a|ogg)$/.test(String(path)))return;
  try{
    let u=VCACHE[path];
    if(!u){const {data,error}=await store.sb.storage.from('voice').download(path);if(error)throw error;u=VCACHE[path]=URL.createObjectURL(data)}
    if(vPlaying)vPlaying.pause();
    const a=new Audio(u);vPlaying=a;
    if(AC&&MUSG)MUSG.gain.setTargetAtTime(SET.musVol*.12,AC.currentTime,.1);
    a.onended=a.onpause=()=>{if(vPlaying===a){vPlaying=null;musicBack()}};
    await a.play();
  }catch(e){console.warn(e);musicBack();toast('Sprachnachricht konnte nicht abgespielt werden.')}
}

function cardHtml(c,cls,attrs){
  const red=su(c)===1||su(c)===2;
  return '<div class="card'+(red?' red':'')+(cls?' '+cls:'')+'" '+(attrs||'')+'><span class="k">'+RANKS[rk(c)]+'</span><span class="s">'+SUITS[su(c)]+'</span><span class="big">'+SUITS[su(c)]+'</span></div>';
}
function roleOf(g,s){const n=g.players.length;return g.roles&&g.roles[s]!=null&&ROLES[n]?ROLES[n][g.roles[s]]:''}
const RULES='<details><summary>Regeln in Kurzform</summary>32 Karten, 7 bis Ass. Wer rauskommt, legt eine oder mehrere gleiche Karten. Danach muss jeder gleich viele, aber höhere Karten legen – oder passen. Wer einmal passt, darf in diesem Stich nicht mehr legen. Passen alle, darf derjenige, der zuletzt gelegt hat, allein weiter immer höher legen (gleich viele Karten) – hört er auf, kommt er neu raus. Vier gleiche Karten sind eine Bombe: Sie schlägt alles, auch Asse, und kann nur von einer höheren Bombe geschlagen werden. Wer zuerst keine Karten mehr hat, wird Präsident, der Letzte Arschloch. Jeder hat pro Zug 20 Sekunden – danach wird automatisch gepasst (oder beim Rauskommen die niedrigste Karte gelegt). Mit einem Ass als allerletzter Karte fertig zu werden ist erlaubt – wer das tut, landet aber automatisch auf dem letzten Platz (Arschloch). Wer nach dem Tauschen alle 4 Asse hält, muss offen spielen. Ab Runde 2 wünscht sich der Präsident bis zu 2 Karten vom Arschloch, bei 4+ Spielern der Vize-Präsident 1 Karte vom Vize-Arschloch – fehlt eine gewünschte Karte, gibt es dafür die beste. Zurück gibt es gleich viele beliebige Karten. Bei 3 und 5 Spielern bleiben 2 Karten als Stock liegen: Der Bauer darf beide gegen 2 eigene tauschen oder liegen lassen. Das Arschloch kommt raus. Punkte pro Runde: Erster bekommt so viele Punkte, wie Mitspieler da sind, minus eins; Letzter bekommt 0. Der Host kann in der Lobby Hausregeln einstellen (Zeit pro Zug, Bomben, Stock, Ass-Regel, Weiterlegen, Punkteziel).</details>';

function drawProfile(){

  if(!p)return h+'<h2>Statistik</h2><p class="note">Lade …</p>';

  h+='<div class="phead">'+avatar(p.avatar,p.display,p.wins,64)+'</div><div class="head"><h2>'+(mine?'Deine Statistik':esc(p.display))+'</h2>'+(mine?'':'<span class="tag"><span class="dot'+(p.online?' on':'')+'" style="display:inline-block;width:8px;height:8px;margin-right:5px"></span>'+(p.online?STATUS[p.status]||'online':'offline')+'</span>')+'</div>';

  h+='<div class="panel tier"><div class="tb"><span class="te">'+(lv?SPECIAL[lv-1][1]:'🃏')+'</span><div><b>Präsident-Stufe '+lv+(lv?' · '+esc(SPECIAL[lv-1][2]):'')+'</b><span>'+(p.wins||0)+'× Präsident'+(nx?' · nächste Stufe bei '+nx[0]+'× ('+nx[1]+' '+esc(nx[2])+')':' · höchste Stufe erreicht!')+'</span></div></div>'+
    (nx?'<div class="bar"><i style="width:'+Math.min(100,Math.round(((p.wins||0)-(lv?SPECIAL[lv-1][0]:0))*100/(nx[0]-(lv?SPECIAL[lv-1][0]:0))))+'%"></i></div>':'')+
    '<div class="tl">'+SPECIAL.map((x,i)=>'<span class="'+(i<lv?'on':'')+'" title="'+esc(x[2])+'">'+x[1]+'<small>'+x[0]+'</small></span>').join('')+'</div></div>';
  h+='<div class="stats">'+[
    [r,'Runden gespielt'],[p.matches||0,'Partien'],
    [pct(p.wins,r),'Präsident ('+p.wins+'×)'],[pct(p.last,r),'Arschloch ('+p.last+'×)'],
    [r?p.avg+' %':'–','Punkteschnitt'],[p.points||0,'Punkte gesamt'],
    [p.aces||0,'Asse auf der Hand'],[r?(p.aces/r).toFixed(1):'–','Asse pro Runde'],
    [p.bombs||0,'Bomben gelegt'],[p.aceEnds||0,'Mit Ass beendet'],
    [p.timeouts||0,'Zeit abgelaufen'],[p.since?new Date(p.since).toLocaleDateString('de-DE',{month:'short',year:'numeric'}):'–','Dabei seit']
  ].map(x=>'<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>';
  h+='<p class="note">Punkteschnitt: 100 % heißt immer Präsident, 0 % immer Arschloch. Gezählt werden nur Runden, die du mit Konto gespielt hast.</p>'+achHtml(p);

  return h;

function drawSettings(){
  const tg=(k,label,sub)=>'<li><span style="flex-direction:column;align-items:flex-start;gap:2px"><b style="font-size:16px">'+label+'</b><span class="note">'+sub+'</span></span><button class="sw2'+(SET[k]?' on':'')+'" data-a="set" data-v="'+k+'" aria-label="'+label+'"><i></i></button></li>';
  const sl=(k,label,sub)=>'<div class="vol"><div><b>'+label+'</b><span class="note">'+sub+'</span></div><div class="vrow"><span>🔈</span><input type="range" min="0" max="100" step="1" data-vol="'+k+'" value="'+Math.round(SET[k]*100)+'" aria-label="'+label+'"><span class="vv" id="vv-'+k+'">'+Math.round(SET[k]*100)+'</span></div></div>';
  const MUSICS=[['off','Aus'],['pop','Pop'],['chill','Ruhig'],['lounge','Lounge']];
  let h=backBtn+'<h2>Einstellungen</h2>'+
    '<div class="panel"><h3>Sound</h3>'+sl('sfxVol','Spiel-Sounds','Karten, Mi Bombo, Sanduhr, Fanfare …')+
    '<div class="vol"><div><b>Hintergrundmusik</b><span class="note">Wird live auf dem Handy erzeugt</span></div><div class="seg" style="margin-top:8px">'+MUSICS.map(([v,l])=>'<button class="'+((SET.music||'off')===v?'on':'')+'" data-a="mus" data-v="'+v+'">'+l+'</button>').join('')+'</div>'+
    '<div style="margin-top:12px"><b>Radio live</b><span class="note">Braucht Internet (ca. 60 MB pro Stunde)</span></div><div class="seg radio" style="margin-top:8px;flex-wrap:wrap">'+
    Object.entries(STATIONS).map(([k,x])=>'<button class="'+(SET.music==='r:'+k?'on':'')+'" data-a="mus" data-v="r:'+k+'">'+esc(x[0])+'</button>').join('')+'</div></div>'+
    (SET.music&&SET.music!=='off'?sl('musVol','Musik-Lautstärke',''):'')+
    (IOS?'<p class="note" style="margin-bottom:0">iPhone: Ist der Stumm-Schalter an der Seite aktiv, bleibt das Spiel still.</p>':'')+'</div>'+
    '<div class="panel"><ul class="plist">'+tg('vib','Vibration','Bei Bomben und Einladungen')+'</ul></div>';
  let push;
  if(!me)push='<p class="note" style="margin:0">Benachrichtigungen gibt es nur mit Konto.</p><button class="ghost" style="margin-top:10px" data-a="go" data-v="account">Konto erstellen</button>';
  else if(!pushSupported())push='<p class="note" style="margin:0">'+(IOS&&!STANDALONE?'Auf dem iPhone gehen Benachrichtigungen nur, wenn das Spiel als App auf dem Home-Bildschirm liegt: Safari → Teilen → „Zum Home-Bildschirm“, dann die App von dort öffnen.':'Dein Browser unterstützt keine Benachrichtigungen.')+'</p>';
  else if(SET.push&&Notification.permission==='granted')push='<p class="note" style="margin-top:0">🔔 An – du bekommst eine Meldung bei Einladungen und wenn du dran bist, während du nicht in der App bist.</p><button class="ghost" data-a="push-off">Ausschalten</button>';
  else push='<p class="note" style="margin-top:0">Bekomm eine Meldung aufs Handy, wenn dich jemand einlädt oder du dran bist – auch bei gesperrtem Bildschirm.</p><button data-a="push-on">🔔 Benachrichtigungen einschalten</button>'+(Notification.permission==='denied'?'<p class="note">Du hast Benachrichtigungen für diese Seite blockiert. Erlaube sie in den Browser- bzw. Handy-Einstellungen.</p>':'');
  h+='<div class="panel"><h3>Benachrichtigungen</h3>'+push+'</div>';
  h+='<button class="ghost" data-a="go" data-v="design">🎨 Design anpassen</button>';
  return h;
}
function drawAch(){
  let h=backBtn+'<h2>Erfolge</h2>';
  if(!me)return h+needAccount('Erfolge');
  if(!profileData)return h+'<p class="note">Lade …</p>';
  if(profileData.err)return h+'<p class="note">Konnte nicht geladen werden.</p>';
  return h+achHtml(profileData)+'<p class="note">Erfolge zählen ab jetzt über alle Partien mit Konto.</p>';
}
function rulesText(r){
  return (r.turn?r.turn+' s pro Zug':'ohne Zeitlimit')+' · Bomben '+(r.bombs?'an':'aus')+' · Stock '+(r.stock?'an':'aus')+' · Ass-Ende = Arschloch '+(r.aceRule?'an':'aus')+' · Weiterlegen '+(r.solo?'an':'aus')+(r.target?' · bis '+r.target+' Punkte':'');
}
function topBar(){
  const s=mySeat(),canPause=running()&&s>=0&&store.online&&!G.paused;
  return '<div class="top"><span>Raum <b>'+esc(code)+'</b>'+(G&&G.round?' · Runde '+G.round:'')+'</span><span class="tb">'+
    (store.online?'<button class="iconbtn" data-a="wheel" title="Emotes">😀</button><button class="iconbtn" data-a="chat" title="Chat" style="position:relative">💬'+(chatUnread?'<span class="badge" style="position:absolute;top:-7px;right:-9px;margin:0">'+chatUnread+'</span>':'')+'</button>':'')+
    (canPause?'<button class="iconbtn" data-a="pause" title="Pause">⏸</button>':'')+'<button class="linkbtn" data-a="leave">Verlassen</button></span></div>'+
    (navigator.onLine===false?'<div class="conn">Keine Internetverbindung – verbinde neu …</div>':'');
}
function pointsTable(g,compact){
  const st=standings(g),n=g.players.length;
  return '<table class="rk"><tr><th>#</th><th>Spieler</th><th>Punkte</th><th>👑</th><th>💩</th></tr>'+
    st.map((x,i)=>'<tr class="'+(g.players[x.s].id===myId?'me':'')+'"><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td><b>'+x.m.pts+'</b></td><td>'+(x.m.pl[0]||0)+'</td><td>'+(x.m.pl[n-1]||0)+'</td></tr>').join('')+'</table>';
}
function drawGame(app){
  if(!G){app.innerHTML='<div class="top"><span>Raum <b>'+esc(code)+'</b></span><button class="linkbtn" data-a="leave">Verlassen</button></div><p class="note">'+(stale?'Das Spiel ist gerade nicht erreichbar. Ich versuche es weiter …':'Lade Spiel …')+'</p>';return}
  const host=G.host===myId,top=topBar(),me_=mySeat();

  if(G.phase==='lobby'){
    const t=total();
    let li=lobby.slice(0,5).map((p,i)=>'<li style="--i:'+i+'"><span><span class="avw">'+avatar(p.av,p.name,p.wins,34)+'<span class="dot'+(online.has(p.id)||p.id===myId?' on':'')+'"></span></span>'+esc(p.name)+(p.id===myId?' (du)':'')+'</span>'+
      (p.id===G.host?'<span class="tag gold">Host</span>':host&&store.online?'<button class="small ghost" data-a="kick" data-v="'+esc(p.id)+'" title="Entfernen">✕</button>':'')+'</li>').join('');
    const LV={easy:'leicht',normal:'normal',hard:'schwer'};
    for(let i=0;i<(G.bots||0);i++)li+='<li><span>'+avatar({e:'🤖',c:'#4a4d52'},'',0,34)+BOTS[i]+'</span><span class="tag">Computer · '+LV[G.botLevel||'normal']+'</span></li>';
    const r=R(G),seg=(k,opts)=>'<div class="seg">'+opts.map(([v,l])=>'<button class="'+(String(r[k])===String(v)?'on':'')+'" data-a="rule" data-k="'+k+'" data-v="'+v+'">'+l+'</button>').join('')+'</div>';
    const rules=host?'<div class="panel"><h3>Hausregeln</h3><div class="rl"><span>Zeit pro Zug</span>'+seg('turn',[[10,'10 s'],[20,'20 s'],[30,'30 s'],[0,'aus']])+'</div>'+
        '<div class="rl"><span>Bomben<small>Vier gleiche Karten schlagen alles</small></span>'+seg('bombs',[[true,'an'],[false,'aus']])+'</div>'+
        '<div class="rl"><span>Stock<small>Bei 3 & 5 Spielern liegen 2 Karten verdeckt, der Bauer darf tauschen</small></span>'+seg('stock',[[true,'an'],[false,'aus']])+'</div>'+
        '<div class="rl"><span>Ass-Ende = Arschloch<small>Mit einem Ass als letzter Karte fertig werden ist erlaubt – man landet dann aber automatisch auf dem letzten Platz</small></span>'+seg('aceRule',[[true,'an'],[false,'aus']])+'</div>'+
        '<div class="rl"><span>Weiterlegen<small>Haben alle gepasst, darf der Letzte allein weiter immer höher legen (gleich viele Karten) und kommt danach neu raus</small></span>'+seg('solo',[[true,'an'],[false,'aus']])+'</div>'+
        '<div class="rl"><span>Partie endet bei</span>'+seg('target',[[0,'offen'],[10,'10 P'],[20,'20 P'],[30,'30 P']])+'</div>'+
        ((G.bots||0)?'<div class="rl"><span>Computer-Stärke</span><div class="seg">'+[['easy','leicht'],['normal','normal'],['hard','schwer']].map(([v,l])=>'<button class="'+((G.botLevel||'normal')===v?'on':'')+'" data-a="botlvl" data-v="'+v+'">'+l+'</button>').join('')+'</div></div>':'')+'</div>'
      :'<div class="panel"><h3>Hausregeln</h3><p class="note" style="margin:0">'+esc(rulesText(r))+((G.bots||0)?' · Computer '+LV[G.botLevel||'normal']:'')+'</p></div>';
    let fr='';
    if(me&&store.online){
      const inLobby=new Set(lobby.map(p=>p.id)),on=friends.filter(f=>f.rel==='friend'&&!inLobby.has(f.uid)).sort((a,b)=>b.online-a.online);
      fr='<div class="panel"><h3>Freunde einladen</h3>'+(on.length?'<ul class="plist">'+on.map(f=>{const sent=seen['inv'+f.uid]&&Date.now()-seen['inv'+f.uid]<60000;
        return '<li><span><span class="avw">'+avatar(f.avatar,f.display,f.wins,36)+'<span class="dot'+(f.online?' on':'')+'"></span></span><span style="display:flex;flex-direction:column"><b style="font-size:16px">'+esc(f.display)+'</b><span class="note">'+(f.online?STATUS[f.status]||'online':'offline')+'</span></span></span>'+
        '<button class="small'+(f.online?'':' ghost')+'" data-a="fr-inv" data-v="'+f.uid+'" '+(sent?'disabled':'')+'>'+(sent?'Eingeladen':'Einladen')+'</button></li>'}).join('')+'</ul>':'<p class="note" style="margin:0">Noch keine Freunde – füg sie auf der Startseite unter „Freunde“ hinzu.</p>')+'</div>';
    }
    app.innerHTML=top+'<div class="panel"><label style="text-align:center">Raumcode</label><div class="code">'+esc(code)+'</div>'+(store.online?'<button class="ghost" data-a="share" style="margin-top:10px">Link teilen</button>':'')+'</div>'+
      '<div class="panel"><label>Am Tisch ('+t+' von 3–5)</label><ul class="plist lob">'+(li||'<li><span class="note">Noch niemand da</span></li>')+'</ul></div>'+
      (host?'<div class="row" style="margin-bottom:10px"><button class="ghost" data-a="bot+" '+(t>=5?'disabled':'')+'>+ Computer</button><button class="ghost" data-a="bot-" '+(G.bots>0?'':'disabled')+'>− Computer</button></div>'+
        '<button data-a="start" '+(t>=3?'':'disabled')+' style="margin-bottom:14px">Spiel starten</button>'+(t<3?'<p class="note" style="text-align:center;margin-top:-6px">Ihr braucht mindestens 3 Spieler.</p>':'')
      :'<p class="note" style="text-align:center">Warte, bis der Host das Spiel startet …</p>')+rules+fr;
    return;
  }
  const n=(G.players||[]).length;
  if(G.phase==='over'){
    const st=standings(G),aw=awards(G),medal=['🥇','🥈','🥉'];
    const rounds=Math.max(0,...st.map(x=>x.m.rounds));
    app.innerHTML=top+'<h1 style="margin-top:6px">Partie vorbei</h1><p class="sub">'+rounds+' Runde'+(rounds===1?'':'n')+' gespielt'+(st[0]&&rounds?' – '+esc(st[0].name)+' gewinnt die Partie!':'')+'</p>'+
      '<div class="panel"><h3>Endstand</h3>'+st.map((x,i)=>{const r=x.m.rounds||0;
        return '<div class="pcard" style="--i:'+i+'"><span class="place">'+(medal[i]||i+1)+'</span>'+avOf(G.players[x.s].id,x.name,x.bot)+'<div style="min-width:0"><b>'+(i===0&&rounds?'<span class="crown">👑</span> ':'')+esc(x.name)+(G.players[x.s].id===myId?' (du)':'')+'</b>'+
        '<div class="det">Präsident '+pct(x.m.pl[0]||0,r)+' · '+(x.m.pl[n-1]||0)+'× Arschloch · '+x.m.aces+' Asse'+(x.m.bombs?' · '+x.m.bombs+' 💣':'')+'</div></div><span class="pts">'+x.m.pts+'</span></div>'}).join('')+'</div>'+
      (aw.length?'<div class="panel"><h3>Auszeichnungen</h3>'+aw.map(a=>'<div class="award"><span class="e">'+a.e+'</span><div><b>'+esc(a.t)+'</b><span>'+esc(a.who.join(', '))+' – '+esc(a.d)+'</span></div></div>').join('')+'</div>':'')+
      (me_>=0?'<button data-a="newmatch" style="margin-bottom:10px">Neue Partie mit denselben Spielern</button>':'')+'<button class="ghost" data-a="lv-just">Zur Startseite</button>';
    return;
  }
  if(G.phase==='end'&&Date.now()>=endHold){
    const li=G.order.map((s,i)=>'<li style="--i:'+i+'"><span><span class="place">'+(i+1)+'</span>'+(i===0?'<span class="crown">👑</span>':'')+esc(nm(G,s))+(s===me_?' (du)':'')+'</span><span class="tag'+(i===0?' gold':'')+'">'+ROLES[n][i]+' · +'+(n-1-i)+'</span></li>').join('');
    const lead=standings(G)[0];
    app.innerHTML=top+'<h1 style="margin-top:6px">'+(G.final?'🏁 Entschieden!':'Runde '+G.round+' vorbei')+'</h1><p class="sub">'+(G.final?esc(lead.name)+' hat '+lead.m.pts+' Punkte erreicht und gewinnt die Partie. ':'')+esc(nm(G,G.order[0]))+' ist Präsident, '+esc(nm(G,G.order[n-1]))+' ist das Arschloch.</p>'+
      '<div class="panel"><ul class="plist">'+li+'</ul></div><div class="panel"><h3>Stand der Partie'+(R(G).target?' · Ziel '+R(G).target+' P':'')+'</h3>'+pointsTable(G)+'</div>'+
      (me_>=0?(G.final?'<button data-a="endmatch">Zur Auswertung</button>':'<button data-a="next" style="margin-bottom:10px">Nächste Runde</button><button class="ghost" data-a="endmatch">Partie beenden & auswerten</button>'):'<p class="note" style="text-align:center">Gleich geht es weiter …</p>');
    return;
  }

  // ----- Spieltisch -----
  let opps='';
  for(let i=1;i<=n;i++){
    const s=((me_<0?-1:me_)+i+n)%n;if(s===me_)continue;
    const p=G.players[s],cnt=G.hands[s].length,place=G.finished.indexOf(s),lost=(G.losers||[]).includes(s),open=(G.open||[]).includes(s)&&cnt>0;
    const st=lost?'Ass-Ende ✗':place>=0?'fertig ('+(place+1)+'.)':G.passed.includes(s)?'passt':'';
    const oh=open?'<div class="oh">'+G.hands[s].map(c=>'<span class="oc'+(su(c)===1||su(c)===2?' red':'')+'">'+RANKS[rk(c)]+'<i>'+SUITS[su(c)]+'</i></span>').join('')+'</div>':'';
    const conn=p.bot||!store.online||online.has(p.id);
    opps+='<div class="opp'+(G.turn===s&&!G.paused?' turn':'')+'" data-s="'+s+'"><div class="n"><span class="avw">'+avOf(p.id,p.name,p.bot)+'<span class="dot'+(conn?' on':'')+'" title="'+(conn?'verbunden':'nicht verbunden')+'"></span></span>'+esc(p.name)+'</div><div class="r">'+esc(roleOf(G,s))+(open?(roleOf(G,s)?' · ':'')+'spielt offen':'')+'</div><div class="c"><span>'+(place>=0||lost?'–':cnt+' Karten')+'</span><span>'+(G.turn===s&&G.phase==='play'&&!p.bot?'<span id="tm" class="tm"></span>':st)+'</span></div>'+oh+'</div>';
  }
  const inStock=G.phase==='stock'&&G.stock&&G.stock.length===2;
  const pk=inStock?'stock'+G.round:pileKey(G);
  let pile='<div class="empty"></div>',pcls='';
  if(inStock){
    pile=G.stock.map((c,i)=>G.turn===me_?cardHtml(c,'','style="margin:0 5px;--i:'+i+'"'):'<div class="card back" style="margin:0 5px;--i:'+i+'"></div>').join('');
    if(pk!==seen.pile)pcls+=' in';
  }else if(G.pile&&G.phase!=='wish'&&G.phase!=='swap'){
    pile=G.pile.cards.map((c,i)=>cardHtml(c,'','style="--r:'+(((c*37)%11)-5)+'deg;--i:'+i+'"')).join('');
    if(pk!==seen.pile)pcls+=' in'+(G.pile.by===me_?' mine':'');
    if(G.pile.closed)pcls+=seen.closed===pk?' closed':' closed closing';
  }
  seen.pile=pk;seen.closed=!inStock&&G.pile&&G.pile.closed?pk:'';
  let status='',mine=false,goLabel='Legen',goOk=false,passOk=false,wishUi='';
  const cs=[...sel];
  if(G.phase==='end'){status='Runde vorbei!'}
  else if(G.phase==='wish'){
    const q=G.wishQ[0];
    if(G.turn===me_){
      mine=true;status='Wünsch dir '+(q.n===1?'eine Karte':'bis zu 2 Karten')+' von '+esc(nm(G,q.lo))+'.';
      wishUi='<div class="wish"><div class="wr">'+RANKS.map((r,i)=>'<button class="ghost" data-a="wr" data-v="'+i+'" '+(wishSel.length>=q.n?'disabled':'')+'>'+r+'</button>').join('')+'</div>'+
        '<div class="chosen">'+(wishSel.length?'Dein Wunsch: '+wishSel.map((r,i)=>'<button class="ghost chip" data-a="wx" data-v="'+i+'">'+RANKS[r]+' ✕</button>').join(''):
          (q.n===1?'Ohne Wunsch bekommst du die beste Karte. Hat '+esc(nm(G,q.lo))+' deine Wunschkarte nicht, gibt es die beste.':'Ohne Wunsch bekommst du die 2 besten Karten. Fehlt eine gewünschte Karte, gibt es dafür die beste.'))+'</div>'+
        '<button data-a="wish">'+(wishSel.length?'Wünschen':(q.n===1?'Beste Karte nehmen':'2 beste Karten nehmen'))+'</button></div>';
    }else status=esc(nm(G,G.turn))+' wünscht sich '+(q.n===1?'eine Karte':'Karten')+' …';
  }else if(inStock){
    if(G.turn===me_){mine=true;status='Der Stock: Nimm beide (wähle dafür 2 eigene Karten zum Ablegen) oder lass sie liegen.';goLabel='Tauschen';goOk=canStock(G,me_,cs)}
    else status=esc(nm(G,G.turn))+' (Bauer) schaut sich den Stock an …';
  }else if(G.phase==='swap'){
    const sw=G.swaps[0];
    if(G.turn===me_){mine=true;status='Wähle '+sw.n+' Karte'+(sw.n>1?'n':'')+' für '+esc(nm(G,sw.to))+' ('+ROLES[n][G.roles[sw.to]]+').';goLabel='Abgeben';goOk=canGive(G,me_,cs)}
    else status=esc(nm(G,G.turn))+' sucht Karten zum Tauschen aus …';
  }else if(G.turn===me_){
    mine=true;
    if(isFree(G))status='Du kommst raus – leg eine oder mehrere gleiche Karten.';
    else{const k=G.pile.cards.length,need=(k>1?k+' gleiche Karten':'eine Karte')+' höher als '+RANKS[rk(G.pile.cards[0])];
      status=G.solo?'Alle haben gepasst – du darfst allein weiterlegen: '+need+'. Oder aufhören und neu rauskommen.':'Du bist dran: '+need+(k<4?', eine Bombe':'')+' – oder passen.'}
    if(G.hands[me_].every(c=>rk(c)===7))status+=' Achtung: Mit Ass aufhören heißt automatisch Letzter!';
    status+='<span id="tm" class="tm"></span>';
    goOk=canPlay(G,me_,cs);passOk=canPass(G,me_);
  }else status=esc(nm(G,G.turn))+(G.solo&&G.phase==='play'?' legt allein weiter …':' ist dran …');
  if(G.paused){mine=false;status='Pausiert'}
  const tk=G.turn+'|'+G.phase+'|'+pk,stNew=mine&&tk!==seen.turn;seen.turn=tk;
  const msgNew=G.msg!==seen.msg;seen.msg=G.msg;
  let hand='',dealAnim=false;
  if(me_>=0){
    const fr=G.fresh[me_]||[],frs=fr.join(',');
    dealAnim=G.round!==seen.round||(frs&&frs!==seen.fresh);seen.fresh=frs;
    // Legbare Karten markieren (nur wenn man dran ist und ein Stich zu schlagen ist)
    const canMark=G.phase==='play'&&G.turn===me_&&!G.paused&&!isFree(G);
    const okR=canMark?new Set(legalMoves(G,me_).map(m=>rk(m[0]))):null;
    hand=G.hands[me_].map((c,i)=>cardHtml(c,(sel.has(c)?'sel':'')+(fr.includes(c)?' fresh':'')+(okR?(okR.has(rk(c))?' ok':' no'):''),(G.phase==='wish'||G.phase==='end'?'':'data-a="card" ')+'data-v="'+c+'" style="--i:'+i+'"')).join('');
    if(!G.hands[me_].length)hand=(G.losers||[]).includes(me_)?'<p class="note">Mit Ass beendet – du landest automatisch ganz hinten. 😬</p>':'<p class="note">Du bist fertig – Platz '+(G.finished.indexOf(me_)+1)+'. 🎉</p>';
  }else hand='<p class="note">Du schaust nur zu.</p>';
  seen.round=G.round;
  const pauseBox=G.paused?'<div class="pausebox"><b>⏸ Pausiert</b><span>von '+esc(G.paused.by)+'</span>'+(me_>=0&&(!G.paused.uid||G.paused.uid===myId)?'<button data-a="unpause">Weiterspielen</button>':me_>=0?'<span class="note">Nur '+esc(G.paused.by)+' kann fortsetzen.</span>':'')+'</div>':'';
  const stHtml='<div class="status'+(mine?' me':'')+(stNew?' new':'')+'">'+status+'</div>';
  const meHtml=me_>=0?'<div class="mebar"><span>'+esc(nm(G,me_))+(roleOf(G,me_)?' · '+esc(roleOf(G,me_)):'')+((G.open||[]).includes(me_)?' · du spielst offen':'')+'</span><span>'+((G.ms&&G.ms[me_]&&G.ms[me_].pts)||0)+' Pkt · '+G.hands[me_].length+' Karten</span></div>':'';
  const handHtml='<div class="hand'+(dealAnim?' deal':'')+(wishUi?' mini':'')+'">'+hand+'</div>';
  const left=inStock&&G.turn===me_?'<button class="ghost" data-a="skip">Liegen lassen</button>':'<button class="ghost" data-a="pass" '+(passOk?'':'disabled')+'>'+(G.solo&&G.turn===me_?'Aufhören':'Passen')+'</button>';
  const showHg=G.phase==='play'&&G.turn===me_&&!G.paused;
  app.innerHTML=top+'<div class="opps">'+opps+'</div>'+
    '<div class="table'+(wishUi?' small':'')+'"><div class="pile'+pcls+'">'+pile+'</div><div class="msg'+(msgNew?' new':'')+'">'+esc(G.msg||'')+'</div>'+(showHg?HG:'')+pauseBox+'</div>'+
    (wishUi?stHtml+wishUi+meHtml+handHtml:
      stHtml+meHtml+handHtml+(me_>=0&&G.hands[me_].length&&G.phase!=='end'?'<div class="actions">'+left+'<button id="do" data-a="do" '+(goOk?'':'disabled')+'>'+goLabel+'</button></div>':''));
  tick();
}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1).toUpperCase();if(ready&&store.online&&/^[A-Z]{4}$/.test(h)&&h!==code){if(myName){if(code)leave();joinRoom(h)}else{drafts.code=h;render()}}});
init();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
